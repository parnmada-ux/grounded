<!DOCTYPE html>
<html lang="en">
<head>

        extend: {
          colors: {
            'g-green':    '#5B8A72',

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #D5DDD7;
      color: #333333;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .font-display {
      font-family: 'Crimson Text', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.005em;
    }
    .stage {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .phone-frame {
      width: 393px; height: 852px;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      background: #E8F0EC;
      border-radius: 36px;
      box-shadow:
        0 24px 60px rgba(61, 94, 76, 0.18),
        0 0 0 8px #2a2a2a,
        0 0 0 9px #444;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
    }
    @media (max-width: 480px) {
      body { background: #E8F0EC; }
      .stage { padding: 0; }
      .phone-frame {
        width: 100%; height: 100vh; height: 100dvh;
        max-height: none; border-radius: 0; box-shadow: none;
      }
    }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .btn-pill {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 38px;
      border-radius: 999px;
      font-weight: 600; font-size: 15px;
      transition: all 0.2s ease;
      border: 0; cursor: pointer; line-height: 1;
    }
    .btn-pill-primary  { background: #5B8A72; color: white; }
    .btn-pill-primary:active { background: #3D5E4C; transform: scale(0.98); }
    .btn-pill-disabled { background: #B8C8BD; color: white; cursor: not-allowed; }
    .card {
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(61, 94, 76, 0.04), 0 4px 12px rgba(61, 94, 76, 0.04);

    .card-outline {
      background: #FFFFFF;
      border: 1px solid #D9DEDB;
      border-radius: 18px;
    }
    .chip {
      flex: 1; text-align: center; padding: 8px 4px;
      font-size: 14px; font-weight: 500; color: #888888;
      cursor: pointer; background: transparent; border: 0;
      transition: all 0.2s ease;
    }
    .chip.selected { color: #5B8A72; font-weight: 700; }
    .vchip {
      padding: 8px 16px; border-radius: 999px;
      font-size: 14px; font-weight: 500;
      background: #FFFFFF; color: #333333;
      border: 1px solid #D9DEDB;
      cursor: pointer; transition: all 0.15s ease; line-height: 1;
    }
    .vchip.selected { color: #5B8A72; font-weight: 700; border-color: #5B8A72; }
    .vchip:disabled { opacity: 0.45; cursor: not-allowed; }
    .input-field {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      background: #FFFFFF; border: 1px solid #D9DEDB;
      font-size: 15px; color: #333333; outline: none;
      transition: border-color 0.15s ease;
    }
    .input-field:focus { border-color: #5B8A72; }
    .input-field::placeholder { color: #B0B6B2; }
    .textarea-field {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      background: #FFFFFF; border: 1px solid #D9DEDB;
      font-size: 15px; color: #333333; outline: none;
      resize: none; font-family: inherit;
    }
    .textarea-field:focus { border-color: #5B8A72; }
    .textarea-field::placeholder { color: #B0B6B2; }
    .social-btn {
      width: 100%; display: flex; align-items: center; justify-content: center;

      border-radius: 14px; background: #FFFFFF;
      border: 1px solid #D9DEDB;
      font-size: 15px; font-weight: 600; color: #333333;
      cursor: pointer; transition: background 0.15s ease;

    .nav-tab {
      flex: 1; text-align: center;
      padding: 12px 0 18px;
      font-size: 14px; color: #888888;
      cursor: pointer; background: transparent; border: 0;
    }
    .nav-tab.active { color: #5B8A72; font-weight: 600; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .numbered-input {
      width: 100%; border: 0; outline: none;
      background: transparent; font-size: 15px;
      color: #333333; padding: 4px 0;
      font-family: inherit;
    }
    .numbered-input::placeholder { color: #B0B6B2; }

    .cal-cell {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #333333;
      position: relative; cursor: default;
    }
    .cal-dot::after {
      content: ''; position: absolute;
      width: 6px; height: 6px; border-radius: 50%;
      background: #5B8A72;
      right: 4px; top: 4px;

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================
    // STORAGE
    // ============================================================
    const LS_KEY = 'grounded_v1';
    const loadData = () => {
      try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : {}; }
      catch { return {}; }
    };
    const saveData = (data) => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
    };

    // ============================================================
    // DATE HELPERS
    // ============================================================
    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const monthName = (m) => ['January','February','March','April','May','June','July','August','September','October','November','December'][m];
    const monthDay = () => {
      const d = new Date();
      return `${monthName(d.getMonth())} ${d.getDate()}`;
    };
    // ISO week key 'YYYY-Www'
    const weekKey = (date = new Date()) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      const firstThursday = d.valueOf();
      d.setUTCMonth(0, 1);
      if (d.getUTCDay() !== 4) {
        d.setUTCMonth(0, 1 + ((4 - d.getUTCDay()) + 7) % 7);
      }
      const wk = 1 + Math.ceil((firstThursday - d.valueOf()) / 604800000);
      return `${date.getFullYear()}-W${String(wk).padStart(2, '0')}`;
    };

    // ============================================================
    // SUGGESTION POOL — 24 values × 3 missions
    // (Parn — feel free to refine copy on any of these)
    // ============================================================
    const SUGGESTION_POOL = {
      Freedom: [
        { emoji:'🌿', body:'"Take yourself somewhere new — even a café you haven\'t been to."' },
        { emoji:'🎒', body:'"Plan a solo half-day adventure with no agenda."' },
        { emoji:'🚪', body:'"Say no to one thing this week that doesn\'t align with you."' },
      ],
      Independence: [
        { emoji:'🛠️', body:'"Try fixing or learning something new — without asking for help."' },
        { emoji:'🍳', body:'"Cook a meal entirely from your own decisions."' },
        { emoji:'📚', body:'"Spend an afternoon doing exactly what you want — no input from anyone."' },
      ],
      Creativity: [
        { emoji:'🎨', body:'"Find a pottery class or art workshop near you this weekend."' },
        { emoji:'✏️', body:'"Sketch one thing today — even if it\'s ugly."' },
        { emoji:'📝', body:'"Write 3 lines of poetry, song, or anything that wants to come out."' },
      ],
      Curiosity: [
        { emoji:'🧠', body:'"Watch a documentary on something completely outside your field."' },
        { emoji:'❓', body:'"Ask a stranger one curious question this week."' },
        { emoji:'🔍', body:'"Pick a random Wikipedia article and read it fully."' },
      ],
      Success: [
        { emoji:'🎯', body:'"Set one tiny goal for tomorrow — and finish it."' },
        { emoji:'📈', body:'"Track your progress on something you\'re proud of."' },
        { emoji:'🏆', body:'"Celebrate a recent win — even if it feels small."' },
      ],
      Ambition: [
        { emoji:'🚀', body:'"Write down a dream goal — and one tiny first step."' },
        { emoji:'📅', body:'"Block 30 minutes this week for the thing you keep postponing."' },
        { emoji:'🌟', body:'"Reach out to someone whose work you admire."' },
      ],
      Growth: [
        { emoji:'🌱', body:'"Try one thing this week that scares you a little."' },
        { emoji:'📖', body:'"Read 10 pages of a book that challenges you."' },
        { emoji:'🪞', body:'"Reflect on one belief you\'ve outgrown."' },
      ],
      Impact: [
        { emoji:'🤝', body:'"Do one small thing for someone with no expectation of return."' },
        { emoji:'💌', body:'"Write a thank-you note to someone who shaped you."' },
        { emoji:'🌍', body:'"Donate or volunteer — even just 30 minutes."' },
      ],
      Family: [
        { emoji:'📞', body:'"Call a family member just to hear their voice."' },
        { emoji:'🍵', body:'"Have an unhurried meal with someone you love."' },
        { emoji:'🖼️', body:'"Look through old family photos for 10 minutes."' },
      ],
      Friendship: [
        { emoji:'👥', body:'"Reach out to one person who makes you feel like yourself."' },
        { emoji:'☕', body:'"Plan a coffee with a friend you haven\'t seen lately."' },
        { emoji:'💬', body:'"Send a voice note to a friend instead of a text."' },
      ],
      Love: [
        { emoji:'💝', body:'"Do something small and thoughtful for someone you love."' },
        { emoji:'💌', body:'"Tell someone exactly why they matter to you."' },
        { emoji:'🌹', body:'"Plan a tiny surprise for someone close — or yourself."' },
      ],
      Belonging: [
        { emoji:'🫂', body:'"Show up somewhere your people gather — even briefly."' },
        { emoji:'🎉', body:'"Join a community event, online or off, this week."' },
        { emoji:'🤲', body:'"Share a part of yourself with someone safe."' },
      ],
      Stability: [
        { emoji:'🛏️', body:'"Reset one small corner of your space tonight."' },
        { emoji:'📋', body:'"Write down a tiny routine that grounds your week."' },
        { emoji:'💰', body:'"Spend 15 min on something that future-you will thank you for."' },
      ],
      Health: [
        { emoji:'🚶', body:'"Take a 20-minute walk outside — phone-free."' },
        { emoji:'🥗', body:'"Make one meal that nourishes you."' },
        { emoji:'😴', body:'"Get to bed 30 minutes earlier tonight."' },
      ],
      Peace: [
        { emoji:'🧘', body:'"Sit in silence for 5 minutes — no input."' },
        { emoji:'🌅', body:'"Watch a sunrise or sunset slowly, with no phone."' },
        { emoji:'🛁', body:'"Take a long bath, shower, or rest with no agenda."' },
      ],
      Adventure: [
        { emoji:'🗺️', body:'"Go to a part of your city you\'ve never been to."' },
        { emoji:'🥾', body:'"Plan a small day trip somewhere unfamiliar."' },
        { emoji:'🌄', body:'"Try one thing this week you\'ve never done before."' },
      ],
      Fun: [
        { emoji:'🎮', body:'"Play a game just for the joy of it."' },
        { emoji:'🎭', body:'"Watch or do something that makes you laugh out loud."' },
        { emoji:'💃', body:'"Put on a song and move to it — even alone."' },
      ],
      Kindness: [
        { emoji:'☀️', body:'"Compliment a stranger or coworker today."' },
        { emoji:'💛', body:'"Do one anonymous kind thing this week."' },
        { emoji:'🤲', body:'"Forgive yourself for one thing you\'ve been holding."' },
      ],
      Honesty: [
        { emoji:'🪞', body:'"Have one honest conversation you\'ve been avoiding."' },
        { emoji:'📓', body:'"Journal what you really feel — without editing."' },
        { emoji:'🗣️', body:'"Tell someone what you actually need this week."' },
      ],
      Loyalty: [
        { emoji:'🤝', body:'"Show up for someone who once showed up for you."' },
        { emoji:'📩', body:'"Check in on a long-time friend with no agenda."' },
        { emoji:'🛡️', body:'"Stand by a quiet promise you made to yourself."' },
      ],
      Justice: [
        { emoji:'⚖️', body:'"Speak up gently for someone whose voice was missed today."' },
        { emoji:'📰', body:'"Learn one new thing about a cause you care about."' },
        { emoji:'✍️', body:'"Sign or share something for an issue that matters to you."' },
      ],
      Nature: [
        { emoji:'🌳', body:'"Spend 20 minutes near trees, water, or open sky."' },
        { emoji:'🌸', body:'"Notice 5 living things on your walk today."' },
        { emoji:'🌧️', body:'"Step outside in the weather — whatever it is."' },
      ],
      Spirituality: [
        { emoji:'🕯️', body:'"Light a candle and sit with your thoughts for 5 minutes."' },
        { emoji:'🙏', body:'"Pray, meditate, or pause in stillness today."' },
        { emoji:'📿', body:'"Read one page of a text that grounds you."' },
      ],
      Gratitude: [
        { emoji:'🌷', body:'"Write 3 things you\'re grateful for tonight."' },
        { emoji:'💌', body:'"Tell one person why you appreciate them."' },
        { emoji:'☀️', body:'"Notice something beautiful that you usually miss."' },
      ],
    };

    const allMissionsForValues = (values) => {
      const out = [];
      (values || []).forEach(v => {
        const list = SUGGESTION_POOL[v] || [];
        list.forEach((m, idx) => out.push({ id: `${v}-${idx}`, valueKey: v, ...m }));
      });
      return out;
    };
    const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // build initial 3 cards: 1 random per core value (or fill from pool union if <3 core values)
    // Each card carries its own ticked flag; slots always remain 3 across the week.
    const initLaunchpadWeek = (topValues) => {
      const tv = (topValues && topValues.length) ? topValues : ['Freedom','Creativity','Growth'];
      const seen = new Set();
      const shown = [];
      tv.forEach(v => {
        const list = (SUGGESTION_POOL[v] || []).map((m, idx) => ({ id: `${v}-${idx}`, valueKey: v, ...m, ticked: false }));
        const m = pickRandom(list);
        if (m && !seen.has(m.id)) { shown.push(m); seen.add(m.id); }
      });
      // if less than 3, fill from union
      const all = allMissionsForValues(tv).filter(m => !seen.has(m.id)).map(m => ({ ...m, ticked: false }));
      while (shown.length < 3 && all.length) {
        const idx = Math.floor(Math.random() * all.length);
        const m = all.splice(idx, 1)[0];
        shown.push(m); seen.add(m.id);
      }
      return {
        weekKey: weekKey(),
        shown,
        used: [],
        remainingReloads: 2,
      };
    };

    // ============================================================
    // SHARED COMPONENTS
    // ============================================================
    const Logo = ({ size = 'lg' }) => {
      const sizes = { md: 'text-4xl', lg: 'text-5xl', xl: 'text-6xl' };
      return <div className={`font-display text-g-green ${sizes[size]}`}>Grounded</div>;
    };

    const PillButton = ({ onClick, children, disabled = false, className = '' }) => (
      <button
        onClick={disabled ? undefined : onClick}
        className={`btn-pill ${disabled ? 'btn-pill-disabled' : 'btn-pill-primary'} ${className}`}
      >{children}</button>
    );

    const BackArrow = ({ onClick, label = '' }) => (
      <button onClick={onClick}
        className="text-g-charcoal flex items-center gap-2 text-base"
        aria-label="Back">
        <span style={{fontSize: '22px', lineHeight: 1, fontWeight: 300}}>←</span>
        {label && <span className="underline">{label}</span>}
      </button>
    );

    const BottomNav = ({ active, onNav }) => (
      <div className="flex items-center border-t border-g-line bg-g-sage"
           style={{paddingBottom: 'env(safe-area-inset-bottom, 0px)'}}>
        {[
          { key: 'home',     label: 'Home' },
          { key: 'practice', label: 'Practice' },
          { key: 'mirror',   label: 'Profile' },
          { key: 'settings', label: 'Settings' },
        ].map(t => (
          <button key={t.key} onClick={() => onNav(t.key)}
            className={`nav-tab ${active === t.key ? 'active' : ''}`}>{t.label}</button>
        ))}
      </div>
    );

    // ============================================================
    // BRAND ICONS (Google / Apple / Facebook) — inline SVG
    // ============================================================
    const GoogleIcon = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4818h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.6154z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.806.54-1.8368.8591-3.0477.8591-2.344 0-4.3282-1.5831-5.036-3.7104H.9573v2.3318C2.4382 15.9831 5.4818 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2823-1.1168-.2823-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 000 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"/>
        <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z"/>
      </svg>
    );
    const AppleIcon = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#000" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
    );
    const FacebookIcon = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="11" fill="#1877F2"/>
        <path fill="#FFFFFF" d="M14.4 12.5h-2.1V20h-3v-7.5H7.5v-2.7h1.8V8c0-2.05 1.22-3.18 3.1-3.18.9 0 1.84.16 1.84.16v2.04h-1.04c-1.02 0-1.34.63-1.34 1.28v1.55h2.28l-.36 2.65z"/>
      </svg>
    );

    // Generic month calendar grid with green dots on flagged days
    const MonthCalendar = ({ hasDot, onPick, selected }) => {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const offset = (firstDay.getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      return (
        <div className="card-outline p-3 mt-4">
          <div className="grid grid-cols-7 gap-1 mb-1">
            {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => (
              <div key={d} className="text-center text-g-charcoal font-bold text-xs py-1">{d}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              const dotted = d != null && hasDot(d);
              const isSel = d != null && selected === d;
              return (
                <div key={i}
                  onClick={() => dotted && onPick(d)}
                  className={`cal-cell ${dotted ? 'cal-dot cursor-pointer' : ''} ${isSel ? 'font-bold' : ''}`}>
                  {d || ''}
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // ============================================================
    // 1. WELCOME
    // ============================================================
    const WelcomeScreen = ({ onBegin, onLogin }) => (
      <div className="phone-frame fade-in">
        <div className="flex-1 flex flex-col items-center justify-center text-center px-8">
          <Logo size="xl" />

      const [five, setFive] = useState((data.fiveValues && data.fiveValues.length) ? [...data.fiveValues] : []);

      const toggleFive = (v) => {
        if (five.includes(v)) {
          // removing — also remove from three if was there
          setFive(five.filter(x => x !== v));
          if (three.includes(v)) setThree(three.filter(x => x !== v));
        } else if (five.length < 5) {
          setFive([...five, v]);

      };
      const toggleThree = (v) => {
        if (!five.includes(v)) return; // must be in 5
        if (three.includes(v)) setThree(three.filter(x => x !== v));
        else if (three.length < 3) setThree([...three, v]);
      };
      const canSave = five.length === 5 && three.length === 3;

      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <button onClick={() => canSave && onSave({ fiveValues: five, topValues: three })}

          <div className="pt-3 pb-7 flex justify-center">

    // ============================================================
    // APP — Screen Router

    const App = () => {
      const [screen, setScreen]   = useState('welcome');
      const [data, setData]       = useState(loadData());
      const [showDev, setShowDev] = useState(true);
      const [activeExerciseId, setActiveExerciseId] = useState(null);
      const [groundMeFrom, setGroundMeFrom] = useState('gm_triage');
      const [activeMirrorField, setActiveMirrorField] = useState(null);

      useEffect(() => { saveData(data); }, [data]);
      const updateData = (patch) => setData(prev => ({ ...prev, ...patch }));
      const go = (next) => setScreen(next);

      const navTo = (key) => {
        if (key === 'home')     return go('home');
        if (key === 'practice') {
          if (!data.practiceWelcomeSeen) return go('practice_welcome');
          return go('my_practice');
        }
        if (key === 'mirror')   return go('my_mirror');
        if (key === 'settings') return go('settings');
      };

      const myExercises = (data.myExercises && data.myExercises.length)
        ? data.myExercises
        : ALL_EXERCISES.slice(0, 3).map(e => e.id);

      const toggleStoreExercise = (id) => {
        const cur = (data.myExercises && data.myExercises.length)
          ? [...data.myExercises]
          : ALL_EXERCISES.slice(0, 3).map(e => e.id);
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        else cur.push(id);
        updateData({ myExercises: cur });
      };

      const removeFromPractice = (id) => {
        const cur = [...myExercises];
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        updateData({ myExercises: cur });
      };

      const saveExerciseEntry = (id, items) => {
        const today = todayKey();
        const completed = { ...(data.completed || {}) };
        completed[today] = { ...(completed[today] || {}), [id]: items };
        updateData({ completed });
      };

      const saveReflection = (q, a) => {
        const today = todayKey();
        const reflections = { ...(data.reflections || {}) };
        reflections[today] = { q, a };
        updateData({ reflections });
      };

      const saveFreeWrite = (text) => {
        const today = todayKey();
        const freeWrites = { ...(data.freeWrites || {}) };
        if (text && text.trim()) {
          freeWrites[today] = text;
        } else {
          delete freeWrites[today];
        }
        updateData({ freeWrites });
      };

      // Mirror history — merge fields into today's entry, only changed fields
      const saveMirrorChanges = (patch) => {
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        const todayEntry = { ...(mirrorHistory[today] || {}) };
        const fieldPatch = {};
        Object.keys(patch).forEach(k => {
          const oldVal = data[k];
          const newVal = patch[k];
          if (Array.isArray(newVal)) {
            const same = Array.isArray(oldVal) && oldVal.length === newVal.length && oldVal.every((v, i) => v === newVal[i]);
            if (!same) fieldPatch[k] = newVal;
          } else if (newVal !== oldVal) {
            fieldPatch[k] = newVal;
          }
        });
        if (Object.keys(fieldPatch).length > 0) {
          mirrorHistory[today] = { ...todayEntry, ...fieldPatch };
        }
        updateData({ ...patch, mirrorHistory });
      };

      const ensureMirrorBaseline = () => {
        if (data.mirrorBaselineDate) return;
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        mirrorHistory[today] = {
          isBaseline: true,
          fiveValues: data.fiveValues || [],
          topValues: data.topValues || [],
          comfortable: data.comfortable || '',
          uncomfortable: data.uncomfortable || '',
          alignedSelf: data.alignedSelf || '',
          whatHelps: data.whatHelps || '',
          quote: data.quote || '',
        };
        updateData({ mirrorHistory, mirrorBaselineDate: today });
      };

      // Launchpad — ensure week initialized + matches current week
      const ensureLaunchpadWeek = () => {
        const wk = weekKey();
        const cur = data.launchpadWeek;
        if (!cur || cur.weekKey !== wk) {
          updateData({ launchpadWeek: initLaunchpadWeek(data.topValues) });
        }
      };

      const tickLaunchpad = (id, slotIdx) => {
        const wk = data.launchpadWeek;
        if (!wk) return;
        const idx = (typeof slotIdx === 'number' && wk.shown[slotIdx] && wk.shown[slotIdx].id === id)
          ? slotIdx
          : wk.shown.findIndex(s => s.id === id);
        if (idx < 0) return;
        const card = wk.shown[idx];
        if (card.ticked) return; // already ticked, ignore

        const today = todayKey();
        const launchpadHistory = { ...(data.launchpadHistory || {}) };
        const todayList = [...(launchpadHistory[today] || [])];
        todayList.push({ id: card.id, valueKey: card.valueKey, emoji: card.emoji, body: card.body, tickedAt: Date.now() });
        launchpadHistory[today] = todayList;

        const newUsed = [...wk.used, card.id];
        let remaining = wk.remainingReloads;
        const newShown = wk.shown.slice();

        if (remaining > 0) {
          // replace this slot with a fresh card from the pool
          const tv = (data.topValues && data.topValues.length) ? data.topValues : ['Freedom','Creativity','Growth'];
          const seenIds = new Set([...newUsed, ...newShown.map(s => s.id)]);
          const pool = allMissionsForValues(tv).filter(m => !seenIds.has(m.id));
          if (pool.length) {
            const pickIdx = Math.floor(Math.random() * pool.length);
            newShown[idx] = { ...pool[pickIdx], ticked: false };
            remaining -= 1;
          } else {
            // pool empty — keep card in place but mark ticked
            newShown[idx] = { ...card, ticked: true };
          }
        } else {
          // reloads exhausted — keep card visible, mark as ticked (faded UI)
          newShown[idx] = { ...card, ticked: true };
        }

        updateData({
          launchpadHistory,
          launchpadWeek: { ...wk, shown: newShown, used: newUsed, remainingReloads: remaining },
        });
      };

      // Ground Me — record visit when sub-screen finalized (Take a moment / Need to talk / I remember now)
      const recordGroundMe = (triage, sub) => {
        const today = todayKey();
        const groundMeHistory = { ...(data.groundMeHistory || {}) };
        const list = [...(groundMeHistory[today] || [])];
        list.push({ triage, sub, time: Date.now() });
        groundMeHistory[today] = list;
        updateData({ groundMeHistory });
      };

      const triageOf = (target) => {
        if (target === 'gm_reminder') return 'reminder';
        if (target === 'gm_struggling') return 'struggling';
        if (target === 'gm_hard') return 'hard';
        return null;
      };
      const [pendingTriage, setPendingTriage] = useState(null);

      let view = null;
      switch (screen) {
        case 'welcome':
          view = <WelcomeScreen onBegin={() => go('resonance')} onLogin={() => go('signin')} />; break;
        case 'resonance':
          view = <ResonanceCheck
            onBack={() => go('welcome')}
            onComplete={(r) => go(r === 'in_right_place' ? 'in_right_place' : 'grounded_already')}
          />; break;
        case 'in_right_place':
          view = <InRightPlace onContinue={() => go('promise')} />; break;
        case 'grounded_already':
          view = <GroundedAlready onCheckOut={() => go('promise')} onLater={() => go('well_be_here')} />; break;
        case 'well_be_here':
          view = <WellBeHere onBack={() => go('welcome')} />; break;
        case 'promise':
          view = <PromiseScreen onContinue={() => go('signup')} onBack={() => go('in_right_place')} />; break;
        case 'signup':
          view = <SignUpScreen
            onCreate={(u) => { updateData({ user: u }); go('values'); }}
            onSignIn={() => go('signin')}
            onBack={() => go('promise')}
          />; break;
        case 'signin':
          view = <SignInScreen
            onSignIn={(u) => { updateData({ user: u }); go('home'); }}
            onSignUp={() => go('signup')}
            onBack={() => go('welcome')}
          />; break;
        case 'values':
          view = <ValuesStep
            initial={data.fiveValues || []}
            onContinue={(v) => { updateData({ fiveValues: v }); go('top3'); }}
            onSkip={() => go('no_worries')}
            onBack={() => go('promise')}
          />; break;
        case 'no_worries':
          view = <ReassureScreen heading="No worries !"
            lines={[
              'Knowing your values takes time. You can continue for now.',
              'Later, we\'ll have a short quiz to help you discover what truly matters to you.',
            ]}
            onContinue={() => go('comfort')} />; break;
        case 'top3':
          view = <TopThreeStep
            pool={data.fiveValues || []}
            onContinue={(t) => { updateData({ topValues: t }); go('comfort'); }}
            onBack={() => go('values')}
          />; break;
        case 'comfort':
          view = <ComfortStep
            initial={{ comfortable: data.comfortable, uncomfortable: data.uncomfortable }}
            onContinue={(o) => { updateData(o); go('aligned_self'); }}
            onSkip={() => go('thats_okay')}
            onBack={() => go('top3')}
          />; break;
        case 'thats_okay':
          view = <ReassureScreen heading="That's okay !"
            lines={[
              'Sometimes it\'s hard to know what gives or drains your energy.',
              'You can come back anytime and update this in your profile.',
            ]}
            onContinue={() => go('aligned_self')} />; break;
        case 'aligned_self':
          view = <AlignedSelfStep
            initial={data.alignedSelf || ''}
            onContinue={(t) => { updateData({ alignedSelf: t }); go('mirror_ready'); }}
            onSkip={() => go('no_pressure')}
            onBack={() => go('comfort')}
          />; break;
        case 'no_pressure':
          view = <ReassureScreen heading="No pressure !"
            lines={[
              'Describing your aligned self isn\'t easy — it can take reflection.',
              'Your mirror will still be here. You can add this whenever you\'re ready.',

            onContinue={() => go('mirror_ready')} />; break;
        case 'mirror_ready':
          view = <MirrorReady data={data} onContinue={() => { ensureMirrorBaseline(); go('home'); }} />; break;
        case 'home':
          view = <HomeScreen
            data={data}
            onReflect={() => go('reflection')}
            onLaunchpad={() => { ensureLaunchpadWeek(); go('launchpad'); }}
            onFreeWrite={() => go('freewrite')}
            onGroundMe={() => go('gm_triage')}
            onNav={navTo}
          />; break;
        case 'reflection':
          view = <ReflectionScreen data={data}
            onSave={(q, a) => { saveReflection(q, a); go('home'); }}
            onSkip={() => go('home')}
            onHome={() => go('home')}
            onHistory={() => go('reflection_calendar')} />; break;
        case 'reflection_calendar':

        case 'freewrite':
          view = <FreeWriteScreen data={data}
            onDone={(t) => { saveFreeWrite(t); go('home'); }}

            onHistory={() => go('freewrite_calendar')} />; break;
        case 'freewrite_calendar':
          view = <FreeWriteCalendar data={data} onBack={() => go('freewrite')} />; break;

        // ==== GROUND ME ====
        case 'gm_triage':
          view = <GroundMeTriage
            onPick={(target, tri) => { setGroundMeFrom(target); setPendingTriage(tri); go(target); }}

        case 'gm_struggling':
          view = <GroundMeGentle data={data}
            onMoment={() => { setGroundMeFrom('gm_struggling'); go('gm_moment'); }}

            onRemember={() => { recordGroundMe('struggling', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_hard':
          view = <GroundMeHard data={data}
            onMoment={() => { setGroundMeFrom('gm_hard'); go('gm_moment'); }}
            onRemember={() => { recordGroundMe('hard', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_moment':

            onBack={() => go('my_mirror')} />; break;
        }
        case 'mirror_calendar':
          view = <MirrorCalendar data={data} onBack={() => go('my_mirror')} />; break;

        // ==== LAUNCHPAD ====
        case 'launchpad':
          view = <LaunchpadScreen data={data}
            onHome={() => go('home')}
            onTick={(id, slot) => tickLaunchpad(id, slot)}
            onHistory={() => go('launchpad_calendar')} />; break;
        case 'launchpad_calendar':
          view = <LaunchpadCalendar data={data} onBack={() => go('launchpad')} />; break;

        // ==== PRACTICE ====
        case 'practice_welcome':
          view = <PracticeWelcome
            onChoose={() => { updateData({ practiceWelcomeSeen: true }); go('my_practice'); }}
            onBack={() => { updateData({ practiceWelcomeSeen: true }); go('home'); }} />; break;
        case 'my_practice':
          view = <MyPracticeScreen
            data={data}
            onHome={() => go('home')}
            onNav={navTo}
            onInfo={() => go('practice_info')}
            onStart={(id) => { setActiveExerciseId(id); go('exercise_entry'); }}
            onAddOrChange={() => go('exercise_store')}
            onHistory={() => go('calendar')}
            onRemove={(id) => removeFromPractice(id)}
          />; break;
        case 'exercise_store':
          view = <ExerciseStore data={data}
            onBack={() => go('my_practice')}
            onToggle={(id) => toggleStoreExercise(id)}
            onInfo={() => go('practice_info')} />; break;
        case 'exercise_entry': {
          const ex = ALL_EXERCISES.find(e => e.id === activeExerciseId) || ALL_EXERCISES[0];
          view = <ExerciseEntry
            exercise={ex}
            onSave={(items) => { saveExerciseEntry(ex.id, items); go('after_save'); }}
            onBack={() => go('my_practice')} />;
          break;
        }
        case 'after_save':
          view = <AfterSave onBack={() => go('my_practice')} />; break;
        case 'calendar':
          view = <PracticeCalendar data={data} onBack={() => go('my_practice')} />; break;
        case 'practice_info':
          view = <PracticeInfo onBack={() => go('my_practice')} />; break;

        case 'settings':
          view = <SettingsScreen
            onHome={() => go('home')}
            onNav={navTo}
            onPremium={() => go('premium')}
            onSupport={() => go('support')}
            onLogout={() => { localStorage.removeItem(LS_KEY); setData({}); go('welcome'); }}
          />; break;
        case 'premium':
          view = <PremiumScreen onBack={() => go('settings')} onHome={() => go('home')} />; break;
        case 'support':
          view = <SupportScreen onBack={() => go('settings')} />; break;

        default:
          view = <WelcomeScreen onBegin={() => go('resonance')} onLogin={() => go('signin')} />;
      }

      const devScreens = [
        ['welcome','Welcome'],
        ['resonance','Resonance'],
        ['in_right_place','InRightPlace'],
        ['grounded_already','GroundedAlready'],
        ['well_be_here','WellBeHere'],
        ['promise','Promise'],
        ['signup','SignUp'],
        ['signin','SignIn'],
        ['values','Values'],
        ['no_worries','NoWorries'],
        ['top3','Top3'],
        ['comfort','Comfort'],
        ['thats_okay','ThatsOkay'],
        ['aligned_self','AlignedSelf'],
        ['no_pressure','NoPressure'],
        ['mirror_ready','MirrorReady'],
        ['home','Home'],
        ['reflection','Reflection(11)'],
        ['reflection_calendar','RefCal(11A)'],
        ['freewrite','FreeWrite(12)'],
        ['freewrite_calendar','FWCal(12A)'],
        ['gm_triage','GroundMe(15)'],
        ['gm_reminder','GM-Reminder(15A)'],
        ['gm_struggling','GM-Gentle(15B)'],
        ['gm_hard','GM-Hard(15C)'],
        ['gm_moment','TakeMoment(15D)'],
        ['gm_support','GM-Support(15E)'],
        ['gm_calendar','GMCal(15F)'],
        ['my_mirror','MyMirror(13)'],
        ['mirror_edit_core','EditCore(13A)'],
        ['mirror_edit_field','EditField(13B-F)'],
        ['mirror_calendar','MirrorCal(13G)'],
        ['launchpad','Launchpad(14)'],
        ['launchpad_calendar','LpCal(14A)'],
        ['practice_welcome','PracticeWel(19A)'],
        ['my_practice','MyPractice(19)'],
        ['exercise_store','Store(19B)'],
        ['exercise_entry','Entry(19C1-4)'],
        ['after_save','AfterSave(19C)'],
        ['calendar','PracCal(19D)'],
        ['practice_info','PracInfo(19E)'],
        ['settings','Settings'],
        ['premium','Premium'],
        ['support','Support'],
      ];

      return (
        <div className="stage">
          {view}
          {showDev && (
            <div className="fixed bottom-2 right-2 bg-white/95 backdrop-blur rounded-xl shadow-lg p-2 text-[10px] text-g-gray border border-gray-100 z-50" style={{maxWidth: 240}}>
              <div className="flex items-center justify-between mb-1">
                <div className="font-semibold text-g-charcoal">Dev jump (V6):</div>
                <button onClick={() => setShowDev(false)} className="text-g-gray text-base leading-none ml-2" aria-label="Hide">×</button>
              </div>
              <div className="flex flex-wrap gap-1 max-h-[280px] overflow-y-auto no-scrollbar">
                {devScreens.map(([key, label]) => (
                  <button key={key} onClick={() => {
                      if (key === 'exercise_entry') setActiveExerciseId('do_for_me');
                      if (key === 'mirror_edit_field') setActiveMirrorField('quote');
                      if (key === 'launchpad' || key === 'launchpad_calendar') ensureLaunchpadWeek();
                      go(key);
                    }}
                    className={`px-2 py-1 rounded-md text-[10px] ${screen === key ? 'bg-g-green text-white' : 'bg-g-sage text-g-deep'}`}
                  >{label}</button>
                ))}
              </div>
              <div className="mt-2 pt-2 border-t border-gray-100 flex gap-1 flex-wrap">
                <button
                  onClick={() => { localStorage.removeItem(LS_KEY); setData({}); go('welcome'); }}
                  className="px-2 py-1 rounded-md text-[10px] bg-red-50 text-red-700"
                >Reset</button>
                <button
                  onClick={() => {
                    const baseData = {
                      user: { email: 'parn@grounded.app' },
                      fiveValues: ['Freedom','Creativity','Growth','Impact','Honesty'],
                      topValues:  ['Freedom','Creativity','Growth'],
                      comfortable:   'At home with loved ones, slow handcraft, time alone, drawing, resting',
                      uncomfortable: 'Small talk, routine, being told what to do.',
                      alignedSelf:   'Curious, energetic, traveling, creating and exploring ideas.',
                      whatHelps:     'Going for a walk, journaling, calling a friend, music.',
                      quote:         'The more you f*ck around, the more you find out.',
                      practiceWelcomeSeen: true,
                      myExercises: ['do_for_me','thank_me','small_wins'],
                      mirrorBaselineDate: todayKey(),
                      mirrorHistory: {
                        [todayKey()]: {
                          isBaseline: true,
                          fiveValues: ['Freedom','Creativity','Growth','Impact','Honesty'],
                          topValues: ['Freedom','Creativity','Growth'],
                          comfortable: 'At home with loved ones, slow handcraft, time alone, drawing, resting',
                          uncomfortable: 'Small talk, routine, being told what to do.',
                          alignedSelf: 'Curious, energetic, traveling, creating and exploring ideas.',
                          whatHelps: 'Going for a walk, journaling, calling a friend, music.',
                          quote: 'The more you f*ck around, the more you find out.',
                        }
                      },
                      launchpadWeek: initLaunchpadWeek(['Freedom','Creativity','Growth']),
                    };
                    setData(baseData);
                    go('home');
                  }}
                  className="px-2 py-1 rounded-md text-[10px] bg-g-sage text-g-deep"
                >Demo data</button>
              </div>
            </div>
          )}
          {!showDev && (
            <button onClick={() => setShowDev(true)}
              className="fixed bottom-2 right-2 bg-white/95 rounded-full shadow-lg w-8 h-8 text-xs text-g-gray border border-gray-100 z-50"
              aria-label="Show dev panel">⋮</button>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
