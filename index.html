    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const monthName = (m) => ['January','February','March','April','May','June','July','August','September','October','November','December'][m];
    const monthDay = () => {
      const d = new Date();
      return `${monthName(d.getMonth())} ${d.getDate()}`;
    };
    // ISO week key 'YYYY-Www'
    const weekKey = (date = new Date()) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      const firstThursday = d.valueOf();
      d.setUTCMonth(0, 1);
      if (d.getUTCDay() !== 4) {
        d.setUTCMonth(0, 1 + ((4 - d.getUTCDay()) + 7) % 7);
      }
      const wk = 1 + Math.ceil((firstThursday - d.valueOf()) / 604800000);
      return `${date.getFullYear()}-W${String(wk).padStart(2, '0')}`;
    };

    // ============================================================
    // REFLECTION POOL — 24 values × 4 daily questions
    // (Parn — feel free to refine copy on any of these)
    // ============================================================
    const REFLECTION_POOL = {
      Freedom: [

      ],
      Creativity: [
        "What's something you made today — even if it's small?",
        "When did you last surprise yourself with an idea?",
        "What's a creative thing you used to love but stopped doing?",

    const pickDailyReflection = (topValues) => {
      const tv = (topValues && topValues.length) ? topValues : null;
      if (!tv) return null; // caller must guard — only pick when user has core values set
      const v = tv[Math.floor(Math.random() * tv.length)];
      const list = REFLECTION_POOL[v] || [];
      if (!list.length) return { dayKey: todayKey(), valueKey: v, question: "What's one thing you did for yourself today?" };
      const q = list[Math.floor(Math.random() * list.length)];
      return { dayKey: todayKey(), valueKey: v, question: q };
    };

    const allMissionsForValues = (values) => {
      const out = [];
      (values || []).forEach(v => {
        const list = SUGGESTION_POOL[v] || [];
        list.forEach((m, idx) => out.push({ id: `${v}-${idx}`, valueKey: v, ...m }));
      });
      return out;
    };
    const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // build initial 3 cards: 1 random per core value (or fill from pool union if <3 core values)
    // Each card carries its own ticked flag; slots always remain 3 across the week.
    const initLaunchpadWeek = (topValues) => {
      const tv = (topValues && topValues.length) ? topValues : null;
      if (!tv) return null; // caller must guard — only init when user has core values
      const seen = new Set();
      const shown = [];
      tv.forEach(v => {
        const list = (SUGGESTION_POOL[v] || []).map((m, idx) => ({ id: `${v}-${idx}`, valueKey: v, ...m, ticked: false }));
        const m = pickRandom(list);
        if (m && !seen.has(m.id)) { shown.push(m); seen.add(m.id); }
      });
      // if less than 3, fill from union
      const all = allMissionsForValues(tv).filter(m => !seen.has(m.id)).map(m => ({ ...m, ticked: false }));
      while (shown.length < 3 && all.length) {
        const idx = Math.floor(Math.random() * all.length);
        const m = all.splice(idx, 1)[0];
        shown.push(m); seen.add(m.id);
      }
      return {
        weekKey: weekKey(),
        shown,
        used: [],
        remainingReloads: 2,
      };
    };

    // ============================================================

    // V15/B2 + C1: map raw Firebase auth error codes → warm, non-technical copy.
    // Returns null for "silent" cases (user intentionally cancelled the popup).
    // Returns an object { message, code } for cases that need an inline action
    // (e.g., email-already-in-use → "Sign in instead?" link rendered by caller).
    // Otherwise returns a string. Never surface raw codes to users; log them
    // via console.warn for debugging instead.
    // The `context` param ('signin' default | 'signup') only affects the generic
    // fallback copy. Specific codes have unambiguous messages regardless.
    function mapAuthError(code, context) {
      const generic = context === 'signup'
        ? 'Couldn’t create account. Try again?'
        : 'Couldn’t sign in. Try again?';
      if (!code) return generic;
      switch (code) {
        case 'auth/popup-closed-by-user':
        case 'auth/cancelled-popup-request':
          return null;  // user cancelled — silent, no banner
        case 'auth/popup-blocked':
          return 'Looks like your browser blocked the sign-in window. Allow popups and try again.';
        case 'auth/network-request-failed':
          return 'Can’t connect right now. Check your internet?';
        case 'auth/email-already-in-use':
          // Object form so SignUpScreen renders inline "Sign in instead?" link.
          return { message: 'Looks like there’s already an account with this email.', code };
        case 'auth/invalid-email':
          return 'That doesn’t look like an email yet — check the format?';
        case 'auth/weak-password':
          return 'Try a longer password — 8 characters or more.';
        // V15/C2: sign-in error codes.
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          // Firebase v10+ emits 'invalid-credential' as a generic for both
          // wrong-password and user-not-found when "Email enumeration
          // protection" is on (security: don't reveal whether email exists).
          return 'That doesn’t match. Try again?';
        case 'auth/user-not-found':
          // Object form so SignInScreen renders inline "Sign up?" link.
          // (Only fires on older Firebase config; modern projects emit
          // 'invalid-credential' instead.)
          return { message: 'No account with that email.', code };
        case 'auth/too-many-requests':
          return 'Too many tries. Take a breath, try again in a few minutes.';
        default:
          return generic;
      }
    }

    // V15/B1: Welcome with primary anonymous-first CTA + secondary account paths.

    // ============================================================
    // 4A. SIGN UP (V15/C1 — wired to groundedAuth.signUpWithEmail)
    // ============================================================
    // Strips V14's fake social buttons (Google now lives on Welcome; Apple/FB
    // deferred per F2). Display name optional. Show-password toggle for typo
    // catching without a confirm field. Submit gates on email format + 8+ char
    // password. B2-style spinner inside button + warm error banner on failure.
    // On 'auth/email-already-in-use' the banner gets an inline "Sign in instead?"
    // link that pre-fills the email on the sign-in screen via App's
    // signInPrefill state. On success: A3+J1 listener fires → resolver routes
    // to mirror onboarding ('values'), no manual navigation needed here.
    const SignUpScreen = ({ groundedAuth, onSubmitted, onSignIn, onSignInInstead, onBack }) => {
      const [name, setName]         = useState('');
      const [email, setEmail]       = useState('');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd]   = useState(false);
      const [pending, setPending]   = useState(false);
      const [error, setError]       = useState(null);   // string | { message, code } | null

      const emailValid    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
      const passwordValid = password.length >= 8;
      const formValid     = emailValid && passwordValid && !pending;

      const handleSubmit = async () => {
        if (!formValid) return;
        setError(null);
        setPending(true);
        try {
          if (!groundedAuth || !groundedAuth.signUpWithEmail) {
            // Defensive: should never hit since signup route is auth-aware.
            setError('Couldn’t create account. Try again?');
            setPending(false);
            return;
          }
          const r = await groundedAuth.signUpWithEmail(email.trim(), password, name.trim());
          if (!r || !r.ok) {
            const m = mapAuthError(r && r.code, 'signup');
            if (m) setError(m);
            console.warn('[C1] signUpWithEmail failed:', r && r.code);
            setPending(false);
            return;
          }
          // On success: A3+J1 listener fires → routes to 'values'. Component unmounts.
          if (onSubmitted) onSubmitted();
          // Defensive: clear pending in case the listener is delayed (e.g., backend
          // ack arrives but auth-state event lags). Component will unmount on route,
          // so this is mostly preventive — React 18 silently no-ops on unmounted.
          setPending(false);
        } catch (e) {
          console.error('[C1] signUpWithEmail threw:', e);
          setError('Couldn’t create account. Try again?');
          setPending(false);
        }
      };

      // Banner shape handling: string vs object (with code for inline action).
      const errorMessage     = error && (typeof error === 'string' ? error : error.message);
      const errorIsEmailUsed = !!(error && typeof error === 'object' && error.code === 'auth/email-already-in-use');

      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-7 pb-4">

            <div className="space-y-3">
              <input
                className="input-field"
                type="text"
                placeholder="What should we call you? (optional)"
                value={name}
                onChange={(e) => setName(e.target.value)}
                autoComplete="given-name"
                disabled={pending}
              />
              <input
                className="input-field"
                type="email"
                placeholder="Your email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                autoCapitalize="none"
                autoComplete="email"
                inputMode="email"
                disabled={pending}
              />
              <div className="relative">
                <input
                  className="input-field pr-12"
                  type={showPwd ? 'text' : 'password'}
                  placeholder="8+ characters"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoComplete="new-password"
                  disabled={pending}
                />
                <button
                  type="button"
                  onClick={() => setShowPwd(!showPwd)}
                  aria-label={showPwd ? 'Hide password' : 'Show password'}
                  className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-g-gray"
                  tabIndex={-1}
                >
                  {showPwd ? (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  ) : (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  )}
                </button>
              </div>
            </div>

            {/* C1 ERROR BANNER — same look as B2; conditional inline link for email-in-use. */}
            {error && (
              <div
                role="alert"
                className="mt-4 px-4 py-3 rounded-2xl text-left text-[13px] leading-snug"
                style={{ backgroundColor: '#FFF8F0', color: '#C97C7C' }}
              >
                {errorMessage}
                {errorIsEmailUsed && (
                  <>
                    {' '}
                    <button
                      type="button"
                      onClick={() => onSignInInstead && onSignInInstead(email.trim())}
                      className="underline font-semibold"
                      style={{ color: '#C97C7C' }}
                    >
                      Sign in instead?
                    </button>
                  </>
                )}
              </div>
            )}

            <div className="mt-6 flex justify-center">
              <button
                onClick={handleSubmit}
                disabled={!formValid}
                className="px-10 py-3.5 rounded-full bg-g-green text-white text-[15px] font-semibold transition-all active:scale-[0.98] active:bg-g-deep disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center gap-2.5"
              >
                {pending && (
                  /* B2-style spinner — white arc on faded white track for sage-filled button. */
                  <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.35)" strokeWidth="3" />
                    <path d="M12 2 a10 10 0 0 1 10 10" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                )}
                <span>Create account</span>
              </button>
            </div>

            <p className="text-center text-[11px] text-g-gray mt-4 px-2 leading-relaxed">
              By signing up you agree to your data being stored securely.<br/>
              Privacy policy coming soon.
            </p>
          </div>
          <div className="px-6 pb-6 text-center">
            <p className="text-sm text-g-gray">
              Have an account?{' '}
              <button onClick={onSignIn} className="text-g-deep font-semibold underline">Sign in</button>
            </p>
          </div>
        </div>
      );
    };

    // ============================================================
    // 4B. SIGN IN (V15/C2 — wired to groundedAuth.signInWithEmail)
    // ============================================================
    // Strips V14's fake social buttons (Google now lives on Welcome; Apple/FB
    // deferred per F2). prefillEmail seeds the email input when the user came
    // here via C1's "Sign in instead?" link. Show-password toggle, B2-style
    // spinner inside button + warm error banner. Inline forgot-password flow
    // (sendPasswordReset) instead of a separate screen — C3 can replace later
    // with a polished 2-step flow without breaking this.
    // On 'auth/user-not-found' the banner gets an inline "Sign up?" link.
    // On success: A3+J1 listener fires → resolver routes to home or values.
    const SignInScreen = ({ groundedAuth, prefillEmail, onSubmitted, onSignUp, onBack }) => {
      const [email, setEmail]       = useState(prefillEmail || '');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd]   = useState(false);
      const [pending, setPending]   = useState(false);
      const [error, setError]       = useState(null);   // string | { message, code } | null
      const [resetState, setResetState] = useState('idle');  // 'idle' | 'sending' | 'sent'

      const emailValid    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
      // Sign-in: any non-empty password. Returning users may have legacy
      // short passwords; Firebase rejects empty server-side anyway.
      const passwordValid = password.length >= 1;
      const formValid     = emailValid && passwordValid && !pending;

      const handleSubmit = async () => {
        if (!formValid) return;
        setError(null);
        setPending(true);
        try {
          if (!groundedAuth || !groundedAuth.signInWithEmail) {
            setError('Couldn’t sign in. Try again?');
            setPending(false);
            return;
          }
          const r = await groundedAuth.signInWithEmail(email.trim(), password);
          if (!r || !r.ok) {
            const m = mapAuthError(r && r.code, 'signin');
            if (m) setError(m);
            console.warn('[C2] signInWithEmail failed:', r && r.code);
            setPending(false);
            return;
          }
          // On success: A3+J1 listener fires → routes to home/values. Component unmounts.
          if (onSubmitted) onSubmitted();
          // Defensive: clear pending in case the listener is delayed (e.g., backend
          // ack arrives but auth-state event lags). Component will unmount on route,
          // so this is mostly preventive — React 18 silently no-ops on unmounted.
          setPending(false);
        } catch (e) {
          console.error('[C2] signInWithEmail threw:', e);
          setError('Couldn’t sign in. Try again?');
          setPending(false);
        }
      };

      const handleForgot = async () => {
        if (!emailValid) {
          setError('Type your email above first, then tap Forgot password.');
          return;
        }
        setError(null);
        setResetState('sending');
        try {
          if (!groundedAuth || !groundedAuth.sendPasswordReset) {
            setResetState('idle');
            setError('Couldn’t send reset link. Try again?');
            return;
          }
          const r = await groundedAuth.sendPasswordReset(email.trim());
          if (r && r.ok) {
            setResetState('sent');
          } else {
            const m = mapAuthError(r && r.code, 'signin');
            if (m) setError(typeof m === 'string' ? m : m.message);
            console.warn('[C2] sendPasswordReset failed:', r && r.code);
            setResetState('idle');
          }
        } catch (e) {
          console.error('[C2] sendPasswordReset threw:', e);
          setError('Couldn’t send reset link. Try again?');
          setResetState('idle');
        }
      };

      // Banner shape handling: string vs object (with code for inline action).
      const errorMessage     = error && (typeof error === 'string' ? error : error.message);
      const errorIsNoAccount = !!(error && typeof error === 'object' && error.code === 'auth/user-not-found');

      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-7 pb-4">
            <h2 className="text-[28px] font-serif text-g-charcoal text-center mt-3 mb-2">Welcome back</h2>
            <p className="text-center text-g-gray text-sm mb-6">Sign in to your Grounded account.</p>

            <div className="space-y-3">
              <input
                className="input-field"
                type="email"
                placeholder="Your email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                autoCapitalize="none"
                autoComplete="email"
                inputMode="email"
                disabled={pending}
              />
              <div className="relative">
                <input
                  className="input-field pr-12"
                  type={showPwd ? 'text' : 'password'}
                  placeholder="Your password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoComplete="current-password"
                  disabled={pending}
                />
                <button
                  type="button"
                  onClick={() => setShowPwd(!showPwd)}
                  aria-label={showPwd ? 'Hide password' : 'Show password'}
                  className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-g-gray"
                  tabIndex={-1}
                >
                  {showPwd ? (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  ) : (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  )}
                </button>
              </div>
            </div>

            {/* C2 ERROR BANNER — same look as B2/C1; conditional inline link for user-not-found. */}
            {error && (
              <div
                role="alert"
                className="mt-4 px-4 py-3 rounded-2xl text-left text-[13px] leading-snug"
                style={{ backgroundColor: '#FFF8F0', color: '#C97C7C' }}
              >
                {errorMessage}
                {errorIsNoAccount && (
                  <>
                    {' '}
                    <button
                      type="button"
                      onClick={() => onSignUp && onSignUp()}
                      className="underline font-semibold"
                      style={{ color: '#C97C7C' }}
                    >
                      Sign up?
                    </button>
                  </>
                )}
              </div>
            )}

            <div className="mt-6 flex justify-center">
              <button
                onClick={handleSubmit}
                disabled={!formValid}
                className="px-10 py-3.5 rounded-full bg-g-green text-white text-[15px] font-semibold transition-all active:scale-[0.98] active:bg-g-deep disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center gap-2.5"
              >
                {pending && (
                  <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.35)" strokeWidth="3" />
                    <path d="M12 2 a10 10 0 0 1 10 10" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                )}
                <span>Sign in</span>
              </button>
            </div>

            {/* C2 INLINE FORGOT-PASSWORD — three-state: idle (link) / sending / sent. */}
            <div className="mt-5 flex justify-center text-center min-h-[24px]">
              {resetState === 'idle' && (
                <button
                  type="button"
                  onClick={handleForgot}
                  className="text-g-deep text-sm underline font-semibold"
                >
                  Forgot password?
                </button>
              )}
              {resetState === 'sending' && (
                <p className="text-g-gray text-sm italic">Sending reset link…</p>
              )}
              {resetState === 'sent' && (
                <p className="text-g-deep text-sm italic px-4 leading-snug">
                  Reset link sent to {email.trim()}. Check your inbox.
                </p>
              )}
            </div>
          </div>
          <div className="px-6 pb-6 text-center">
            <p className="text-sm text-g-gray">
              Don’t have an account?{' '}
              <button onClick={onSignUp} className="text-g-deep font-semibold underline">Sign up</button>
            </p>
          </div>
        </div>
      );
    };

    // ============================================================
    // 5. VALUES STEP
    // ============================================================
    const ALL_VALUES = [
      'Freedom','Independence','Creativity','Curiosity','Success','Ambition',
      'Growth','Impact','Family','Friendship','Love','Belonging','Stability',
      'Health','Peace','Adventure','Fun','Kindness','Honesty','Loyalty',
      'Justice','Nature','Spirituality','Gratitude'
    ];
    const ValuesStep = ({ onContinue, onSkip, onBack, initial = [] }) => {
      const [picked, setPicked] = useState(initial);
      const max = 5;
      const toggle = (v) => {
        if (picked.includes(v)) setPicked(picked.filter(x => x !== v));
        else if (picked.length < max) setPicked([...picked, v]);
      };
      const done = picked.length === max;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <p className="text-center text-g-charcoal font-serif text-[20px] mb-4">Step 1/3</p>
            <h2 className="text-[26px] font-serif text-g-charcoal text-center leading-snug">What matters most to you?</h2>
            <p className="text-center text-g-charcoal text-sm mt-2">Pick 5 values that feel like YOU.</p>
            <p className="text-center text-g-gray text-xs mt-1">Selected: {picked.length}/5</p>
            <div className="flex flex-wrap justify-center gap-2 mt-6">
              {ALL_VALUES.map(v => {
                const selected = picked.includes(v);
                const disabled = !selected && picked.length >= max;
                return (
                  <button key={v} onClick={() => toggle(v)} disabled={disabled}
                          className={`vchip ${selected ? 'selected' : ''}`}>{v}</button>
                );
              })}
            </div>
            <p className="text-center text-g-gray text-sm italic mt-6">This can change. Let it be.</p>
          </div>
          <div className="pt-3 pb-7 flex flex-col items-center">
            <PillButton onClick={() => onContinue(picked)} disabled={!done}>Continue</PillButton>
            <button onClick={onSkip} className="text-g-deep text-sm underline font-semibold mt-4">I'm not sure yet →</button>
          </div>
        </div>
      );
    };

    // ============================================================
    // 6. TOP 3
    // ============================================================
    const TopThreeStep = ({ pool, onContinue, onBack }) => {
      const [picked, setPicked] = useState([]);
      const max = 3;
      const toggle = (v) => {
        if (picked.includes(v)) setPicked(picked.filter(x => x !== v));
        else if (picked.length < max) setPicked([...picked, v]);
      };
      const done = picked.length === max;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 1b/3</p>
            <div className="w-8" />
          </div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <h2 className="text-[24px] font-serif text-g-charcoal text-center leading-snug mt-2">
              If you had to protect just 3,<br/>which would they be?
            </h2>
            <p className="text-center text-g-charcoal text-sm mt-3">These will guide your Mirror and actions.</p>
            <p className="text-center text-g-gray text-xs mt-1">Selected: {picked.length}/3</p>
            <div className="flex flex-wrap justify-center gap-2 mt-6">
              {pool.map(v => {
                const selected = picked.includes(v);
                const disabled = !selected && picked.length >= max;
                return (
                  <button key={v} onClick={() => toggle(v)} disabled={disabled}
                          className={`vchip ${selected ? 'selected' : ''}`}>{v}</button>
                );
              })}
            </div>
            <p className="text-center text-g-gray text-sm italic mt-10">This can change. Let it be.</p>
          </div>
          <div className="pt-3 pb-8 flex flex-col items-center">
            <PillButton onClick={() => onContinue(picked)} disabled={!done}>Continue</PillButton>
          </div>
        </div>
      );
    };

    // ============================================================
    // 7. ENERGY MAPPING
    // ============================================================
    const ComfortStep = ({ onContinue, onSkip, onBack, initial = {} }) => {
      const [comfortable, setComfortable] = useState(initial.comfortable || '');
      const [uncomfortable, setUncomfortable] = useState(initial.uncomfortable || '');
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 2/3</p>
            <div className="w-8" />
          </div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <h3 className="text-[20px] font-serif text-g-charcoal text-center mt-2">When do you feel most comfortable?</h3>
            <p className="text-center text-g-charcoal text-sm mt-2 mb-3">"What situations, places, or activities<br/>make you feel at ease?"</p>
            <textarea className="textarea-field" rows={4}
              value={comfortable} onChange={e=>setComfortable(e.target.value)} />
            <h3 className="text-[20px] font-serif text-g-charcoal text-center mt-6">When do you feel uncomfortable?</h3>
            <p className="text-center text-g-charcoal text-sm mt-2 mb-3">"What situations tend to drain<br/>you or feel off?"</p>
            <textarea className="textarea-field" rows={4}
              value={uncomfortable} onChange={e=>setUncomfortable(e.target.value)} />
            <p className="text-center text-g-gray text-sm italic mt-6">This can change. Let it be.</p>
            <div className="text-center mt-3">
              <button onClick={onSkip} className="text-g-deep text-sm underline font-semibold">I'm not sure yet →</button>
            </div>
          </div>
          <div className="pt-2 pb-8 flex justify-center">
            <PillButton onClick={() => onContinue({ comfortable, uncomfortable })}
              disabled={!comfortable.trim() && !uncomfortable.trim()}>Continue</PillButton>
          </div>
        </div>
      );
    };

    // ============================================================
    // 8. BEST SELF SNAPSHOT
    // ============================================================
    const AlignedSelfStep = ({ onContinue, onSkip, onBack, initial = '' }) => {
      const [text, setText] = useState(initial);
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 3/3</p>
            <div className="w-8" />
          </div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <h3 className="text-[24px] font-serif text-g-charcoal text-center mt-3">When You Feel Most You</h3>
            <p className="text-center text-g-charcoal text-sm mt-2 mb-4">"When have you felt most aligned<br/>or at ease with yourself?"</p>
            <textarea className="textarea-field" rows={5}
              value={text} onChange={e=>setText(e.target.value)} />
            <p className="text-center text-g-charcoal text-sm mt-4 px-2">
              💡 Example: 'I'm curious, energetic, and I<br/>ask questions nobody else thinks of.'
            </p>
            <p className="text-center text-g-gray text-sm italic mt-5">This can change. Let it be.</p>
            <div className="text-center mt-6">
              <button onClick={onSkip} className="text-g-deep text-sm underline font-semibold">I'm not sure yet →</button>
            </div>
          </div>
          <div className="pt-3 pb-8 flex justify-center">
            <PillButton onClick={() => onContinue(text)} disabled={!text.trim()}>Create My Mirror</PillButton>
          </div>
        </div>
      );
    };

    // ============================================================
    // 5A/7A/8A. REASSURE
    // ============================================================
    const ReassureScreen = ({ heading, lines, onContinue, button = 'Continue to next step' }) => (
      <div className="phone-frame fade-in">
        <div className="flex-1 flex flex-col items-center justify-center px-7 text-center">
          <div className="text-3xl mb-4">🌱</div>
          <h2 className="text-[26px] font-serif text-g-deep mb-5 leading-snug">{heading}</h2>
          <div className="card px-6 py-6 w-full">
            {lines.map((l, i) => (
              <p key={i} className={`text-g-charcoal text-sm leading-relaxed ${i>0 ? 'mt-4' : ''}`}>{l}</p>
            ))}
          </div>
        </div>
        <div className="pb-10 flex justify-center">
          <PillButton onClick={onContinue}>{button}</PillButton>
        </div>
      </div>
    );

    // ============================================================
    // 9. PROFILE COMPLETE
    // ============================================================
    const MirrorReady = ({ data, onContinue }) => (
      <div className="phone-frame fade-in">
        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col items-center px-6 pt-12">
          <div className="text-3xl mb-3">✍️</div>
          <h2 className="text-[26px] font-serif text-g-deep mb-5">Your mirror is ready.</h2>
          <div className="card-outline w-full p-6">
            <h3 className="font-serif text-g-deep text-[22px] mb-2">My Values</h3>
            <p className="text-g-gray text-sm mb-5">{(data.topValues || []).join('  ·  ') || '—'}</p>
            <h4 className="text-g-green font-bold tracking-wide text-[13px] mb-1">WHEN I FEEL COMFORTABLE</h4>
            <p className="text-g-charcoal text-sm leading-relaxed mb-4">"{data.comfortable || '—'}"</p>
            <h4 className="text-g-green font-bold tracking-wide text-[13px] mb-1">MY ALIGNED SELF</h4>
            <p className="text-g-charcoal text-sm leading-relaxed">"{data.alignedSelf || '—'}"</p>
          </div>
          <p className="text-g-gray text-sm text-center mt-6">This is who you are.<br/>Now let's help you live it.</p>
        </div>
        <div className="pt-4 pb-8 flex justify-center">
          <PillButton onClick={onContinue}>Go to Home</PillButton>
        </div>
      </div>
    );

    // ============================================================
    // 10. HOME
    // ============================================================
    const HomeScreen = ({ data, onReflect, onLaunchpad, onFreeWrite, onGroundMe, onNav }) => {
      const greeting = useMemo(() => {
        const h = new Date().getHours();
        if (h < 12) return { text: 'Good morning', emoji: '☀️' };
        if (h < 18) return { text: 'Good afternoon', emoji: '🌤️' };
        return { text: 'Good evening', emoji: '🌙' };
      }, []);
      return (
        <div className="phone-frame fade-in">
          <div className="flex-1 overflow-y-auto no-scrollbar px-6 pt-8">
            <h1 className="font-serif text-[30px] text-g-charcoal">
              {greeting.text} <span>{greeting.emoji}</span>
            </h1>
            {(data.topValues && data.topValues.length > 0) && (
              <>
                <p className="font-serif text-[19px] text-g-charcoal mt-6">Remember What Matters</p>
                <div className="card flex justify-around py-3 mt-3">
                  {data.topValues.map(v => (
                    <span key={v} className="text-g-green font-semibold text-sm">{v}</span>
                  ))}
                </div>
              </>
            )}
            <button onClick={onReflect} className="card mt-5 p-5 w-full text-left block">
              <h3 className="font-serif text-[20px] text-g-charcoal">Today's Reflection</h3>
              <p className="text-g-charcoal text-sm mt-2 leading-relaxed">"{(data.dailyQuestion && data.dailyQuestion.question) || "What's one thing you did for yourself today?"}"</p>
              <p className="text-g-charcoal text-sm text-right mt-4">Answer →</p>
            </button>
            <button onClick={onLaunchpad} className="card mt-4 p-5 w-full text-left block">

    const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WEEKDAYS = ['S','M','T','W','T','F','S'];

    const formatBdayDisplay = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    };

    const BirthdayPicker = ({ value, onChange }) => {

          {open && (

    const BirthdayCalendarModal = ({ value, onSave, onClose }) => {
      const today = new Date();
      const initial = value ? new Date(value) : new Date(today.getFullYear() - 20, today.getMonth(), 1);
      const [viewYear, setViewYear]   = useState(initial.getFullYear());
      const [viewMonth, setViewMonth] = useState(initial.getMonth());
      const [selDay, setSelDay]       = useState(value ? new Date(value).getDate() : null);
      const [selMonth, setSelMonth]   = useState(value ? new Date(value).getMonth() : null);
      const [selYear, setSelYear]     = useState(value ? new Date(value).getFullYear() : null);

      const thisYear = today.getFullYear();
      const years = [];
      for (let i = thisYear - 5; i >= thisYear - 100; i--) years.push(i);

      const firstDay = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const offset = firstDay.getDay(); // Sun = 0 ... matches WEEKDAYS S M T W T F S

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const goPrev = () => {
        if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); }
        else setViewMonth(viewMonth - 1);
      };
      const goNext = () => {
        // Prevent going beyond today minus 5 years (no future birthdays)
        const limit = new Date(thisYear - 5, today.getMonth(), 1);
        const proposed = new Date(viewYear, viewMonth + 1, 1);
        if (proposed > limit) return;
        if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); }
        else setViewMonth(viewMonth + 1);
      };

      const pickDay = (d) => {
        if (d == null) return;
        // Don't allow future dates relative to today minus 5 years
        const candidate = new Date(viewYear, viewMonth, d);
        const limit = new Date(thisYear - 5, today.getMonth(), today.getDate());
        if (candidate > limit) return;
        setSelDay(d); setSelMonth(viewMonth); setSelYear(viewYear);
      };

      const canSave = selDay != null && selMonth != null && selYear != null;
      const handleSave = () => {
        if (!canSave) return;
        const iso = `${selYear}-${String(selMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
        onSave(iso);
      };

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center px-6 pb-12"
             style={{background:'rgba(0,0,0,0.4)'}}
             onClick={onClose}>

    // ============================================================
    // APP — Screen Router
    // ============================================================
    const App = () => {
      const [screen, setScreen]   = useState('welcome');
      const [data, setData]       = useState({});                 // V15: hydrated by bootstrap effect
      const [bootState, setBootState]     = useState('booting');  // V15: 'booting' | 'ready'
      const [groundedApi, setGroundedApi] = useState(null);       // V15: { groundedAuth, groundedSync } or null in fallback
      const [showDev, setShowDev] = useState(true);
      const [activeExerciseId, setActiveExerciseId] = useState(null);
      const [activeInfoExerciseId, setActiveInfoExerciseId] = useState(null);
      const [groundMeFrom, setGroundMeFrom] = useState('gm_triage');
      const [activeMirrorField, setActiveMirrorField] = useState(null);

      // V15: skip echoing storage on hydration ticks (server snapshots, initial localStorage load)
      const isHydratingRef = useRef(true);

      // V15/J1: flips true on first onAuthChange fire (or 400ms backstop) — gates the splash.
      const [authResolved, setAuthResolved] = useState(false);

      // V15/C1: ephemeral session-only state. C1 (sign-up screen) writes here
      // when user taps "Sign in instead?" on the email-already-in-use banner;
      // C2 (sign-in screen) reads it as the initial value of its email input.
      const [signInPrefill, setSignInPrefill] = useState('');

      // V15/C5: shown briefly when an anonymous user with localStorage data
      // signs in/up — covers the destination screen during firebase.js's
      // auto-migration of their reflections to Firestore. 1s minimum hold,
      // detection logic lives in the A3 listener below.
      const [migrating, setMigrating] = useState(false);

      // V15/Bug6: defers routing on sign-in until Firestore data hydrates.
      // firebase.js's onAuthStateChanged fires notifyAuth BEFORE the first
      // onSnapshot push, so getDataNow() at the auth event is stale. Without
      // this gate, returning users would get routed to 'values' picker.
      const [awaitingHydration, setAwaitingHydration] = useState(false);

      // V15/J1: pure resolver — picks the right screen given current auth + data.
      // Uses fine-grained resume so users don't lose mid-onboarding progress.
      // Anonymous + no topValues → 'welcome'. The Welcome screen's "Continue
      // without account" CTA (B1, not yet wired) should route to 'resonance'
      // to preserve the V14 funnel. Don't change this without revisiting B1.
      function resolveInitialScreen({ user, data: d }) {
        const hasTopValues  = !!(d && d.topValues  && d.topValues.length);
        const hasFiveValues = !!(d && d.fiveValues && d.fiveValues.length);
        if (user) {
          if (hasTopValues)  return 'home';
          if (hasFiveValues) return 'top3';   // resume: picked 5 but not 3
          return 'values';                    // first onboarding step
        }
        return hasTopValues ? 'home' : 'welcome';
      }

      // ── V15 BOOTSTRAP ──────────────────────────────────────────────
      // Race window.groundedReady against the boot timeout. If firebase.js
      // resolves: subscribe to live data. If it doesn't (404, error, or
      // simply not configured yet): fall back to V14 localStorage. App
      // never gets stuck on a white screen.
      useEffect(() => {
        let cancelled = false;
        let unsubData = null;

        const waitForFirebase = (timeoutMs) => new Promise((resolve) => {
          const timer = setTimeout(() => resolve(null), timeoutMs);
          const tick = () => {
            if (window.__groundedFirebaseFailed) { clearTimeout(timer); resolve(null); return; }
            if (window.groundedReady) {
              clearTimeout(timer);
              window.groundedReady.then((api) => resolve(api)).catch(() => resolve(null));
              return;
            }
            setTimeout(tick, 50);
          };
          tick();
        });

        (async () => {
          const api = await waitForFirebase(window.__GROUNDED_BOOT_TIMEOUT_MS || 2500);
          if (cancelled) return;
          if (api && api.groundedSync) {
            setGroundedApi(api);
            unsubData = api.groundedSync.subscribe((d) => {
              if (cancelled) return;
              isHydratingRef.current = true;          // server-sourced — don't echo back
              setData(d || {});
            });
          } else {
            // Graceful fallback — V14 behavior (localStorage-only)
            isHydratingRef.current = true;
            setData(loadData());
          }
          setBootState('ready');
        })();

        return () => {
          cancelled = true;
          if (unsubData) unsubData();
        };
      }, []);

      // ── SAVE — routes through groundedSync if available, else V14 localStorage ──
      useEffect(() => {
        if (bootState !== 'ready') return;
        if (isHydratingRef.current) {
          isHydratingRef.current = false;            // skip echoing the hydration tick
          return;
        }
        if (groundedApi && groundedApi.groundedSync) {
          groundedApi.groundedSync.save(data);
        } else {
          saveData(data);
        }
      }, [data, bootState, groundedApi]);

      // ── AUTH LISTENER (A3 + J1) ────────────────────────────────────
      // Detects sign-in / sign-out events and routes accordingly via the
      // resolveInitialScreen helper. Data hydration is handled by
      // groundedSync.subscribe() in the bootstrap effect; migration
      // auto-runs inside firebase.js on sign-in. Listener stays small.
      // Also flips authResolved → unblocks the splash render guard
      // (with a 400ms backstop in case onAuthChange never fires).
      useEffect(() => {
        if (bootState !== 'ready' || !groundedApi || !groundedApi.groundedAuth) return;

        let isInitialFire = true;
        // J1 backstop: if onAuthChange never fires (silent firebase.js failure
        // not caught by __groundedFirebaseFailed), don't trap user behind splash.
        const splashBackstop = setTimeout(() => setAuthResolved(true), 400);

        const unsubscribe = groundedApi.groundedAuth.onAuthChange((user) => {
          const wasInitial = isInitialFire;
          isInitialFire = false;

          // J1: read live data from firebase.js. For signed-in users, this is
          // STALE on the first fire (currentDocData reflects pre-signin state
          // because firebase.js doesn't refresh it between notifyAuth and the
          // first onSnapshot push). Bug 6 fix: defer routing for signed-in
          // users until the hydration effect below sees fresh data.
          const liveData = (groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
            ? groundedApi.groundedSync.getDataNow()
            : data;
          const next = resolveInitialScreen({ user, data: liveData });

          // V15/C5: detect migration moment using the same stale-currentDocData
          // window. If pre-migration data has any keys (matches firebase.js
          // line 241 hasLocal threshold), migration just happened: show overlay.
          // Backend ticket for v1.0.x: expose `lastMigrationResult` for cleaner
          // signaling instead of inferring from data shape.
          const justSignedIn = !!user && !wasInitial;
          const hadAnonData  = liveData && Object.keys(liveData).length > 0;
          if (justSignedIn && hadAnonData) {
            setMigrating(true);
            setTimeout(() => setMigrating(false), 1000);
          }

          if (user) {
            // V15/Bug6: defer routing until Firestore data hydrates. The
            // hydration effect below catches the first onSnapshot push and
            // runs the resolver with fresh data. authResolved also flips
            // there — keeping the splash visible avoids a 'welcome' flash.
            setAwaitingHydration(true);
            // Do NOT setScreen or setAuthResolved here for the user case.
          } else if (!wasInitial) {
            // True sign-out (user-initiated via Settings, or involuntary like
            // token expiry / server revoke). Route immediately — resolver
            // returns 'welcome' since no user + localStorage cleared by
            // earlier migration. Defensive clear of awaitingHydration in case
            // sign-out fires while a prior sign-in was still hydrating.
            setAwaitingHydration(false);
            setAuthResolved(true);
            setScreen(next);
          } else {
            // Initial fire with no user = anonymous mode. Route immediately:
            //   - no topValues → 'welcome' (matches default useState, no-op)
            //   - has topValues in localStorage → 'home' (returning anon user)
            setAwaitingHydration(false);
            setAuthResolved(true);
            setScreen(next);
          }
        });

        return () => {
          clearTimeout(splashBackstop);
          if (typeof unsubscribe === 'function') unsubscribe();
        };
      }, [bootState, groundedApi]);

      // V15/Bug6: hydration watcher — runs the resolver once Firestore data
      // arrives after a sign-in event. Only signed-in users set awaitingHydration
      // so this effect is a no-op during normal app use or in anonymous mode.
      // Even fresh signups satisfy hasContent (firebase.js writes a 5-key
      // system doc on Case C), so this resolves cleanly for all sign-in paths.
      useEffect(() => {
        if (!awaitingHydration) return;
        const liveData = (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
          ? groundedApi.groundedSync.getDataNow()
          : data;
        const hasContent = liveData && Object.keys(liveData).length > 0;
        if (!hasContent) return;  // wait for next data push

        const user = groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser;
        const next = resolveInitialScreen({ user, data: liveData });
        setScreen(next);
        setAwaitingHydration(false);
        setAuthResolved(true);
      }, [data, awaitingHydration]);

      // V15/Bug6: hydration backstop — don't trap user behind splash forever.
      // Fires if data never hydrates (Firestore rules denial, network failure,
      // misconfigured firebase.js). Resolves with whatever data we have.
      useEffect(() => {
        if (!awaitingHydration) return;
        const t = setTimeout(() => {
          const liveData = (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
            ? groundedApi.groundedSync.getDataNow()
            : data;
          const user = groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser;
          const next = resolveInitialScreen({ user, data: liveData });
          setScreen(next);
          setAwaitingHydration(false);
          setAuthResolved(true);
        }, 1500);
        return () => clearTimeout(t);
      }, [awaitingHydration]);

      // Daily Reflection — pick fresh question on:
      //   1) first load (no dailyQuestion yet)
      //   2) day rollover (new day)
      //   3) core values changed → current question's valueKey no longer in topValues
      useEffect(() => {
        const today = todayKey();
        const dq = data.dailyQuestion;
        const tv = (data.topValues && data.topValues.length) ? data.topValues : null;
        if (!tv) return; // nothing to pick from yet — wait until user has core values
        const needsRefresh =
          !dq ||
          dq.dayKey !== today ||
          !tv.includes(dq.valueKey);
        if (needsRefresh) {
          const next = pickDailyReflection(tv);
          if (next) setData(prev => ({ ...prev, dailyQuestion: next }));
        }
      }, [data.dailyQuestion, data.topValues]);

      const updateData = (patch) => setData(prev => ({ ...prev, ...patch }));
      const go = (next) => setScreen(next);

      const navTo = (key) => {
        if (key === 'home')     return go('home');
        if (key === 'practice') {
          if (!data.practiceWelcomeSeen) return go('practice_welcome');
          return go('my_practice');
        }
        if (key === 'mirror')   return go('my_mirror');
        if (key === 'settings') return go('settings');
      };

      const myExercises = data.myExercises || [];

      const toggleStoreExercise = (id) => {
        const cur = data.myExercises ? [...data.myExercises] : [];
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        else cur.push(id);
        updateData({ myExercises: cur });
      };

      const removeFromPractice = (id) => {
        const cur = [...myExercises];
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        updateData({ myExercises: cur });
      };

      const saveExerciseEntry = (id, items) => {
        const today = todayKey();
        const completed = { ...(data.completed || {}) };
        completed[today] = { ...(completed[today] || {}), [id]: items };
        updateData({ completed });
      };

      const saveReflection = (q, a, valueKey) => {
        const today = todayKey();
        const reflections = { ...(data.reflections || {}) };
        reflections[today] = { q, a, valueKey };
        updateData({ reflections });
      };

      const saveFreeWrite = (text) => {
        const today = todayKey();
        const freeWrites = { ...(data.freeWrites || {}) };
        if (text && text.trim()) {
          freeWrites[today] = text;
        } else {
          delete freeWrites[today];
        }
        updateData({ freeWrites });
      };

      // Mirror history — merge fields into today's entry, only changed fields
      const saveMirrorChanges = (patch) => {
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        const todayEntry = { ...(mirrorHistory[today] || {}) };
        const fieldPatch = {};
        Object.keys(patch).forEach(k => {
          const oldVal = data[k];
          const newVal = patch[k];
          if (Array.isArray(newVal)) {
            const same = Array.isArray(oldVal) && oldVal.length === newVal.length && oldVal.every((v, i) => v === newVal[i]);
            if (!same) fieldPatch[k] = newVal;
          } else if (newVal !== oldVal) {
            fieldPatch[k] = newVal;
          }
        });
        if (Object.keys(fieldPatch).length > 0) {
          mirrorHistory[today] = { ...todayEntry, ...fieldPatch };
        }
        updateData({ ...patch, mirrorHistory });
      };

      const ensureMirrorBaseline = () => {
        if (data.mirrorBaselineDate) return;
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        mirrorHistory[today] = {
          isBaseline: true,
          fiveValues: data.fiveValues || [],
          topValues: data.topValues || [],
          comfortable: data.comfortable || '',
          uncomfortable: data.uncomfortable || '',
          alignedSelf: data.alignedSelf || '',
          whatHelps: data.whatHelps || '',
          quote: data.quote || '',
        };
        updateData({ mirrorHistory, mirrorBaselineDate: today });
      };

      // Launchpad — ensure week initialized + matches current week
      const ensureLaunchpadWeek = () => {
        const tv = data.topValues;
        if (!tv || !tv.length) return; // no core values → don't init
        const wk = weekKey();
        const cur = data.launchpadWeek;
        if (!cur || cur.weekKey !== wk) {
          const next = initLaunchpadWeek(tv);
          if (next) updateData({ launchpadWeek: next });
        }
      };

      const tickLaunchpad = (id, slotIdx) => {
        const wk = data.launchpadWeek;
        if (!wk) return;
        const idx = (typeof slotIdx === 'number' && wk.shown[slotIdx] && wk.shown[slotIdx].id === id)
          ? slotIdx
          : wk.shown.findIndex(s => s.id === id);
        if (idx < 0) return;
        const card = wk.shown[idx];
        if (card.ticked) return; // already ticked, ignore

        const today = todayKey();
        const launchpadHistory = { ...(data.launchpadHistory || {}) };
        const todayList = [...(launchpadHistory[today] || [])];
        todayList.push({ id: card.id, valueKey: card.valueKey, emoji: card.emoji, body: card.body, tickedAt: Date.now() });
        launchpadHistory[today] = todayList;

        const newUsed = [...wk.used, card.id];
        let remaining = wk.remainingReloads;
        const newShown = wk.shown.slice();

        if (remaining > 0) {
          // replace this slot with a fresh card from the pool
          const tv = (data.topValues && data.topValues.length) ? data.topValues : ['Freedom','Creativity','Growth'];
          const seenIds = new Set([...newUsed, ...newShown.map(s => s.id)]);
          const pool = allMissionsForValues(tv).filter(m => !seenIds.has(m.id));
          if (pool.length) {
            const pickIdx = Math.floor(Math.random() * pool.length);
            newShown[idx] = { ...pool[pickIdx], ticked: false };
            remaining -= 1;
          } else {
            // pool empty — keep card in place but mark ticked
            newShown[idx] = { ...card, ticked: true };
          }
        } else {
          // reloads exhausted — keep card visible, mark as ticked (faded UI)
          newShown[idx] = { ...card, ticked: true };
        }

        updateData({
          launchpadHistory,
          launchpadWeek: { ...wk, shown: newShown, used: newUsed, remainingReloads: remaining },
        });
      };

      // Ground Me — record visit when sub-screen finalized (Take a moment / Need to talk / I remember now)
      const recordGroundMe = (triage, sub) => {
        const today = todayKey();
        const groundMeHistory = { ...(data.groundMeHistory || {}) };
        const list = [...(groundMeHistory[today] || [])];
        list.push({ triage, sub, time: Date.now() });
        groundMeHistory[today] = list;
        updateData({ groundMeHistory });
      };

      const triageOf = (target) => {
        if (target === 'gm_reminder') return 'reminder';
        if (target === 'gm_struggling') return 'struggling';
        if (target === 'gm_hard') return 'hard';
        return null;
      };
      const [pendingTriage, setPendingTriage] = useState(null);

      // V15/Bug6 + C5: rendering precedence
      //   1. migrating  → MigrationOverlay  (C5: anon→signed-in transition takes priority)
      //   2. booting OR awaiting hydration → BootSplash
      //   3. otherwise  → routed view (below)
      // The migration early-return is a small UX win over C5's original layered
      // approach: destination screen never renders behind the overlay, so there's
      // no flicker when overlay fades.
      if (migrating) return <MigrationOverlay />;
      // V15: boot splash gates render until firebase.js resolves (or 2.5s timeout fires).
      // V15/J1: hold splash until the auth listener has reported in (400ms backstop).
      // V15/Bug6: also hold splash through awaitingHydration so signed-in returning
      // users (and mid-app sign-ins) don't briefly flash 'welcome' before routing.
      if (bootState === 'booting' || (groundedApi && !authResolved) || awaitingHydration) return <BootSplash />;

      let view = null;
      switch (screen) {
        case 'welcome':
          view = <WelcomeScreen
            hasGoogleAuth={!!groundedApi}
            onGoogle={async () => {
              if (!groundedApi || !groundedApi.groundedAuth) return { ok: false, code: 'no-auth' };
              return groundedApi.groundedAuth.signInWithGoogle();
            }}
            onSignUpEmail={() => go('signup')}
            onSignIn={() => go('signin')}
            onContinueAnon={() => go('resonance')}
          />; break;
        case 'resonance':
          view = <ResonanceCheck
            onBack={() => go('welcome')}
            onComplete={(r) => go(r === 'in_right_place' ? 'in_right_place' : 'grounded_already')}
          />; break;
        case 'in_right_place':
          view = <InRightPlace onContinue={() => go('promise')} />; break;
        case 'grounded_already':
          view = <GroundedAlready onCheckOut={() => go('promise')} onLater={() => go('well_be_here')} />; break;
        case 'well_be_here':
          view = <WellBeHere onBack={() => go('welcome')} />; break;
        case 'promise':
          view = <PromiseScreen onContinue={() => go('signup')} onBack={() => go('in_right_place')} />; break;
        case 'signup':
          view = <SignUpScreen
            groundedAuth={groundedApi && groundedApi.groundedAuth}
            onSubmitted={() => { /* A3+J1 listener handles routing on success */ }}
            onSignIn={() => go('signin')}
            onSignInInstead={(email) => { setSignInPrefill(email); go('signin'); }}
            onBack={() => go('welcome')}
          />; break;
        case 'signin':
          view = <SignInScreen
            groundedAuth={groundedApi && groundedApi.groundedAuth}
            prefillEmail={signInPrefill}
            onSubmitted={() => { setSignInPrefill(''); /* A3+J1 listener handles routing */ }}
            onSignUp={() => go('signup')}
            onBack={() => go('welcome')}
          />; break;
        case 'values':
          view = <ValuesStep
            initial={data.fiveValues || []}
            onContinue={(v) => { updateData({ fiveValues: v }); go('top3'); }}
            onSkip={() => go('no_worries')}
            onBack={() => go('promise')}
          />; break;
        case 'no_worries':
          view = <ReassureScreen heading="No worries !"
            lines={[
              'Knowing your values takes time. You can continue for now.',
              'Later, we\'ll have a short quiz to help you discover what truly matters to you.',
            ]}
            onContinue={() => go('comfort')} />; break;
        case 'top3':
          view = <TopThreeStep
            pool={data.fiveValues || []}
            onContinue={(t) => { updateData({ topValues: t }); go('comfort'); }}
            onBack={() => go('values')}
          />; break;
        case 'comfort':
          view = <ComfortStep
            initial={{ comfortable: data.comfortable, uncomfortable: data.uncomfortable }}
            onContinue={(o) => { updateData(o); go('aligned_self'); }}
            onSkip={() => go('thats_okay')}
            onBack={() => go('top3')}
          />; break;
        case 'thats_okay':
          view = <ReassureScreen heading="That's okay !"
            lines={[
              'Sometimes it\'s hard to know what gives or drains your energy.',
              'You can come back anytime and update this in your profile.',
            ]}
            onContinue={() => go('aligned_self')} />; break;
        case 'aligned_self':
          view = <AlignedSelfStep
            initial={data.alignedSelf || ''}
            onContinue={(t) => { updateData({ alignedSelf: t }); go('mirror_ready'); }}
            onSkip={() => go('no_pressure')}
            onBack={() => go('comfort')}
          />; break;
        case 'no_pressure':
          view = <ReassureScreen heading="No pressure !"
            lines={[
              'Describing your aligned self isn\'t easy — it can take reflection.',
              'Your mirror will still be here. You can add this whenever you\'re ready.',
            ]}
            button="Continue"
            onContinue={() => go('mirror_ready')} />; break;
        case 'mirror_ready':
          view = <MirrorReady data={data} onContinue={() => { ensureMirrorBaseline(); go('home'); }} />; break;
        case 'home':
          view = <HomeScreen
            data={data}
            onReflect={() => go('reflection')}
            onLaunchpad={() => { ensureLaunchpadWeek(); go('launchpad'); }}
            onFreeWrite={() => go('freewrite')}
            onGroundMe={() => go('gm_triage')}
            onNav={navTo}
          />; break;
        case 'reflection':
          view = <ReflectionScreen data={data}
            onSave={(q, a, vk) => { saveReflection(q, a, vk); go('home'); }}
            onSkip={() => go('home')}
            onHome={() => go('home')}
            onHistory={() => go('reflection_calendar')}
            onSetupMirror={() => go('mirror_edit_core')} />; break;
        case 'reflection_calendar':
          view = <ReflectionCalendar data={data} onBack={() => go('reflection')} />; break;
        case 'freewrite':
          view = <FreeWriteScreen data={data}
            onDone={(t) => { saveFreeWrite(t); go('home'); }}
            onHome={() => go('home')}
            onHistory={() => go('freewrite_calendar')} />; break;
        case 'freewrite_calendar':
          view = <FreeWriteCalendar data={data} onBack={() => go('freewrite')} />; break;

        // ==== GROUND ME ====
        case 'gm_triage':
          view = <GroundMeTriage
            onPick={(target, tri) => { setGroundMeFrom(target); setPendingTriage(tri); go(target); }}
            onHome={() => go('home')}
            onHistory={() => go('gm_calendar')} />; break;
        case 'gm_calendar':
          view = <GroundMeCalendar data={data} onBack={() => go('gm_triage')} />; break;
        case 'gm_reminder':
          view = <GroundMeReminder data={data}
            onMoment={() => { setGroundMeFrom('gm_reminder'); go('gm_moment'); }}
            onTalk={() => { recordGroundMe('reminder', 'need_to_talk'); go('gm_support'); }}
            onRemember={() => { recordGroundMe('reminder', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_struggling':
          view = <GroundMeGentle data={data}
            onMoment={() => { setGroundMeFrom('gm_struggling'); go('gm_moment'); }}
            onTalk={() => { recordGroundMe('struggling', 'need_to_talk'); go('gm_support'); }}
            onRemember={() => { recordGroundMe('struggling', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_hard':
          view = <GroundMeHard data={data}
            onMoment={() => { setGroundMeFrom('gm_hard'); go('gm_moment'); }}
            onRemember={() => { recordGroundMe('hard', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_moment':
          view = <TakeMoment onReturn={() => {
            const tri = triageOf(groundMeFrom);
            if (tri) recordGroundMe(tri, 'take_moment');
            go(groundMeFrom);
          }} />; break;
        case 'gm_support':
          view = <NeedToTalk onBack={() => go(groundMeFrom)} />; break;

        // ==== MIRROR ====
        case 'my_mirror':
          view = <MyMirrorScreen data={data}
            onHome={() => go('home')}
            onNav={navTo}
            onEditCore={() => go('mirror_edit_core')}
            onEditField={(k) => { setActiveMirrorField(k); go('mirror_edit_field'); }}
            onHistory={() => go('mirror_calendar')} />; break;
        case 'mirror_edit_core':
          view = <MirrorEditCore data={data}
            onSave={(patch) => { saveMirrorChanges(patch); go('my_mirror'); }}
            onBack={() => go('my_mirror')} />; break;
        case 'mirror_edit_field': {
          const f = MIRROR_FIELDS.find(x => x.key === activeMirrorField) || MIRROR_FIELDS[0];
          view = <MirrorEditText field={f} current={data[f.key] || ''}
            onSave={(t) => { saveMirrorChanges({ [f.key]: t }); go('my_mirror'); }}
            onBack={() => go('my_mirror')} />; break;
        }
        case 'mirror_calendar':
          view = <MirrorCalendar data={data} onBack={() => go('my_mirror')} />; break;

        // ==== LAUNCHPAD ====
        case 'launchpad':
          view = <LaunchpadScreen data={data}
            onHome={() => go('home')}
            onTick={(id, slot) => tickLaunchpad(id, slot)}
            onHistory={() => go('launchpad_calendar')}
            onSetupMirror={() => go('mirror_edit_core')} />; break;
        case 'launchpad_calendar':
          view = <LaunchpadCalendar data={data} onBack={() => go('launchpad')} />; break;

        // ==== PRACTICE ====
        case 'practice_welcome':
          view = <PracticeWelcome
            onChoose={() => { updateData({ practiceWelcomeSeen: true }); go('my_practice'); }}
            onBack={() => { updateData({ practiceWelcomeSeen: true }); go('home'); }} />; break;
        case 'my_practice':
          view = <MyPracticeScreen
            data={data}
            onHome={() => go('home')}
            onNav={navTo}
            onInfo={() => go('practice_info')}
            onStart={(id) => { setActiveExerciseId(id); go('exercise_entry'); }}
            onAddOrChange={() => go('exercise_store')}
            onHistory={() => go('calendar')}
            onRemove={(id) => removeFromPractice(id)}
          />; break;
        case 'exercise_store':
          view = <ExerciseStore data={data}
            onBack={() => go('my_practice')}
            onToggle={(id) => toggleStoreExercise(id)}
            onInfo={(id) => { setActiveInfoExerciseId(id); go('exercise_info'); }} />; break;
        case 'exercise_info': {
          const ex = ALL_EXERCISES.find(e => e.id === activeInfoExerciseId) || ALL_EXERCISES[0];
          view = <ExerciseInfo exercise={ex} onBack={() => go('exercise_store')} />;
          break;
        }
        case 'exercise_entry': {
          const ex = ALL_EXERCISES.find(e => e.id === activeExerciseId) || ALL_EXERCISES[0];
          view = <ExerciseEntry
            exercise={ex}
            onSave={(items) => { saveExerciseEntry(ex.id, items); go('after_save'); }}
            onBack={() => go('my_practice')} />;
          break;
        }
        case 'after_save':
          view = <AfterSave onBack={() => go('my_practice')} />; break;
        case 'calendar':
          view = <PracticeCalendar data={data} onBack={() => go('my_practice')} />; break;
        case 'practice_info':
          view = <PracticeInfo onBack={() => go('my_practice')} />; break;

        case 'settings':
          view = <SettingsScreen
            onHome={() => go('home')}
            onNav={navTo}
            onPremium={() => go('premium')}
            onSupport={() => go('support')}
            onAccount={() => go('account')}
            onNotif={() => go('notifications')}
            onLanguage={() => go('language')}
            onExport={() => go('export_data')}
            onPrivacy={() => go('privacy')}
            onLogout={async () => {
              // V15/E8: async sign-out. The auth listener (A3) catches the
              // sign-out event and the resolver (J1) routes back to welcome.
              // No manual navigation here — keeps state transitions centralized.
              if (groundedApi && groundedApi.groundedAuth) {
                try {
                  await groundedApi.groundedAuth.signOut();
                } catch (e) {
                  // Silent per project decision; backlog ticket for v1.0.x polish.
                  // Listener won't fire on failure, so user stays on Settings —
                  // no broken state, just a quietly failed retry path.
                  console.warn('[E8] signOut failed:', e);
                }
              } else {
                // Fallback: firebase.js not loaded (localStorage-only mode).
                // Mirror V14 behavior — clear in-memory + route to welcome.
                setData({});
                go('welcome');
              }
            }}
          />; break;
        case 'premium':
          // Done = save → Settings (when entered from Settings).
          view = <PremiumScreen onBack={() => go('settings')} onHome={() => go('settings')} />; break;
        case 'support':
          view = <SupportScreen onBack={() => go('settings')} />; break;
        case 'account':
          view = <AccountScreen data={data}
            onBack={() => go('settings')}
            onSave={(patch) => {
              updateData({ user: { ...(data.user || {}), ...patch } });
              go('settings');
            }}
            onManagePlan={() => go('premium')}
            onChangeEmail={() => go('change_email')}
            onChangeMobile={() => go('change_mobile')}
            onChangePassword={() => go('change_password')}
            onDeleteAccount={() => { localStorage.removeItem(LS_KEY); setData({}); go('welcome'); }}
          />; break;
        case 'change_email':
          view = <ChangeEmailScreen data={data}
            onBack={() => go('account')}
            onSaved={(newEmail) => {
              updateData({ user: { ...(data.user || {}), email: newEmail } });
              go('account');
            }} />; break;
        case 'change_mobile':
          view = <ChangeMobileScreen data={data}
            onBack={() => go('account')}
            onSaved={(newMobile) => {
              updateData({ user: { ...(data.user || {}), mobile: newMobile } });
              go('account');
            }} />; break;
        case 'change_password':
          view = <ChangePasswordScreen onBack={() => go('account')} onSaved={() => go('account')} />; break;
        case 'notifications':
          view = <NotificationsScreen data={data}
            onBack={() => go('settings')}
            onSave={(notifications) => { updateData({ notifications }); go('settings'); }} />; break;
        case 'language':
          view = <LanguageScreen data={data}
            onBack={() => go('settings')}
            onSave={(lang) => { updateData({ lang }); go('settings'); }} />; break;
        case 'export_data':
          view = <ExportDataScreen data={data} onBack={() => go('settings')} onHome={() => go('settings')} />; break;
        case 'privacy':
          view = <PrivacyScreen onBack={() => go('settings')} onHome={() => go('settings')} />; break;

        default:
          view = <WelcomeScreen
            hasGoogleAuth={!!groundedApi}
            onGoogle={async () => {
              if (!groundedApi || !groundedApi.groundedAuth) return { ok: false, code: 'no-auth' };
              return groundedApi.groundedAuth.signInWithGoogle();
            }}
            onSignUpEmail={() => go('signup')}
            onSignIn={() => go('signin')}
            onContinueAnon={() => go('resonance')}
          />;
      }

      const devScreens = [
        ['welcome','Welcome'],
        ['resonance','Resonance'],
        ['in_right_place','InRightPlace'],
        ['grounded_already','GroundedAlready'],
        ['well_be_here','WellBeHere'],
        ['promise','Promise'],
