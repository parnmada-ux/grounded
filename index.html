    // ISO week key 'YYYY-Www'
    const weekKey = (date = new Date()) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      const firstThursday = d.valueOf();
      d.setUTCMonth(0, 1);
      if (d.getUTCDay() !== 4) {
        d.setUTCMonth(0, 1 + ((4 - d.getUTCDay()) + 7) % 7);
      }
      const wk = 1 + Math.ceil((firstThursday - d.valueOf()) / 604800000);
      return `${date.getFullYear()}-W${String(wk).padStart(2, '0')}`;

      if (!list.length) return { dayKey: todayKey(), valueKey: v, question: "What's one thing you did for yourself today?" };
      const q = list[Math.floor(Math.random() * list.length)];

    const initLaunchpadWeek = (topValues) => {
      const tv = (topValues && topValues.length) ? topValues : null;
      if (!tv) return null; // caller must guard — only init when user has core values
      const seen = new Set();
      const shown = [];
      tv.forEach(v => {

    // V15/B2 + C1: map raw Firebase auth error codes → warm, non-technical copy.
    // Returns null for "silent" cases (user intentionally cancelled the popup).
    // Returns an object { message, code } for cases that need an inline action
    // (e.g., email-already-in-use → "Sign in instead?" link rendered by caller).
    // Otherwise returns a string. Never surface raw codes to users; log them
    // via console.warn for debugging instead.
    // The `context` param ('signin' default | 'signup') only affects the generic
    // fallback copy. Specific codes have unambiguous messages regardless.
    function mapAuthError(code, context) {
      const generic = context === 'signup'
        ? 'Couldn’t create account. Try again?'
        : 'Couldn’t sign in. Try again?';
      if (!code) return generic;
      switch (code) {
        case 'auth/popup-closed-by-user':
        case 'auth/cancelled-popup-request':
          return null;  // user cancelled — silent, no banner
        case 'auth/popup-blocked':
          return 'Looks like your browser blocked the sign-in window. Allow popups and try again.';
        case 'auth/network-request-failed':
          return 'Can’t connect right now. Check your internet?';
        case 'auth/email-already-in-use':
          // Object form so SignUpScreen renders inline "Sign in instead?" link.
          return { message: 'Looks like there’s already an account with this email.', code };
        case 'auth/invalid-email':
          return 'That doesn’t look like an email yet — check the format?';
        case 'auth/weak-password':
          return 'Try a longer password — 8 characters or more.';
        // V15/C2: sign-in error codes.
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          // Firebase v10+ emits 'invalid-credential' as a generic for both
          // wrong-password and user-not-found when "Email enumeration
          // protection" is on (security: don't reveal whether email exists).
          return 'That doesn’t match. Try again?';
        case 'auth/user-not-found':
          // Object form so SignInScreen renders inline "Sign up?" link.
          // (Only fires on older Firebase config; modern projects emit
          // 'invalid-credential' instead.)
          return { message: 'No account with that email.', code };
        case 'auth/too-many-requests':
          return 'Too many tries. Take a breath, try again in a few minutes.';
        default:
          return generic;
      }
    }

      { emoji: '🚀', title: 'LAUNCH',      heading: 'Reconnect with yourself',
        body: '"Get gentle nudges to live as your true self in the real world."' },
      { emoji: '🤝', title: 'RETURN',      heading: 'Come back when lost',
        body: '"When life gets foggy, we\'ll remind you who you are."' },
      { emoji: '🌱', title: 'MY PRACTICE', heading: 'Build yourself, daily',
        body: 'Small exercises to help you reconnect with who you are — one day at a time.' },
    ];
    const PromiseScreen = ({ onContinue, onBack }) => (
      <div className="phone-frame fade-in">
        <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
        <div className="flex-1 overflow-y-auto no-scrollbar px-6">
          <h2 className="text-[26px] font-serif text-g-charcoal leading-snug mb-5">
            Here's what Grounded will<br/>help you do:
          </h2>
          <div className="space-y-4 pb-3">
            {PROMISE_CARDS.map(c => (
              <div key={c.title} className="card p-5">
                <div className="text-g-green font-bold tracking-wide text-[15px] mb-2">
                  <span className="mr-1">{c.emoji}</span> {c.title}
                </div>
                <div className="font-bold text-g-charcoal text-[15px] mb-2">{c.heading}</div>
                <p className="text-g-charcoal text-sm leading-relaxed">{c.body}</p>
              </div>
            ))}
          </div>
        </div>
        <div className="pt-3 pb-20 flex justify-center">
          <PillButton onClick={onContinue}>Let's build your mirror</PillButton>
        </div>
      </div>
    );

    // ============================================================
    // 4A. SIGN UP (V15/C1 — wired to groundedAuth.signUpWithEmail)
    // ============================================================
    // Strips V14's fake social buttons (Google now lives on Welcome; Apple/FB
    // deferred per F2). Display name optional. Show-password toggle for typo
    // catching without a confirm field. Submit gates on email format + 8+ char
    // password. B2-style spinner inside button + warm error banner on failure.
    // On 'auth/email-already-in-use' the banner gets an inline "Sign in instead?"
    // link that pre-fills the email on the sign-in screen via App's
    // signInPrefill state. On success: A3+J1 listener fires → resolver routes
    // to mirror onboarding ('values'), no manual navigation needed here.
    const SignUpScreen = ({ groundedAuth, onSubmitted, onSignIn, onSignInInstead, onBack }) => {
      const [name, setName]         = useState('');
      const [email, setEmail]       = useState('');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd]   = useState(false);
      const [pending, setPending]   = useState(false);
      const [error, setError]       = useState(null);   // string | { message, code } | null

      const emailValid    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
      const passwordValid = password.length >= 8;
      const formValid     = emailValid && passwordValid && !pending;

      const handleSubmit = async () => {
        if (!formValid) return;
        setError(null);
        setPending(true);
        try {
          if (!groundedAuth || !groundedAuth.signUpWithEmail) {
            // Defensive: should never hit since signup route is auth-aware.
            setError('Couldn’t create account. Try again?');
            setPending(false);
            return;
          }
          const r = await groundedAuth.signUpWithEmail(email.trim(), password, name.trim());
          if (!r || !r.ok) {
            const m = mapAuthError(r && r.code, 'signup');
            if (m) setError(m);
            console.warn('[C1] signUpWithEmail failed:', r && r.code);
            setPending(false);
            return;
          }
          // On success: A3+J1 listener fires → routes to 'values'. Component unmounts.
          if (onSubmitted) onSubmitted();
          // Defensive: clear pending in case the listener is delayed (e.g., backend
          // ack arrives but auth-state event lags). Component will unmount on route,
          // so this is mostly preventive — React 18 silently no-ops on unmounted.
          setPending(false);
        } catch (e) {
          console.error('[C1] signUpWithEmail threw:', e);
          setError('Couldn’t create account. Try again?');
          setPending(false);
        }
      };

      // Banner shape handling: string vs object (with code for inline action).
      const errorMessage     = error && (typeof error === 'string' ? error : error.message);
      const errorIsEmailUsed = !!(error && typeof error === 'object' && error.code === 'auth/email-already-in-use');

      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-7 pb-4">
            <h2 className="text-[28px] font-serif text-g-charcoal text-center mt-3 mb-2">Create your account</h2>
            <p className="text-center text-g-gray text-sm mb-6">Sign up to start your Grounded journey.</p>

            <div className="space-y-3">
              <input
                className="input-field"
                type="text"
                placeholder="What should we call you? (optional)"
                value={name}
                onChange={(e) => setName(e.target.value)}
                autoComplete="given-name"
                disabled={pending}
              />
              <input
                className="input-field"
                type="email"
                placeholder="Your email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                autoCapitalize="none"
                autoComplete="email"
                inputMode="email"
                disabled={pending}
              />
              <div className="relative">
                <input
                  className="input-field pr-12"
                  type={showPwd ? 'text' : 'password'}
                  placeholder="8+ characters"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoComplete="new-password"
                  disabled={pending}
                />
                <button
                  type="button"
                  onClick={() => setShowPwd(!showPwd)}
                  aria-label={showPwd ? 'Hide password' : 'Show password'}
                  className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-g-gray"
                  tabIndex={-1}
                >
                  {showPwd ? (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  ) : (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  )}
                </button>
              </div>
            </div>

            {/* C1 ERROR BANNER — same look as B2; conditional inline link for email-in-use. */}
            {error && (
              <div
                role="alert"
                className="mt-4 px-4 py-3 rounded-2xl text-left text-[13px] leading-snug"
                style={{ backgroundColor: '#FFF8F0', color: '#C97C7C' }}
              >
                {errorMessage}
                {errorIsEmailUsed && (
                  <>
                    {' '}
                    <button
                      type="button"
                      onClick={() => onSignInInstead && onSignInInstead(email.trim())}
                      className="underline font-semibold"
                      style={{ color: '#C97C7C' }}
                    >
                      Sign in instead?
                    </button>
                  </>
                )}
              </div>
            )}

            <div className="mt-6 flex justify-center">
              <button
                onClick={handleSubmit}
                disabled={!formValid}
                className="px-10 py-3.5 rounded-full bg-g-green text-white text-[15px] font-semibold transition-all active:scale-[0.98] active:bg-g-deep disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center gap-2.5"
              >
                {pending && (
                  /* B2-style spinner — white arc on faded white track for sage-filled button. */
                  <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.35)" strokeWidth="3" />
                    <path d="M12 2 a10 10 0 0 1 10 10" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                )}
                <span>Create account</span>
              </button>
            </div>

            <p className="text-center text-[11px] text-g-gray mt-4 px-2 leading-relaxed">
              By signing up you agree to your data being stored securely.<br/>
              Privacy policy coming soon.
            </p>
          </div>
          <div className="px-6 pb-6 text-center">
            <p className="text-sm text-g-gray">
              Have an account?{' '}
              <button onClick={onSignIn} className="text-g-deep font-semibold underline">Sign in</button>
            </p>
          </div>
        </div>
      );
    };

    // ============================================================
    // 4B. SIGN IN (V15/C2 — wired to groundedAuth.signInWithEmail)
    // ============================================================
    // Strips V14's fake social buttons (Google now lives on Welcome; Apple/FB
    // deferred per F2). prefillEmail seeds the email input when the user came
    // here via C1's "Sign in instead?" link. Show-password toggle, B2-style
    // spinner inside button + warm error banner. Inline forgot-password flow
    // (sendPasswordReset) instead of a separate screen — C3 can replace later
    // with a polished 2-step flow without breaking this.
    // On 'auth/user-not-found' the banner gets an inline "Sign up?" link.
    // On success: A3+J1 listener fires → resolver routes to home or values.
    const SignInScreen = ({ groundedAuth, prefillEmail, onSubmitted, onSignUp, onBack }) => {
      const [email, setEmail]       = useState(prefillEmail || '');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd]   = useState(false);
      const [pending, setPending]   = useState(false);
      const [error, setError]       = useState(null);   // string | { message, code } | null
      const [resetState, setResetState] = useState('idle');  // 'idle' | 'sending' | 'sent'

      const emailValid    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
      // Sign-in: any non-empty password. Returning users may have legacy
      // short passwords; Firebase rejects empty server-side anyway.
      const passwordValid = password.length >= 1;
      const formValid     = emailValid && passwordValid && !pending;

      const handleSubmit = async () => {
        if (!formValid) return;
        setError(null);
        setPending(true);
        try {
          if (!groundedAuth || !groundedAuth.signInWithEmail) {
            setError('Couldn’t sign in. Try again?');
            setPending(false);
            return;
          }
          const r = await groundedAuth.signInWithEmail(email.trim(), password);
          if (!r || !r.ok) {
            const m = mapAuthError(r && r.code, 'signin');
            if (m) setError(m);
            console.warn('[C2] signInWithEmail failed:', r && r.code);
            setPending(false);
            return;
          }
          // On success: A3+J1 listener fires → routes to home/values. Component unmounts.
          if (onSubmitted) onSubmitted();
          // Defensive: clear pending in case the listener is delayed (e.g., backend
          // ack arrives but auth-state event lags). Component will unmount on route,
          // so this is mostly preventive — React 18 silently no-ops on unmounted.
          setPending(false);
        } catch (e) {
          console.error('[C2] signInWithEmail threw:', e);
          setError('Couldn’t sign in. Try again?');
          setPending(false);
        }
      };

      const handleForgot = async () => {
        if (!emailValid) {
          setError('Type your email above first, then tap Forgot password.');
          return;
        }
        setError(null);
        setResetState('sending');
        try {
          if (!groundedAuth || !groundedAuth.sendPasswordReset) {
            setResetState('idle');
            setError('Couldn’t send reset link. Try again?');
            return;
          }
          const r = await groundedAuth.sendPasswordReset(email.trim());
          if (r && r.ok) {
            setResetState('sent');
          } else {
            const m = mapAuthError(r && r.code, 'signin');
            if (m) setError(typeof m === 'string' ? m : m.message);
            console.warn('[C2] sendPasswordReset failed:', r && r.code);
            setResetState('idle');
          }
        } catch (e) {
          console.error('[C2] sendPasswordReset threw:', e);
          setError('Couldn’t send reset link. Try again?');
          setResetState('idle');
        }
      };

      // Banner shape handling: string vs object (with code for inline action).
      const errorMessage     = error && (typeof error === 'string' ? error : error.message);
      const errorIsNoAccount = !!(error && typeof error === 'object' && error.code === 'auth/user-not-found');

      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-7 pb-4">
            <h2 className="text-[28px] font-serif text-g-charcoal text-center mt-3 mb-2">Welcome back</h2>
            <p className="text-center text-g-gray text-sm mb-6">Sign in to your Grounded account.</p>

            <div className="space-y-3">
              <input
                className="input-field"
                type="email"
                placeholder="Your email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                autoCapitalize="none"
                autoComplete="email"
                inputMode="email"
                disabled={pending}
              />
              <div className="relative">
                <input
                  className="input-field pr-12"
                  type={showPwd ? 'text' : 'password'}
                  placeholder="Your password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoComplete="current-password"
                  disabled={pending}
                />
                <button
                  type="button"
                  onClick={() => setShowPwd(!showPwd)}
                  aria-label={showPwd ? 'Hide password' : 'Show password'}
                  className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-g-gray"
                  tabIndex={-1}
                >
                  {showPwd ? (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  ) : (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  )}
                </button>
              </div>
            </div>

            {/* C2 ERROR BANNER — same look as B2/C1; conditional inline link for user-not-found. */}
            {error && (
              <div
                role="alert"
                className="mt-4 px-4 py-3 rounded-2xl text-left text-[13px] leading-snug"
                style={{ backgroundColor: '#FFF8F0', color: '#C97C7C' }}
              >
                {errorMessage}
                {errorIsNoAccount && (
                  <>
                    {' '}
                    <button
                      type="button"
                      onClick={() => onSignUp && onSignUp()}
                      className="underline font-semibold"
                      style={{ color: '#C97C7C' }}
                    >
                      Sign up?
                    </button>
                  </>
                )}
              </div>
            )}

            <div className="mt-6 flex justify-center">
              <button
                onClick={handleSubmit}
                disabled={!formValid}
                className="px-10 py-3.5 rounded-full bg-g-green text-white text-[15px] font-semibold transition-all active:scale-[0.98] active:bg-g-deep disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center gap-2.5"
              >
                {pending && (
                  <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.35)" strokeWidth="3" />
                    <path d="M12 2 a10 10 0 0 1 10 10" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                )}
                <span>Sign in</span>
              </button>
            </div>

            {/* C2 INLINE FORGOT-PASSWORD — three-state: idle (link) / sending / sent. */}
            <div className="mt-5 flex justify-center text-center min-h-[24px]">
              {resetState === 'idle' && (
                <button
                  type="button"
                  onClick={handleForgot}
                  className="text-g-deep text-sm underline font-semibold"
                >
                  Forgot password?
                </button>
              )}
              {resetState === 'sending' && (
                <p className="text-g-gray text-sm italic">Sending reset link…</p>
              )}
              {resetState === 'sent' && (
                <p className="text-g-deep text-sm italic px-4 leading-snug">
                  Reset link sent to {email.trim()}. Check your inbox.
                </p>
              )}
            </div>
          </div>
          <div className="px-6 pb-6 text-center">
            <p className="text-sm text-g-gray">
              Don’t have an account?{' '}
              <button onClick={onSignUp} className="text-g-deep font-semibold underline">Sign up</button>
            </p>
          </div>
        </div>
      );
    };

    // ============================================================
    // 5. VALUES STEP
    // ============================================================
    const ALL_VALUES = [
      'Freedom','Independence','Creativity','Curiosity','Success','Ambition',
      'Growth','Impact','Family','Friendship','Love','Belonging','Stability',
      'Health','Peace','Adventure','Fun','Kindness','Honesty','Loyalty',
      'Justice','Nature','Spirituality','Gratitude'
    ];
    const ValuesStep = ({ onContinue, onSkip, onBack, initial = [] }) => {
      const [picked, setPicked] = useState(initial);
      const max = 5;
      const toggle = (v) => {
        if (picked.includes(v)) setPicked(picked.filter(x => x !== v));
        else if (picked.length < max) setPicked([...picked, v]);
      };
      const done = picked.length === max;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2"><BackArrow onClick={onBack} /></div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <p className="text-center text-g-charcoal font-serif text-[20px] mb-4">Step 1/3</p>
            <h2 className="text-[26px] font-serif text-g-charcoal text-center leading-snug">What matters most to you?</h2>
            <p className="text-center text-g-charcoal text-sm mt-2">Pick 5 values that feel like YOU.</p>
            <p className="text-center text-g-gray text-xs mt-1">Selected: {picked.length}/5</p>
            <div className="flex flex-wrap justify-center gap-2 mt-6">
              {ALL_VALUES.map(v => {
                const selected = picked.includes(v);
                const disabled = !selected && picked.length >= max;
                return (
                  <button key={v} onClick={() => toggle(v)} disabled={disabled}
                          className={`vchip ${selected ? 'selected' : ''}`}>{v}</button>
                );
              })}
            </div>
            <p className="text-center text-g-gray text-sm italic mt-6">This can change. Let it be.</p>
          </div>
          <div className="pt-3 pb-20 flex flex-col items-center">
            <PillButton onClick={() => onContinue(picked)} disabled={!done}>Continue</PillButton>
            <button onClick={onSkip} className="text-g-deep text-sm underline font-semibold mt-4">I'm not sure yet →</button>
          </div>
        </div>
      );
    };

    // ============================================================
    // 6. TOP 3
    // ============================================================
    const TopThreeStep = ({ pool, onContinue, onBack }) => {
      const [picked, setPicked] = useState([]);
      const max = 3;
      const toggle = (v) => {
        if (picked.includes(v)) setPicked(picked.filter(x => x !== v));
        else if (picked.length < max) setPicked([...picked, v]);
      };
      const done = picked.length === max;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 1b/3</p>
            <div className="w-8" />
          </div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <h2 className="text-[24px] font-serif text-g-charcoal text-center leading-snug mt-2">
              If you had to protect just 3,<br/>which would they be?
            </h2>
            <p className="text-center text-g-charcoal text-sm mt-3">These will guide your Mirror and actions.</p>
            <p className="text-center text-g-gray text-xs mt-1">Selected: {picked.length}/3</p>
            <div className="flex flex-wrap justify-center gap-2 mt-6">
              {pool.map(v => {
                const selected = picked.includes(v);
                const disabled = !selected && picked.length >= max;
                return (
                  <button key={v} onClick={() => toggle(v)} disabled={disabled}
                          className={`vchip ${selected ? 'selected' : ''}`}>{v}</button>
                );
              })}
            </div>
            <p className="text-center text-g-gray text-sm italic mt-10">This can change. Let it be.</p>
          </div>
          <div className="pt-3 pb-20 flex flex-col items-center">
            <PillButton onClick={() => onContinue(picked)} disabled={!done}>Continue</PillButton>
          </div>
        </div>
      );
    };

    // ============================================================
    // 7. ENERGY MAPPING
    // ============================================================
    const ComfortStep = ({ onContinue, onSkip, onBack, initial = {} }) => {
      const [comfortable, setComfortable] = useState(initial.comfortable || '');
      const [uncomfortable, setUncomfortable] = useState(initial.uncomfortable || '');
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 2/3</p>
            <div className="w-8" />
          </div>
          <div className="flex-1 overflow-y-auto no-scrollbar px-6">
            <h3 className="text-[20px] font-serif text-g-charcoal text-center mt-2">When do you feel most comfortable?</h3>
            <p className="text-center text-g-charcoal text-sm mt-2 mb-3">"What situations, places, or activities<br/>make you feel at ease?"</p>
            <textarea className="textarea-field" rows={4}
              value={comfortable} onChange={e=>setComfortable(e.target.value)} />
            <h3 className="text-[20px] font-serif text-g-charcoal text-center mt-6">When do you feel uncomfortable?</h3>
            <p className="text-center text-g-charcoal text-sm mt-2 mb-3">"What situations tend to drain<br/>you or feel off?"</p>
            <textarea className="textarea-field" rows={4}
              value={uncomfortable} onChange={e=>setUncomfortable(e.target.value)} />
            <p className="text-center text-g-gray text-sm italic mt-6">This can change. Let it be.</p>
            <div className="text-center mt-3">
              <button onClick={onSkip} className="text-g-deep text-sm underline font-semibold">I'm not sure yet →</button>
            </div>
          </div>
          <div className="pt-2 pb-20 flex justify-center">
            <PillButton onClick={() => onContinue({ comfortable, uncomfortable })}
              disabled={!comfortable.trim() && !uncomfortable.trim()}>Continue</PillButton>
          </div>
        </div>
      );
    };

    // ============================================================
    // 8. BEST SELF SNAPSHOT
    // ============================================================
    const AlignedSelfStep = ({ onContinue, onSkip, onBack, initial = '' }) => {
      const [text, setText] = useState(initial);
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <p className="font-serif text-[20px] text-g-charcoal">Step 3/3</p>

    //   - Top-right "Save" text button (NEW slot, was empty <div className="w-8"/>)
    //     → onSaveDraft (resumable, editable)
    //   - Bottom "Send" pill → ConfirmSendModal → onSubmit (locked)
    //   - Back arrow: silent discard
    //   - If existing.submitted=true OR legacy array: locked state (read-only).
    // Backward compat: completed[today][id] may be Array<string> (V15) or { items, submitted } (V16).
    const ExerciseEntry = ({ exercise, existing, onSaveDraft, onSubmit, onBack }) => {
      // Detect shape: array = V15 legacy (treat as locked), object = V16 (read submitted flag).
      const existingItems = Array.isArray(existing) ? existing : (existing && existing.items) || null;
      const isLocked = Array.isArray(existing) ? !!existing.length : (!!existing && existing.submitted !== false);
      const initialFields = existingItems && existingItems.length
        ? existingItems
        : (exercise.type === 'numbered'
            ? Array((exercise.defaultFields || 3)).fill('')
            : ['']);
      const [items, setItems] = useState(initialFields);
      const [showConfirm, setShowConfirm] = useState(false);
      const updateItem = (i, val) => {
        if (isLocked) return;
        const next = [...items]; next[i] = val; setItems(next);
      };
      const addMore = () => setItems([...items, '']);
      const dateLabel = useMemo(() => monthDay(), []);
      // V19/Bug14: enable Save when there's an existing draft, so user can
      // clear it via empty Save (handler deletes the entry server-side).
      const canSave = items.some(i => i.trim().length > 0) || !!existing;
      const lockedStyle = isLocked ? { backgroundColor: '#E8F0EC' } : null;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <h3 className="font-serif text-[20px] text-g-charcoal flex items-center gap-2">

                when editable, "✓ Sent" when locked. */}
            {isLocked
              ? <span className="text-g-green text-sm font-semibold">✓ Sent</span>
              : <SaveDraftButton canSave={canSave} onSave={() => onSaveDraft(items.filter(i => i.trim()))} />}
          </div>
          {/* V37 (revision 2): button moved INSIDE flex-1 as last child after
              the italic sub-line. Top content stays naturally anchored top,
              Send button reads as part of same content group with mt-5 (20px)
              gap from italic. Empty space lands BELOW button at frame bottom.
              When locked (isLocked=true), Send disappears — italic sub becomes
              the natural last element.
              V45: pb-8 on flex-1 — adds 32px breathing space at the bottom of
              scroll content so the Send button doesn't kiss the disclaimer /
              iOS gesture bar on long item lists (Parn flag, mom's iOS test). */}
          <div className="flex-1 overflow-y-auto no-scrollbar px-6 pb-8">
            <p className="text-g-charcoal text-sm mt-1">{dateLabel}</p>
            <h2 className="font-serif text-[20px] text-g-charcoal mt-4 mb-3">{exercise.entryHeading}</h2>
            {exercise.type === 'numbered' ? (
              <div className="card-outline p-5" style={lockedStyle}>
                {items.map((val, i) => (
                  <div key={i} className="flex items-start gap-3 mb-2">
                    {/* V18/Bug12: sync span text-size + top-padding with input
                        (input is 15px font, 4px top-padding) so "1." aligns
                        on the same baseline as typed text. */}
                    <span className="text-g-gray w-5 text-[15px] pt-1">{i+1}.</span>
                    <input className="numbered-input"
                      value={val}
                      disabled={isLocked}
                      onChange={e => updateItem(i, e.target.value)} />
                  </div>
                ))}
                {!isLocked && <button onClick={addMore} className="text-g-gray text-sm mt-1">+ Add more</button>}
              </div>
            ) : (

    const PracticeCalendar = ({ data, onBack }) => {
      const [selected, setSelected] = useState(null);
      const completed = data.completed || {};
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const dayKey = (d) => `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      // V16/Bug10: each completed[day][exerciseId] may be Array<string> (V15) or
      // { items, submitted } (V16).
      // V17/Bug11 (calendar filter): drafts hidden — only submitted exercises
      // count toward the dot or get rendered. Legacy arrays treated as submitted.
      const isSubmitted = (raw) => Array.isArray(raw) ? !!raw.length : (!!raw && raw.submitted !== false);
      const entryItems = (raw) => Array.isArray(raw) ? raw : (raw && raw.items) || [];
      const hasDot = (d) => {
        const dayEntries = completed[dayKey(d)];
        if (!dayEntries) return false;
        // At least one exercise on this day must be submitted (drafts don't count).
        return Object.values(dayEntries).some(isSubmitted);
      };
      const selectedData = selected != null ? (completed[dayKey(selected)] || null) : null;
      return (
        <div className="phone-frame fade-in">
          <div className="px-6 pt-6 pb-2 flex items-center justify-between">
            <BackArrow onClick={onBack} />
            <button onClick={onBack} className="text-g-charcoal text-base">Done</button>

            {selected && selectedData && (
              <div className="card-outline p-5 mt-5 mb-4">
                <h3 className="font-bold text-g-charcoal text-[15px] mb-3">{monthName(month)} {selected}</h3>
                {Object.keys(selectedData).map(eid => {
                  const e = ALL_EXERCISES.find(x => x.id === eid);
                  if (!e) return null;
                  const entry = selectedData[eid];
                  // V16/Bug10: backward compat — entry may be Array<string> (V15)
                  // or { items, submitted } (V16). entryItems() normalizes either shape.
                  // V17/Bug11 (calendar filter): skip drafts from the entry list.
                  if (!isSubmitted(entry)) return null;
                  const lines = entryItems(entry);
                  return (
                    <div key={eid} className="mb-3">
                      <p className="font-bold text-g-charcoal text-sm">✅ {e.title}</p>
                      <p className="text-g-charcoal text-sm leading-relaxed">{lines.join(', ')}</p>

        </div>
      );

    // ============================================================
    // V38/Phase2 — SUBSCRIPTION SETTINGS (replaces old PremiumScreen / "Go Deeper")
    //
    // Smart state router — reads subState from groundedSync.subscribeSubscription
    // and renders one of 3 modes:
    //   TRIAL   — countdown + "Only N founder spots left" pill (if available)
    //             + comparison table + "Pick your tier" CTA → tier_pick
    //   ACTIVE  — tier name + Founder/Lifetime badge + member-since + locked
    //             rate + brief feature list of CURRENT tier + "Manage
    //             subscription" → openCustomerPortal (Stripe Portal)
    //   LAPSED  — "Subscription paused" + grace countdown (if status='grace')
    //             + comparison table + "Resubscribe" CTA → tier_pick
    //
    // V39: status='grace' moved from ACTIVE to LAPSED bucket per Parn — grace
    //   = "subscription paused, X days to resubscribe" UX, not "active with
    //   payment retry" UX. After grace ends → status='lapsed', same screen

    // Gracefully degrades pre-M2: subState=null → TRIAL fallback,

    // ============================================================

    // Comparison table content (V39 — embedded in TRIAL + LAPSED modes only).

    // "Coming soon" = roadmap-honest placeholder.
    const SUBSCRIPTION_COMPARE = [

      ['Free write',                        '✓', '✓'],
      ['My Mirror',                         '✓', '✓'],
      ['My Practice',                       '✓', '✓'],

      ['Edit past entries (30 days back)',  '—', '✓'],

      ['Community',                         '—', 'Coming soon'],

    // ACTIVE-state feature lists — surface the CURRENT tier only (locked-forever
    // spec: user can't switch mid-subscription, so showing "the other tier" is
    // counterproductive). Pro list = Premium 6 + 4 Pro-exclusive (last 2 are
    // "Coming soon" honest roadmap markers).
    const SUB_PREMIUM_FEATURES = [
      'Values', 'Daily prompts', 'Free write', 'My Mirror', 'My Practice', 'Launchpad',
    ];
    const SUB_PRO_FEATURES = [
      ...SUB_PREMIUM_FEATURES,
      'Edit past entries (30 days back)',
      'Up to 10 weekly missions',
      'Community (Coming soon)',
      'AI insights (Coming soon)',
    ];

    const SubscriptionCompareTable = () => (
      <div className="card-outline mt-7 p-0 overflow-hidden">
        <div className="grid border-b border-g-line" style={{ gridTemplateColumns: '52% 24% 24%' }}>
          <div className="py-2.5 px-3 text-[12px] tracking-widest text-g-gray font-bold border-r border-g-line"></div>
          <div className="py-2.5 text-center text-[12px] tracking-widest text-g-charcoal font-bold border-r border-g-line">PREMIUM</div>
          {/* V41: Pro header colored Grounded Green #5B8A72 (was Deep Forest
              #3D5E4C in V40). Brighter sage reads friendlier — Pro reads as
              "the upgraded path", not "the darker corner". */}
          <div className="py-2.5 text-center text-[12px] tracking-widest font-bold" style={{ color: '#5B8A72' }}>PRO</div>
        </div>
        {SUBSCRIPTION_COMPARE.map(([label, p, pr], i) => {
          // V40 + V41: "Coming soon" cells render at 11px italic gray to fit
          // the narrow Pro column (~94px). V41 moves the size to inline style
          // for guaranteed application (bypasses any Tailwind arbitrary-value
          // edge cases on the CDN). ✓ / — cells stay at 13px for parity with
          // Premium column.
          const isComingSoon = pr === 'Coming soon';
          return (
            <div key={i} className={`grid ${i < SUBSCRIPTION_COMPARE.length - 1 ? 'border-b border-g-line' : ''}`}
                 style={{ gridTemplateColumns: '52% 24% 24%' }}>
              <div className="py-2 px-3 text-[13px] text-g-charcoal leading-snug border-r border-g-line">{label}</div>
              <div className="py-2 text-center text-[13px] text-g-charcoal border-r border-g-line">{p}</div>
              <div

                style={{ fontSize: isComingSoon ? '11px' : '13px' }}

    const SubscriptionFeatureList = ({ features }) => (
      <ul className="mt-7 space-y-2">
        {features.map((f, i) => (
          <li key={i} className="flex items-start gap-3">
            <span className="text-g-green text-[13px] leading-relaxed mt-0.5">✓</span>
            <span className={`text-[14px] leading-relaxed ${f.includes('(Coming soon)') ? 'text-g-gray italic' : 'text-g-charcoal'}`}>{f}</span>
          </li>
        ))}
      </ul>
    );

    const SubscriptionSettingsScreen = ({ subState, sync, onTierPick, onBack, onHome }) => {
      const [notice, setNotice] = useState(null);
      const flashNotice = (msg) => { setNotice(msg); setTimeout(() => setNotice(null), 3000); };

      const status = subState && subState.status;
      const trialDaysLeft = (sync && typeof sync.getTrialDaysLeft === 'function')
        ? sync.getTrialDaysLeft() : null;
      const graceDaysLeft = (sync && typeof sync.getDaysLeftInGrace === 'function')
        ? sync.getDaysLeftInGrace() : null;

      // V39 → V49/M2: grace re-categorization reverted. Per M2 spec, "Manage
      // subscription" button should show when status ∈ {active, grace}, which
      // means grace belongs in the ACTIVE bucket (user still has access + can
      // fix card via Stripe Portal). LAPSED is reserved for fully-lapsed
      // states where there's no active subscription to manage.
      // Grace countdown surfaces inline in ACTIVE mode (warning line).
      const isTrial   = status === 'trial';
      const isActive  = status === 'active' || status === 'grace';
      const isLapsed  = status === 'lapsed' || status === 'canceled' || status === 'expired';
      const isInGrace = status === 'grace';

      // Founder pill data — surface in TRIAL mode (matches TierPick urgency).
      // V49: shape migrated from V28 ({count, capacity}) to M2-aligned
      // ({count, max, remaining}). Prefer remaining/max when present, fall
      // back to derived for backward-compat.
      let founderLeftCount = null;
      let founderCapacity  = 200;  // default cohort cap, override from Backend
      if (sync && typeof sync.getFounderCount === 'function') {
        try {
          const f = sync.getFounderCount();
          if (f && typeof f.count === 'number') {
            const max = (typeof f.max === 'number')
              ? f.max
              : ((typeof f.capacity === 'number') ? f.capacity : 200);
            const remaining = (typeof f.remaining === 'number')
              ? f.remaining
              : Math.max(0, max - f.count);
            founderLeftCount = remaining;
            founderCapacity  = max;
          }
        } catch (e) { /* defensive — pre-M2 fallback */ }
      }

      // V49/M2: async handlePortal — calls openCustomerPortal({returnUrl}),
      // awaits Promise resolving to { ok, url }, then redirects via
      // window.location.href = url. Backend does NOT redirect; FE controls
      // navigation. Loading state via `portalPending` blocks double-tap +
      // surfaces spinner on the Manage button.
      const [portalPending, setPortalPending] = useState(false);
      const handlePortal = async () => {
        if (portalPending) return;
        if (!sync || typeof sync.openCustomerPortal !== 'function') {
          flashNotice('Customer portal ships next update');
          return;
        }
        setPortalPending(true);
        try {
          // V49 hotfix: window.location.origin strips the /grounded/ subdir
          // (deployed at parnmada-ux.github.io/grounded/). Derive baseUrl from
          // origin + pathname-without-last-segment so the redirect lands inside
          // the subdir. Regex /\/[^/]*$/ strips the trailing file ("index.html"
          // or "grounded PWA V49.html") if present, keeps directory path intact.
          // Works for GitHub Pages subdir, custom domain root, and file:// dev.
          const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
          const returnUrl = baseUrl + '?portal=return';
          const result = await sync.openCustomerPortal({ returnUrl });
          if (result && result.url) {
            window.location.href = result.url;
            // navigation handled — leave pending true through redirect
          } else {
            console.warn('[V49] openCustomerPortal returned no url:', result);
            flashNotice('Could not open portal — please try again.');
            setPortalPending(false);
          }
        } catch (e) {
          console.warn('[V49] openCustomerPortal threw:', e);
          if (e && (e.code === 'no-subscription' || e.message === 'no-subscription')) {
            flashNotice("You don't have an active subscription to manage.");
          } else {
            flashNotice('Could not open subscription portal — please try again.');
          }
          setPortalPending(false);
        }
      };

      let body = null;
      // ── ACTIVE mode (status='active' only) ────────────────────────
      if (isActive) {
        const tier = subState.tier === 'pro' ? 'Pro' : 'Premium';
        const isFounder  = !!subState.isFounder;
        const isLifetime = !!subState.isLifetime;
        const founderNum = subState.founderNumber || subState.founderIndex || null;
        const startedAt  = subState.startedAt || subState.createdAt || null;
        const founderRate  = subState.tier === 'pro' ? 199 : 99;
        const standardRate = subState.tier === 'pro' ? 299 : 199;
        const lockedRate = isLifetime ? null : (isFounder ? founderRate : standardRate);
        const features = subState.tier === 'pro' ? SUB_PRO_FEATURES : SUB_PREMIUM_FEATURES;
        const formatDate = (iso) => {
          if (!iso) return '—';
          const d = new Date(iso);
          if (isNaN(d)) return '—';
          return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        };

        body = (
          <>
            <h2 className="font-serif font-semibold text-[28px] text-g-deep text-center mt-2">{tier}</h2>
            {(isFounder || isLifetime) && (
              <div className="flex justify-center mt-3">
                {isLifetime ? (
                  <span className="founder-pill" style={{
                    fontFamily: '"Crimson Text", Georgia, serif',
                    fontSize: '13px', fontStyle: 'italic', color: '#3D5E4C',
                  }}>Lifetime member</span>
                ) : (
                  <span className="founder-pill" style={{
                    fontFamily: '"Crimson Text", Georgia, serif',
                    fontSize: '13px', fontStyle: 'italic', color: '#3D5E4C',
                  }}>{founderNum ? `Founder · #${founderNum}` : 'Founder'}</span>
                )}
              </div>
            )}
            <div className="card-outline px-5 py-4 mt-6">
              <div className="flex items-center justify-between py-1">
                <span className="font-bold text-g-charcoal text-[14px]">Member since</span>
                <span className="text-g-charcoal text-[14px]">{formatDate(startedAt)}</span>
              </div>
              {lockedRate !== null && (
                <div className="flex items-center justify-between py-1 mt-1">
                  <span className="font-bold text-g-charcoal text-[14px]">Locked rate</span>
                  <span className="text-g-charcoal text-[14px]">{lockedRate} THB / month</span>
                </div>
              )}
            </div>
            {/* V39: brief feature list of current tier (no compare table —
                user already chose, locked-forever spec). Coming-soon items
                render in italic gray to set expectation honestly. */}
            <SubscriptionFeatureList features={features} />
            {/* V49: grace countdown surfaces here (moved back from LAPSED).
                During grace, user has active access + can update payment via
                Manage button. The countdown is a warning, not a paused state. */}
            {isInGrace && graceDaysLeft !== null && graceDaysLeft > 0 && (
              <p className="text-center text-g-charcoal text-sm italic mt-6 px-2">
                Payment update needed. {graceDaysLeft} day{graceDaysLeft === 1 ? '' : 's'} remaining.
              </p>
            )}
            <div className={`flex justify-center ${isInGrace ? 'mt-4' : 'mt-8'}`}>
              <PillButton onClick={handlePortal} disabled={portalPending}>
                {portalPending ? 'Opening…' : 'Manage subscription'}
              </PillButton>
            </div>
          </>
        );
      }
      // ── LAPSED mode (status='lapsed'/'canceled'/'expired') ────────
      // V49: grace removed from this bucket — grace now ACTIVE (user can
      // still manage payment). LAPSED is reserved for fully-lapsed states
      // where there's no subscription to manage, only resubscribe.
      else if (isLapsed) {
        body = (
          <>
            <h2 className="font-serif font-semibold text-[26px] text-g-deep text-center mt-2 leading-snug">
              Your subscription<br/>paused
            </h2>
            <p className="text-center text-g-gray text-sm italic mt-5 px-2">
              Your data stays preserved. Resubscribe anytime to pick up where you left off.
            </p>
            <SubscriptionCompareTable />
            <div className="mt-8 flex justify-center pb-6">
              <PillButton onClick={onTierPick}>Resubscribe</PillButton>
            </div>
          </>
        );
      }
      // ── TRIAL mode (default + pre-M2 fallback) ────────────────────
      else {
        const daysText = (typeof trialDaysLeft === 'number')
          ? `${trialDaysLeft} day${trialDaysLeft === 1 ? '' : 's'} of Grounded left`
          : 'Your trial is active.';
        body = (
          <>
            <h2 className="font-serif font-semibold text-[28px] text-g-deep text-center mt-2">Your trial</h2>
            <p className="text-center text-g-charcoal text-[15px] mt-5">{daysText}</p>
            <p className="text-center text-g-gray text-sm italic mt-3 px-4">
              After your trial, pick your tier to continue.
            </p>
            {/* V39: founder spots-left pill — same wording as TierPick for
                consistency. Renders only when founderLeftCount > 0. */}
            {typeof founderLeftCount === 'number' && founderLeftCount > 0 && (
              <div className="text-center mt-5">
                <span style={{
                  background: '#FFF8F0',
                  border: '1px solid #F0E8D8',
                  borderRadius: '999px',
                  padding: '7px 18px',
                  display: 'inline-block',
                  fontFamily: '"Crimson Text", Georgia, serif',
                  fontSize: '13px',
                  fontStyle: 'italic',

    const WEEKDAYS = ['S','M','T','W','T','F','S'];

    const formatBdayDisplay = (iso) => {

    const BirthdayCalendarModal = ({ value, onSave, onClose }) => {
      const today = new Date();
      const initial = value ? new Date(value) : new Date(today.getFullYear() - 20, today.getMonth(), 1);
      const [viewYear, setViewYear]   = useState(initial.getFullYear());
      const [viewMonth, setViewMonth] = useState(initial.getMonth());
      const [selDay, setSelDay]       = useState(value ? new Date(value).getDate() : null);
      const [selMonth, setSelMonth]   = useState(value ? new Date(value).getMonth() : null);
      const [selYear, setSelYear]     = useState(value ? new Date(value).getFullYear() : null);

      const thisYear = today.getFullYear();
      const years = [];
      for (let i = thisYear - 5; i >= thisYear - 100; i--) years.push(i);

      const firstDay = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const offset = firstDay.getDay(); // Sun = 0 ... matches WEEKDAYS S M T W T F S

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const goPrev = () => {
        if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); }
        else setViewMonth(viewMonth - 1);
      };
      const goNext = () => {
        // Prevent going beyond today minus 5 years (no future birthdays)
        const limit = new Date(thisYear - 5, today.getMonth(), 1);
        const proposed = new Date(viewYear, viewMonth + 1, 1);
        if (proposed > limit) return;
        if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); }
        else setViewMonth(viewMonth + 1);
      };

      const pickDay = (d) => {
        if (d == null) return;
        // Don't allow future dates relative to today minus 5 years
        const candidate = new Date(viewYear, viewMonth, d);
        const limit = new Date(thisYear - 5, today.getMonth(), today.getDate());
        if (candidate > limit) return;
        setSelDay(d); setSelMonth(viewMonth); setSelYear(viewYear);
      };

      const canSave = selDay != null && selMonth != null && selYear != null;
      const handleSave = () => {
        if (!canSave) return;
        const iso = `${selYear}-${String(selMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
        onSave(iso);
      };

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center px-6 pb-12"
             style={{background:'rgba(0,0,0,0.4)'}}
             onClick={onClose}>

              <button onClick={goPrev}
                      className="w-9 h-9 rounded-full hover:bg-g-sage text-g-charcoal text-xl">‹</button>
              <div className="flex items-center gap-2">
                <span className="font-bold text-g-charcoal text-[15px]">{MONTHS_FULL[viewMonth]}</span>
                <select className="font-bold text-g-charcoal text-[15px]"
                        style={{appearance:'none', background:'transparent', border:'1px solid #D9DEDB',
                                borderRadius:'8px', padding:'2px 24px 2px 8px',
                                backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%23888888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>\")",
                                backgroundRepeat:'no-repeat',
                                backgroundPosition:'right 6px center'}}
                        value={viewYear} onChange={e => setViewYear(parseInt(e.target.value))}>
                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <button onClick={goNext}
                      className="w-9 h-9 rounded-full hover:bg-g-sage text-g-charcoal text-xl">›</button>
            </div>

            {/* Weekday header */}
            <div className="grid grid-cols-7 gap-1 mb-1">
              {WEEKDAYS.map((w, i) => (
                <div key={i} className="text-center text-g-gray text-[12px] font-bold py-1">{w}</div>
              ))}
            </div>

            {/* Day grid */}
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                const isSel = d != null && d === selDay && viewMonth === selMonth && viewYear === selYear;
                const candidate = d != null ? new Date(viewYear, viewMonth, d) : null;
                const limit = new Date(thisYear - 5, today.getMonth(), today.getDate());
                const disabled = candidate && candidate > limit;
                return (
                  <button key={i}
                          disabled={d == null || disabled}
                          onClick={() => pickDay(d)}
                          className="aspect-square text-[13px] rounded-lg flex items-center justify-center"
                          style={{
                            background: isSel ? '#5B8A72' : 'transparent',
                            color: isSel ? '#FFFFFF' : (disabled ? '#D9DEDB' : '#333333'),
                            fontWeight: isSel ? 700 : 400,
                            cursor: d == null || disabled ? 'default' : 'pointer',
                          }}>
                    {d || ''}

            </div>

            {/* Actions — Cancel + Save (NO Today button) */}

              <button onClick={onClose}
                      className="px-5 py-2 rounded-full border border-g-line text-g-charcoal font-semibold text-sm">
                Cancel

              <button onClick={handleSave} disabled={!canSave}

                      style={{background: canSave ? '#5B8A72' : '#B8C8BD'}}>

    const RedeemCodeModal = ({ groundedSyncRef, onClose, onSuccess }) => {
      const [code, setCode] = useState('');
      const [pending, setPending] = useState(false);
      const [error, setError] = useState(null);
      const canRedeem = code.trim().length >= 3 && !pending;

      const handleRedeem = async () => {
        if (!canRedeem) return;
        setError(null);
        setPending(true);
        try {
          const sync = groundedSyncRef && groundedSyncRef.current;
          if (sync && typeof sync.redeemCode === 'function') {
            const r = await sync.redeemCode(code.trim());
            if (r && r.ok) {
              onSuccess(r);
            } else {
              const reason = r && r.reason;
              setError(reason === 'invalid'
                ? "That code didn't work. Check it and try again?"
                : 'Something went wrong. Try again?');
            }
          } else {
            // V25 stub — Worker not yet shipped
            setError("Code redemption is coming soon — we'll let you know.");
          }
        } catch (e) {
          console.warn('[V25] redeemCode threw:', e);
          setError('Something went wrong. Try again?');
        } finally {
          setPending(false);
