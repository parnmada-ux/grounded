              <p className="mt-3 text-[12.5px] italic leading-relaxed" style={{ color: '#888888' }}>
                More tools coming as Grounded grows.
              </p>
              <button
                onClick={() => handleClick('pro')}
                disabled={!!pending}
                className="mt-5 w-full px-6 py-3 rounded-full bg-g-green text-white text-[15px] font-semibold transition-all active:scale-[0.99] active:bg-g-deep disabled:opacity-60 disabled:cursor-wait disabled:active:scale-100 flex items-center justify-center gap-2"
              >
                {pending === 'pro' && (
                  <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.35)" strokeWidth="3" />
                    <path d="M12 2 a10 10 0 0 1 10 10" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                )}
                <span>{pending === 'pro' ? 'Redirecting…' : 'Choose Pro'}</span>
              </button>
            </div>

            {/* V49: bottom Founder pill removed — founder count now displayed
                ABOVE pricing cards (per M2 dispatch). Two-state sage/gray pill
                lives near the top of the card stack so it's seen before the
                pricing is read, not after. */}

            {/* Disclaimer — copy flips with founder state */}
            <p className="text-center text-[12px] italic leading-relaxed px-4 mt-7" style={{ color: '#888888', maxWidth: '300px', marginLeft: 'auto', marginRight: 'auto' }}>
              {disclaimer}
            </p>
          </div>

          {/* Inline notice — fires when onChoose returns a message (e.g., pre-M2 stub) */}
          {notice && (
            <div
              role="status" aria-live="polite"
              style={{
                position: 'absolute', bottom: 24, left: '50%', transform: 'translateX(-50%)',
                backgroundColor: 'rgba(61, 94, 76, 0.92)', color: 'white',
                padding: '10px 18px', borderRadius: '999px', fontSize: '13px',
                maxWidth: 'calc(100% - 48px)', textAlign: 'center',
                boxShadow: '0 4px 14px rgba(61,94,76,0.25)',
                zIndex: 50,
              }}
            >
              {notice}
            </div>
          )}
        </div>
      );
    };

    // ============================================================
    // V25/Phase2 — PAYWALL SCREEN (stub)
    // Triggered when canAccessApp() returns false (signed-in + lapsed/canceled).
    // Real screen content lands later (V25.x with Stripe + brand assets).
    // Soft Sage #F0F7F4 phone-frame override (moment screen).
    // ============================================================
    const PaywallScreen = () => (
      <div className="phone-frame fade-in" style={{ backgroundColor: '#F0F7F4' }}>
        <div className="flex-1 flex items-center justify-center text-center px-8">
          <div>
            <h2 className="font-serif text-[26px] text-g-deep mb-3" style={{ maxWidth: '320px' }}>
              Your time with Grounded — let's continue
            </h2>
            <p className="text-g-charcoal text-sm leading-relaxed" style={{ maxWidth: '280px' }}>
              Becoming more at home in who you are takes time.
            </p>
          </div>
        </div>
      </div>
    );

    // ============================================================
    // APP — Screen Router
    // ============================================================
    const App = () => {
      const [screen, setScreen]   = useState('welcome');
      const [data, setData]       = useState({});                 // V15: hydrated by bootstrap effect
      const [bootState, setBootState]     = useState('booting');  // V15: 'booting' | 'ready'
      const [groundedApi, setGroundedApi] = useState(null);       // V15: { groundedAuth, groundedSync } or null in fallback
      // V16/Bug9: defaults to isDev — production starts hidden, local starts visible.
      const [showDev, setShowDev] = useState(isDev);
      const [activeExerciseId, setActiveExerciseId] = useState(null);
      const [activeInfoExerciseId, setActiveInfoExerciseId] = useState(null);
      const [groundMeFrom, setGroundMeFrom] = useState('gm_triage');
      const [activeMirrorField, setActiveMirrorField] = useState(null);

      // V15: skip echoing storage on hydration ticks (server snapshots, initial localStorage load)
      const isHydratingRef = useRef(true);

      // V43: run-once guard for the boot-time auto-submit sweep. Without it,
      // every data-change re-render would re-trigger the sweep effect (because
      // it depends on `data`), creating a feedback loop.
      const autoSubmitRanRef = useRef(false);

      // V49/M2: run-once guard for the boot-time return-URL handler. The handler
      // reads ?checkout=success|cancel and ?portal=return params, clears them
      // via history.replaceState, and surfaces a notice or routes. Without the
      // guard, re-renders triggered by the post-checkout subscription update
      // would re-fire the handler against an already-cleared URL.
      const returnUrlRanRef = useRef(false);

      // V49: post-checkout / post-portal notice for the user on next render.
      // Surfaced as an absolute-positioned toast near the bottom of the frame.
      const [returnNotice, setReturnNotice] = useState(null);

      // V15/J1: flips true on first onAuthChange fire (or 400ms backstop) — gates the splash.
      const [authResolved, setAuthResolved] = useState(false);

      // V15/C1: ephemeral session-only state. C1 (sign-up screen) writes here
      // when user taps "Sign in instead?" on the email-already-in-use banner;
      // C2 (sign-in screen) reads it as the initial value of its email input.
      const [signInPrefill, setSignInPrefill] = useState('');

      // V15/C5: shown briefly when an anonymous user with localStorage data
      // signs in/up — covers the destination screen during firebase.js's
      // auto-migration of their reflections to Firestore. 1s minimum hold,
      // detection logic lives in the A3 listener below.
      const [migrating, setMigrating] = useState(false);

      // V15/Bug6: defers routing on sign-in until Firestore data hydrates.
      // firebase.js's onAuthStateChanged fires notifyAuth BEFORE the first
      // onSnapshot push, so getDataNow() at the auth event is stale. Without
      // this gate, returning users would get routed to 'values' picker.
      const [awaitingHydration, setAwaitingHydration] = useState(false);

      // V25/Phase2: subscription state from Backend's groundedSync.subscribeSubscription.
      // Null when no Backend / no user / pre-trial. Object once doc exists.
      // Used by route guard (paywall trigger) + Trial Banner (days-left banner).
      const [subState, setSubState] = useState(null);

      // V25/Phase2: Have-a-code modal toggle (opened from Trial Welcome).
      const [showRedeemModal, setShowRedeemModal] = useState(false);

      // V25/Phase2: ref to groundedSync for RedeemCodeModal — passes through
      // groundedApi mutations across re-renders without prop drilling.
      const groundedSyncRef = useRef(null);
      groundedSyncRef.current = groundedApi && groundedApi.groundedSync;

      // V15/Bug4: Account form draft — preserves in-progress edits across
      // sub-screen navigation (Change email/mobile/password). Null when not
      // in an Account session; initialized lazily on enterAccount().
      const [accountDraft, setAccountDraft] = useState(null);

      // V15/Bug4: Account session helpers.
      const enterAccount = () => {
        // Initialize from data.user only if no draft exists. Persists across
        // sub-screen jumps; cleared only on exit/commit/delete.
        if (!accountDraft) {
          setAccountDraft({
            displayName:      (data.user && data.user.displayName) || '',
            email:             (data.user && data.user.email)       || '',
            username:          (data.user && data.user.username)    || '',
            mobile:            (data.user && data.user.mobile)      || '',
            birthday:          (data.user && data.user.birthday)    || '',
            birthdaySet:      !!(data.user && data.user.birthdaySet),
            // Snapshot of original username, used by AccountScreen for the
            // "unchanged" check in availability validation. Doesn't drift.
            originalUsername:  (data.user && data.user.username)    || '',
          });
        }
        go('account');
      };
      const exitAccount = () => {
        // Silent discard per project spec — no confirm prompt (matches brand voice).
        setAccountDraft(null);
        go('settings');
      };
      const commitAccountDraft = (overridePatch) => {
        // Bug 5 will pass an overridePatch with birthdaySet=true after the
        // confirm modal lands. For Bug 4 alone, pass nothing and we commit
        // the draft as-is. Either way, originalUsername is stripped — it's
        // a UI-only field, not part of data.user.
        const finalPatch = overridePatch || accountDraft;
        if (finalPatch) {
          const { originalUsername: _strip, ...userPatch } = finalPatch;
          updateData({ user: { ...(data.user || {}), ...userPatch } });
        }
        setAccountDraft(null);
        go('settings');
      };
      const updateAccountDraft = (patch) => {
        // Functional setter — safe across rapid keystrokes / batched updates.
        setAccountDraft(prev => prev ? { ...prev, ...patch } : prev);
      };

      // V15/J1: pure resolver — picks the right screen given current auth + data.
      // Uses fine-grained resume so users don't lose mid-onboarding progress.
      // Anonymous + no topValues → 'welcome'. The Welcome screen's "Continue
      // without account" CTA (B1, not yet wired) should route to 'resonance'
      // to preserve the V14 funnel. Don't change this without revisiting B1.
      function resolveInitialScreen({ user, data: d }) {
        const hasTopValues  = !!(d && d.topValues  && d.topValues.length);
        const hasFiveValues = !!(d && d.fiveValues && d.fiveValues.length);
        if (user) {
          if (hasTopValues)  return 'home';
          if (hasFiveValues) return 'top3';   // resume: picked 5 but not 3 (skip Promise — already past it)
          return 'promise';                   // V15/Bug7: soft entry — read context cards before values picker
        }
        return hasTopValues ? 'home' : 'welcome';
      }

      // ── V15 BOOTSTRAP ──────────────────────────────────────────────
      // Race window.groundedReady against the boot timeout. If firebase.js
      // resolves: subscribe to live data. If it doesn't (404, error, or
      // simply not configured yet): fall back to V14 localStorage. App
      // never gets stuck on a white screen.
      useEffect(() => {
        let cancelled = false;
        let unsubData = null;

        const waitForFirebase = (timeoutMs) => new Promise((resolve) => {
          const timer = setTimeout(() => resolve(null), timeoutMs);
          const tick = () => {
            if (window.__groundedFirebaseFailed) { clearTimeout(timer); resolve(null); return; }
            if (window.groundedReady) {
              clearTimeout(timer);
              window.groundedReady.then((api) => resolve(api)).catch(() => resolve(null));
              return;
            }
            setTimeout(tick, 50);
          };
          tick();
        });

        (async () => {
          const api = await waitForFirebase(window.__GROUNDED_BOOT_TIMEOUT_MS || 2500);
          if (cancelled) return;
          if (api && api.groundedSync) {
            setGroundedApi(api);
            unsubData = api.groundedSync.subscribe((d) => {
              if (cancelled) return;
              isHydratingRef.current = true;          // server-sourced — don't echo back
              setData(d || {});
            });
          } else {
            // Graceful fallback — V14 behavior (localStorage-only)
            isHydratingRef.current = true;
            setData(loadData());
          }
          setBootState('ready');
        })();

        return () => {
          cancelled = true;
          if (unsubData) unsubData();
        };
      }, []);

      // ── SAVE — routes through groundedSync if available, else V14 localStorage ──
      useEffect(() => {
        if (bootState !== 'ready') return;
        if (isHydratingRef.current) {
          isHydratingRef.current = false;            // skip echoing the hydration tick
          return;
        }
        if (groundedApi && groundedApi.groundedSync) {
          groundedApi.groundedSync.save(data);
        } else {
          saveData(data);
        }
      }, [data, bootState, groundedApi]);

      // ── AUTH LISTENER (A3 + J1) ────────────────────────────────────
      // Detects sign-in / sign-out events and routes accordingly via the
      // resolveInitialScreen helper. Data hydration is handled by
      // groundedSync.subscribe() in the bootstrap effect; migration
      // auto-runs inside firebase.js on sign-in. Listener stays small.
      // Also flips authResolved → unblocks the splash render guard
      // (with a 400ms backstop in case onAuthChange never fires).
      useEffect(() => {
        if (bootState !== 'ready' || !groundedApi || !groundedApi.groundedAuth) return;

        let isInitialFire = true;
        // J1 backstop: if onAuthChange never fires (silent firebase.js failure
        // not caught by __groundedFirebaseFailed), don't trap user behind splash.
        const splashBackstop = setTimeout(() => setAuthResolved(true), 400);

        const unsubscribe = groundedApi.groundedAuth.onAuthChange((user) => {
          const wasInitial = isInitialFire;
          isInitialFire = false;

          // J1: read live data from firebase.js. For signed-in users, this is
          // STALE on the first fire (currentDocData reflects pre-signin state
          // because firebase.js doesn't refresh it between notifyAuth and the
          // first onSnapshot push). Bug 6 fix: defer routing for signed-in
          // users until the hydration effect below sees fresh data.
          const liveData = (groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
            ? groundedApi.groundedSync.getDataNow()
            : data;
          const next = resolveInitialScreen({ user, data: liveData });

          // V15/C5: detect migration moment using the same stale-currentDocData
          // window. If pre-migration data has any keys (matches firebase.js
          // line 241 hasLocal threshold), migration just happened: show overlay.
          // Backend ticket for v1.0.x: expose `lastMigrationResult` for cleaner
          // signaling instead of inferring from data shape.
          const justSignedIn = !!user && !wasInitial;
          const hadAnonData  = liveData && Object.keys(liveData).length > 0;
          if (justSignedIn && hadAnonData) {
            setMigrating(true);
            setTimeout(() => setMigrating(false), 1000);
          }

          if (user) {
            // V15/Bug6: defer routing until Firestore data hydrates. The
            // hydration effect below catches the first onSnapshot push and
            // runs the resolver with fresh data. authResolved also flips
            // there — keeping the splash visible avoids a 'welcome' flash.
            setAwaitingHydration(true);
            // Do NOT setScreen or setAuthResolved here for the user case.
            // V27/Phase2: clear nav history on sign-in transitions (not initial
            // fires) — pre-signin breadcrumbs are no longer meaningful.
            if (!wasInitial) setScreenHistory([]);
          } else if (!wasInitial) {
            // True sign-out (user-initiated via Settings, or involuntary like
            // token expiry / server revoke). Route immediately — resolver
            // returns 'welcome' since no user + localStorage cleared by
            // earlier migration. Defensive clear of awaitingHydration in case
            // sign-out fires while a prior sign-in was still hydrating.
            setAwaitingHydration(false);
            setAuthResolved(true);
            setScreen(next);
            // V27/Phase2: clear nav history on sign-out — fresh start at welcome.
            setScreenHistory([]);
          } else {
            // Initial fire with no user = anonymous mode. Route immediately:
            //   - no topValues → 'welcome' (matches default useState, no-op)
            //   - has topValues in localStorage → 'home' (returning anon user)
            setAwaitingHydration(false);
            setAuthResolved(true);
            setScreen(next);
          }
        });

        return () => {
          clearTimeout(splashBackstop);
          if (typeof unsubscribe === 'function') unsubscribe();
        };
      }, [bootState, groundedApi]);

      // V15/Bug6: hydration watcher — runs the resolver once Firestore data
      // arrives after a sign-in event. Only signed-in users set awaitingHydration
      // so this effect is a no-op during normal app use or in anonymous mode.
      // Even fresh signups satisfy hasContent (firebase.js writes a 5-key
      // system doc on Case C), so this resolves cleanly for all sign-in paths.
      useEffect(() => {
        if (!awaitingHydration) return;
        const liveData = (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
          ? groundedApi.groundedSync.getDataNow()
          : data;
        const hasContent = liveData && Object.keys(liveData).length > 0;
        if (!hasContent) return;  // wait for next data push

        const user = groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser;
        let next = resolveInitialScreen({ user, data: liveData });

        // V29: MirrorReady resurrection. Flag set by TrialWelcomeScreen
        // (Continue/SignIn/RedeemSuccess[anon]) when user opted into the
        // celebration. Consumed here once auth + hydration complete.
        // user-required guard: only override after successful sign-in/up.
        try {
          if (user && localStorage.getItem('grounded_from_trial_welcome') === '1') {
            localStorage.removeItem('grounded_from_trial_welcome');
            next = 'mirror_ready';
          }
        } catch (e) {}

        setScreen(next);
        setAwaitingHydration(false);
        setAuthResolved(true);
      }, [data, awaitingHydration]);

      // V15/Bug6: hydration backstop — don't trap user behind splash forever.
      // Fires if data never hydrates (Firestore rules denial, network failure,
      // misconfigured firebase.js). Resolves with whatever data we have.
      useEffect(() => {
        if (!awaitingHydration) return;
        const t = setTimeout(() => {
          const liveData = (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.getDataNow)
            ? groundedApi.groundedSync.getDataNow()
            : data;
          const user = groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser;
          let next = resolveInitialScreen({ user, data: liveData });

          // V29: MirrorReady resurrection — same gate as hydration watcher,
          // applies on the timeout fallback path so auth-then-network-failure
          // users still get the celebration.
          try {
            if (user && localStorage.getItem('grounded_from_trial_welcome') === '1') {
              localStorage.removeItem('grounded_from_trial_welcome');
              next = 'mirror_ready';
            }
          } catch (e) {}

          setScreen(next);
          setAwaitingHydration(false);
          setAuthResolved(true);
        }, 1500);
        return () => clearTimeout(t);
      }, [awaitingHydration]);

      // V25/Phase2: subscription state listener.
      // groundedSync.subscribeSubscription fires immediately with current
      // state (or null if no subscription doc), then on every Firestore
      // snapshot or local change. Defensive: pre-V24 Backend (no helper) →
      // no-op, app behaves as pre-Phase-2 (no paywall, no banner).
      useEffect(() => {
        if (bootState !== 'ready' || !groundedApi || !groundedApi.groundedSync) return;
        if (typeof groundedApi.groundedSync.subscribeSubscription !== 'function') return;

        let unsub = null;
        try {
          unsub = groundedApi.groundedSync.subscribeSubscription((s) => {
            setSubState(s);
          });
        } catch (e) {
          console.warn('[V25] subscribeSubscription threw:', e);
        }
        return () => { if (typeof unsub === 'function') unsub(); };
      }, [bootState, groundedApi]);

      // Daily Reflection — pick fresh question on:
      //   1) first load (no dailyQuestion yet)
      //   2) day rollover (new day)
      //   3) core values changed → current question's valueKey no longer in topValues
      useEffect(() => {
        const today = todayKey();
        const dq = data.dailyQuestion;
        const tv = (data.topValues && data.topValues.length) ? data.topValues : null;
        if (!tv) return; // nothing to pick from yet — wait until user has core values
        const needsRefresh =
          !dq ||
          dq.dayKey !== today ||
          !tv.includes(dq.valueKey);
        if (needsRefresh) {
          const next = pickDailyReflection(tv);
          if (next) setData(prev => ({ ...prev, dailyQuestion: next }));
        }
      }, [data.dailyQuestion, data.topValues]);

      // V49/M2: post-checkout / post-portal return handler. Fires once at
      // boot — reads ?checkout=success | ?checkout=cancel | ?portal=return
      // URL params, clears them via history.replaceState (so refresh doesn't
      // re-fire), and surfaces a toast notice. For success: backend M3 webhook
      // has updated subscription state in Firestore; subscribeSubscription is
      // already wired (V25) so subState refreshes automatically. For portal
      // return: route home so user lands somewhere meaningful.
      useEffect(() => {
        if (bootState !== 'ready' || !authResolved) return;
        if (returnUrlRanRef.current) return;
        if (typeof window === 'undefined' || !window.location) return;

        const params = new URLSearchParams(window.location.search);
        const checkoutParam = params.get('checkout');
        const portalParam   = params.get('portal');
        if (!checkoutParam && !portalParam) return;  // nothing to handle

        returnUrlRanRef.current = true;

        if (checkoutParam === 'success') {
          // Backend webhook will have set subscription state; subscribeSubscription
          // listener picks it up on next Firestore push. Surface celebration
          // toast; subState-driven UI updates the rest of the app organically.
          setReturnNotice('Welcome — your subscription is active.');
          setTimeout(() => setReturnNotice(null), 4000);
        } else if (checkoutParam === 'cancel') {
          setReturnNotice('Checkout canceled. You can subscribe anytime.');
          setTimeout(() => setReturnNotice(null), 4000);
        } else if (portalParam === 'return') {
          // User came back from Stripe Customer Portal — may have updated card,
          // canceled, or just clicked Return. Route home so they land somewhere
          // meaningful (subscribeSubscription handles the data refresh).
          setReturnNotice(null);
          try { setScreen('home'); } catch (e) { /* defensive */ }
        }

        // Clear URL params (cosmetic + prevents re-fire on hard reload).
        try {
          window.history.replaceState({}, '', window.location.pathname);
        } catch (e) { /* defensive — older browsers */ }
      }, [bootState, authResolved]);

      // V43: auto-submit past-day drafts on app open. Runs once after boot
      // resolves + data hydrates. Sweeps three draft buckets:
      //   • data.completed[dayKey][exerciseId] = { items, submitted, ... }
      //   • data.reflections[dayKey]           = { q, a, valueKey, submitted, ... }
      //   • data.freeWrites[dayKey]            = { text, submitted, ... }
      // For any entry where dayKey < today AND submitted === false, mark
      // submitted: true and tag autoSubmitted: true (analytics metadata).
      // Legacy V15 shapes (Array<string> entries, plain-string freeWrites) are
      // skipped — they were always implicitly-submitted in the V15 model.
      // Run-once guard via ref prevents the effect from re-firing on each
      // subsequent data change.
      useEffect(() => {
        if (bootState !== 'ready' || !authResolved) return;
        if (autoSubmitRanRef.current) return;
        if (!data || Object.keys(data).length === 0) return; // wait for hydration

        const todayK = todayKey();
        const patch = {};
        let dirty = false;

        // ── Exercise entries ──
        if (data.completed && typeof data.completed === 'object') {
          const completedCopy = { ...data.completed };
          let exDirty = false;
          Object.keys(completedCopy).forEach((dayKey) => {
            if (dayKey >= todayK) return; // skip today + future days
            const dayMap = completedCopy[dayKey];
            if (!dayMap || typeof dayMap !== 'object') return;
            const dayCopy = { ...dayMap };
            let dayDirty = false;
            Object.keys(dayCopy).forEach((exId) => {
              const entry = dayCopy[exId];
              if (Array.isArray(entry)) return; // V15 legacy = implicitly submitted
              if (entry && entry.submitted === false) {
                dayCopy[exId] = { ...entry, submitted: true, autoSubmitted: true };
                dayDirty = true;
              }
            });
            if (dayDirty) {
              completedCopy[dayKey] = dayCopy;
              exDirty = true;
            }
          });
          if (exDirty) { patch.completed = completedCopy; dirty = true; }
        }

        // ── Reflections ──
        if (data.reflections && typeof data.reflections === 'object') {
          const reflCopy = { ...data.reflections };
          let reflDirty = false;
          Object.keys(reflCopy).forEach((dayKey) => {
            if (dayKey >= todayK) return;
            const r = reflCopy[dayKey];
            if (r && typeof r === 'object' && r.submitted === false) {
              reflCopy[dayKey] = { ...r, submitted: true, autoSubmitted: true };
              reflDirty = true;
            }
          });
          if (reflDirty) { patch.reflections = reflCopy; dirty = true; }
        }

        // ── Free writes ──
        if (data.freeWrites && typeof data.freeWrites === 'object') {
          const fwCopy = { ...data.freeWrites };
          let fwDirty = false;
          Object.keys(fwCopy).forEach((dayKey) => {
            if (dayKey >= todayK) return;
            const w = fwCopy[dayKey];
            // V15 legacy = string (implicitly submitted); V16+ = object
            if (w && typeof w === 'object' && w.submitted === false) {
              fwCopy[dayKey] = { ...w, submitted: true, autoSubmitted: true };
              fwDirty = true;
            }
          });
          if (fwDirty) { patch.freeWrites = fwCopy; dirty = true; }
        }

        autoSubmitRanRef.current = true;
        if (dirty) setData(prev => ({ ...prev, ...patch }));
      }, [bootState, authResolved, data]);

      const updateData = (patch) => setData(prev => ({ ...prev, ...patch }));

      // V27/Phase2: navigation history stack + history-aware back.
      // ARCHITECTURE:
      //   • go(next)            → user-initiated forward nav. Pushes current
      //                           screen onto history, then sets next.
      //   • goBack()            → user-initiated back. Pops history; falls back
      //                           to home (signed-in) or welcome (anon) on empty.
      //   • setScreen(...)      → programmatic redirect (auth listener, hydration,
      //                           route guard). Does NOT push history — by design.
      //   • clearHistory()      → call on auth transitions (sign-in success,
      //                           sign-out) to reset stack for the new context.
      // Special-case back handlers (Promise's Bug 7 sign-out, WellBeHere's
      // "Back to start" restart, practice_welcome's "mark seen") preserve
      // their semantic intent and don't use goBack.
      const [screenHistory, setScreenHistory] = useState([]);
      const go = (next) => {
        setScreenHistory(prev => [...prev, screen]);
        setScreen(next);
      };
      const goBack = () => {
        setScreenHistory(prev => {
          if (prev.length === 0) {
            // Empty-history fallback: signed-in → home, anonymous → welcome.
            const isSignedIn = !!(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
            setScreen(isSignedIn ? 'home' : 'welcome');
            return prev;
          }
          const popped = prev[prev.length - 1];
          setScreen(popped);
          return prev.slice(0, -1);
        });
      };
      const clearHistory = () => setScreenHistory([]);

      const navTo = (key) => {
        if (key === 'home')     return go('home');
        if (key === 'practice') {
          if (!data.practiceWelcomeSeen) return go('practice_welcome');
          return go('my_practice');
        }
        if (key === 'mirror')   return go('my_mirror');
        if (key === 'settings') return go('settings');
      };

      const myExercises = data.myExercises || [];

      const toggleStoreExercise = (id) => {
        const cur = data.myExercises ? [...data.myExercises] : [];
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        else cur.push(id);
        updateData({ myExercises: cur });
      };

      const removeFromPractice = (id) => {
        const cur = [...myExercises];
        const idx = cur.indexOf(id);
        if (idx >= 0) cur.splice(idx, 1);
        updateData({ myExercises: cur });
      };

      // V16/Bug10: save handlers now accept `submitted` flag.
      //   submitted=false → draft (resumable, editable on next visit)
      //   submitted=true  → committed (locked, read-only on next visit)
      // Schema: completed entries become { items, submitted } (was Array<string>)
      // and freeWrites entries become { text, submitted } (was string).
      // Calendar views handle both old + new shapes for backward compat.
      // V20/Bug15: empty-save deletes route through groundedSync helpers when
      // available — Backend handles Firestore deleteField + race-safe flush
      // (was local-only in V19, leaving stale Firestore docs for signed-in users).
      // Local-only fallback preserved for the V14 emergency mode (no firebase.js).
      // Fire-and-forget — Backend does optimistic update + notifyData() so the
      // subscribe channel re-renders without us awaiting.
      const saveExerciseEntry = (id, items, submitted) => {
        const today = todayKey();
        const filtered = (items || []).filter(i => i && i.trim());
        if (filtered.length > 0) {
          const completed = { ...(data.completed || {}) };
          completed[today] = { ...(completed[today] || {}), [id]: { items: filtered, submitted: !!submitted } };
          updateData({ completed });
        } else {
          // Empty save → delete this exercise's entry.
          if (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.deleteExerciseEntry) {
            groundedApi.groundedSync.deleteExerciseEntry(today, id);
            // V20/Bug15: day-level cleanup skipped per Backend spec — calendar
            // logic handles empty day maps via Object.values(...).some(isSubmitted).
          } else {
            // Fallback: local-only delete + day-level cleanup (V19 behavior).
            const completed = { ...(data.completed || {}) };
            const dayEntries = { ...(completed[today] || {}) };
            delete dayEntries[id];
            if (Object.keys(dayEntries).length > 0) {
              completed[today] = dayEntries;
            } else {
              delete completed[today];
            }
            updateData({ completed });
          }
        }
      };

      const saveReflection = (q, a, valueKey, submitted) => {
        const today = todayKey();
        if (a && a.trim()) {
          const reflections = { ...(data.reflections || {}) };
          reflections[today] = { q, a, valueKey, submitted: !!submitted };
          updateData({ reflections });
        } else {
          // Empty save → delete reflection. V20/Bug15: route through helper.
          if (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.deleteReflection) {
            groundedApi.groundedSync.deleteReflection(today);
          } else {
            const reflections = { ...(data.reflections || {}) };
            delete reflections[today];
            updateData({ reflections });
          }
        }
      };

      const saveFreeWrite = (text, submitted) => {
        const today = todayKey();
        if (text && text.trim()) {
          const freeWrites = { ...(data.freeWrites || {}) };
          freeWrites[today] = { text, submitted: !!submitted };
          updateData({ freeWrites });
        } else {
          // Empty save → delete free write. V20/Bug15: route through helper.
          if (groundedApi && groundedApi.groundedSync && groundedApi.groundedSync.deleteFreeWrite) {
            groundedApi.groundedSync.deleteFreeWrite(today);
          } else {
            const freeWrites = { ...(data.freeWrites || {}) };
            delete freeWrites[today];
            updateData({ freeWrites });
          }
        }
      };

      // Mirror history — merge fields into today's entry, only changed fields
      const saveMirrorChanges = (patch) => {
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        const todayEntry = { ...(mirrorHistory[today] || {}) };
        const fieldPatch = {};
        Object.keys(patch).forEach(k => {
          const oldVal = data[k];
          const newVal = patch[k];
          if (Array.isArray(newVal)) {
            const same = Array.isArray(oldVal) && oldVal.length === newVal.length && oldVal.every((v, i) => v === newVal[i]);
            if (!same) fieldPatch[k] = newVal;
          } else if (newVal !== oldVal) {
            fieldPatch[k] = newVal;
          }
        });
        if (Object.keys(fieldPatch).length > 0) {
          mirrorHistory[today] = { ...todayEntry, ...fieldPatch };
        }
        updateData({ ...patch, mirrorHistory });
      };

      const ensureMirrorBaseline = () => {
        if (data.mirrorBaselineDate) return;
        const today = todayKey();
        const mirrorHistory = { ...(data.mirrorHistory || {}) };
        mirrorHistory[today] = {
          isBaseline: true,
          fiveValues: data.fiveValues || [],
          topValues: data.topValues || [],
          comfortable: data.comfortable || '',
          uncomfortable: data.uncomfortable || '',
          alignedSelf: data.alignedSelf || '',
          whatHelps: data.whatHelps || '',
          quote: data.quote || '',
        };
        updateData({ mirrorHistory, mirrorBaselineDate: today });
      };

      // Launchpad — ensure week initialized + matches current week
      const ensureLaunchpadWeek = () => {
        const tv = data.topValues;
        if (!tv || !tv.length) return; // no core values → don't init
        const wk = weekKey();
        const cur = data.launchpadWeek;
        if (!cur || cur.weekKey !== wk) {
          const next = initLaunchpadWeek(tv);
          if (next) updateData({ launchpadWeek: next });
        }
      };

      const tickLaunchpad = (id, slotIdx) => {
        const wk = data.launchpadWeek;
        if (!wk) return;
        const idx = (typeof slotIdx === 'number' && wk.shown[slotIdx] && wk.shown[slotIdx].id === id)
          ? slotIdx
          : wk.shown.findIndex(s => s.id === id);
        if (idx < 0) return;
        const card = wk.shown[idx];
        if (card.ticked) return; // already ticked, ignore

        const today = todayKey();
        const launchpadHistory = { ...(data.launchpadHistory || {}) };
        const todayList = [...(launchpadHistory[today] || [])];
        todayList.push({ id: card.id, valueKey: card.valueKey, emoji: card.emoji, body: card.body, tickedAt: Date.now() });
        launchpadHistory[today] = todayList;

        const newUsed = [...wk.used, card.id];
        let remaining = wk.remainingReloads;
        const newShown = wk.shown.slice();

        if (remaining > 0) {
          // replace this slot with a fresh card from the pool
          const tv = (data.topValues && data.topValues.length) ? data.topValues : ['Freedom','Creativity','Growth'];
          const seenIds = new Set([...newUsed, ...newShown.map(s => s.id)]);
          const pool = allMissionsForValues(tv).filter(m => !seenIds.has(m.id));
          if (pool.length) {
            const pickIdx = Math.floor(Math.random() * pool.length);
            newShown[idx] = { ...pool[pickIdx], ticked: false };
            remaining -= 1;
          } else {
            // pool empty — keep card in place but mark ticked
            newShown[idx] = { ...card, ticked: true };
          }
        } else {
          // reloads exhausted — keep card visible, mark as ticked (faded UI)
          newShown[idx] = { ...card, ticked: true };
        }

        updateData({
          launchpadHistory,
          launchpadWeek: { ...wk, shown: newShown, used: newUsed, remainingReloads: remaining },
        });
      };

      // Ground Me — record visit when sub-screen finalized (Take a moment / Need to talk / I remember now)
      const recordGroundMe = (triage, sub) => {
        const today = todayKey();
        const groundMeHistory = { ...(data.groundMeHistory || {}) };
        const list = [...(groundMeHistory[today] || [])];
        list.push({ triage, sub, time: Date.now() });
        groundMeHistory[today] = list;
        updateData({ groundMeHistory });
      };

      const triageOf = (target) => {
        if (target === 'gm_reminder') return 'reminder';
        if (target === 'gm_struggling') return 'struggling';
        if (target === 'gm_hard') return 'hard';
        return null;
      };
      const [pendingTriage, setPendingTriage] = useState(null);

      // V15/Bug6 + C5: rendering precedence
      //   1. migrating  → MigrationOverlay  (C5: anon→signed-in transition takes priority)
      //   2. booting OR awaiting hydration → BootSplash
      //   3. otherwise  → routed view (below)
      // The migration early-return is a small UX win over C5's original layered
      // approach: destination screen never renders behind the overlay, so there's
      // no flicker when overlay fades.
      if (migrating) return <MigrationOverlay />;
      // V15: boot splash gates render until firebase.js resolves (or 2.5s timeout fires).
      // V15/J1: hold splash until the auth listener has reported in (400ms backstop).
      // V15/Bug6: also hold splash through awaitingHydration so signed-in returning
      // users (and mid-app sign-ins) don't briefly flash 'welcome' before routing.
      if (bootState === 'booting' || (groundedApi && !authResolved) || awaitingHydration) return <BootSplash />;

      // V25/Phase2 + V38: subscription gate via derived effectiveScreen.
      // Fires only when: signed-in user AND subscription state is known AND
      // canAccessApp() returns false. Anonymous users (no subState) flow
      // through normally — they'll hit Trial Welcome at Mirror completion.
      //
      // V38 status-aware redirect:
      //   status='trial' (Day 7 trial expired) → tier_pick with forcedChoice=true
      //   status='lapsed'/'canceled'/'expired' → subscription (LAPSED mode)
      //   anything else (defensive) → tier_pick with forcedChoice=true
      //
      // Always allow user to be ON tier_pick or subscription routes (don't
      // double-redirect into self). All other screens get blocked.
      const _hasUser  = !!(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
      const _sync     = groundedApi && groundedApi.groundedSync;
      const _hasGate  = !!(_sync && typeof _sync.canAccessApp === 'function');
      const _blocked  = _hasUser && subState && _hasGate && _sync.canAccessApp() === false;
      const _onAllowedRoute = (screen === 'tier_pick' || screen === 'subscription');
      const _gateBlocked = _blocked && !_onAllowedRoute;

      const _subStatus = subState && subState.status;
      const _isTrialExpired = _subStatus === 'trial';  // status='trial' + canAccessApp=false ⇒ expired
      const _gateRedirect = (() => {
        if (!_gateBlocked) return null;
        if (_isTrialExpired) return { to: 'tier_pick', forcedChoice: true };
        return { to: 'subscription', forcedChoice: false };
      })();
      const effectiveScreen = _gateRedirect ? _gateRedirect.to : screen;
      const _forcedTierPick = !!(_gateRedirect && _gateRedirect.forcedChoice);

      let view = null;
      switch (effectiveScreen) {
        case 'welcome':
          view = <WelcomeScreen
            hasGoogleAuth={!!groundedApi}
            onGoogle={async () => {
              if (!groundedApi || !groundedApi.groundedAuth) return { ok: false, code: 'no-auth' };
              return groundedApi.groundedAuth.signInWithGoogle();
            }}
            onSignUpEmail={() => go('signup')}
            onSignIn={() => go('signin')}
            onContinueAnon={() => go('resonance')}
          />; break;
        case 'resonance':
          // PATTERN A (single-entry) — if multi-entry added later (e.g.,
          // "Re-take values" from Settings), flip this to goBack pattern.
          view = <ResonanceCheck
            onBack={() => go('welcome')}
            onComplete={(r) => go(r === 'in_right_place' ? 'in_right_place' : 'grounded_already')}
          />; break;
        case 'in_right_place':
          view = <InRightPlace onContinue={() => go('promise')} />; break;
        case 'grounded_already':
          view = <GroundedAlready onCheckOut={() => go('promise')} onLater={() => go('well_be_here')} />; break;
        case 'well_be_here':
          view = <WellBeHere onBack={() => go('welcome')} />; break;
        case 'promise':
          // V15/Bug7: context-aware Promise routing.
          //   onContinue: always to values picker. The V14 signup detour is gone —
          //     anonymous users do mirror onboarding without signing up (sign up
          //     via Welcome's CTAs or future C4 nudge).
          //   onBack: signed-in + no topValues = post-signup entry, exit + signOut.
          //     Anonymous flow → normal back to in_right_place (existing).
          view = <PromiseScreen
            onContinue={() => go('values')}
            onBack={() => {
              const isSignedIn   = !!(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
              const hasTopValues = !!(data.topValues && data.topValues.length);
              if (isSignedIn && !hasTopValues) {
                if (groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.signOut) {
                  // Fire-and-forget — A3 listener catches the sign-out event
                  // and resolver routes to welcome. No await needed.
                  groundedApi.groundedAuth.signOut();
                } else {
                  // Defensive fallback (firebase.js missing / fallback mode).
                  setData({}); go('welcome');
                }
              } else {
                go('in_right_place');  // anonymous flow back, existing behavior
              }
            }}
          />; break;
        case 'signup':
          // PATTERN B (multi-entry — Welcome AND SignInScreen "Sign up?" toggle).
          // goBack respects which path user came from; hardcoded would lose the
          // SignIn↔SignUp toggle context.
          view = <SignUpScreen
            groundedAuth={groundedApi && groundedApi.groundedAuth}
            onSubmitted={() => { /* A3+J1 listener handles routing on success */ }}
            onSignIn={() => go('signin')}
            onSignInInstead={(email) => { setSignInPrefill(email); go('signin'); }}
            onBack={goBack}
          />; break;
        case 'signin':
          // PATTERN B (multi-entry — Welcome AND SignUpScreen "Sign in instead?"
          // on email-already-in-use). Symmetric to SignUp above.
          view = <SignInScreen
            groundedAuth={groundedApi && groundedApi.groundedAuth}
            prefillEmail={signInPrefill}
            onSubmitted={() => { setSignInPrefill(''); /* A3+J1 listener handles routing */ }}
            onSignUp={() => go('signup')}
            onBack={goBack}
          />; break;
        case 'values':
          view = <ValuesStep
            initial={data.fiveValues || []}
            onContinue={(v) => { updateData({ fiveValues: v }); go('top3'); }}
            onSkip={() => go('no_worries')}
            onBack={() => go('promise')}
          />; break;
        case 'no_worries':
          view = <ReassureScreen heading="No worries !"
            lines={[
              'Knowing your values takes time. You can continue for now.',
              'Later, we\'ll have a short quiz to help you discover what truly matters to you.',
            ]}
            onContinue={() => go('comfort')} />; break;
        case 'top3':
          view = <TopThreeStep
            pool={data.fiveValues || []}
            onContinue={(t) => { updateData({ topValues: t }); go('comfort'); }}
            onBack={() => go('values')}
          />; break;
        case 'comfort':
          view = <ComfortStep
            initial={{ comfortable: data.comfortable, uncomfortable: data.uncomfortable }}
            onContinue={(o) => { updateData(o); go('aligned_self'); }}
            onSkip={() => go('thats_okay')}
            onBack={() => go('top3')}
          />; break;
        case 'thats_okay':
          view = <ReassureScreen heading="That's okay !"
            lines={[
              'Sometimes it\'s hard to know what gives or drains your energy.',
              'You can come back anytime and update this in your profile.',
            ]}
            onContinue={() => go('aligned_self')} />; break;
        case 'aligned_self':
          view = <AlignedSelfStep
            initial={data.alignedSelf || ''}
            onContinue={(t) => {
              updateData({ alignedSelf: t });
              // V25/Phase2: anonymous reaching aligned_self save = new user by
              // definition (returning users skip onboarding straight to home).
              // Trial Welcome IS their celebration — they skip V20 mirror_ready.
              // Signed-in users skip Trial Welcome (trial auto-started on signup).
              // V43/Phase2: PHASE_2_TRIAL_UI_ENABLED gate — when OFF, anon
              // users skip Trial Welcome and route directly to mirror_ready.
              const isAnon = !(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
              go(isAnon && PHASE_2_TRIAL_UI_ENABLED ? 'trial_welcome' : 'mirror_ready');
            }}
            onSkip={() => go('no_pressure')}
            onBack={() => go('comfort')}
          />; break;
        case 'no_pressure':
          view = <ReassureScreen heading="No pressure !"
            lines={[
              'Describing your aligned self isn\'t easy — it can take reflection.',
              'Your mirror will still be here. You can add this whenever you\'re ready.',
            ]}
            button="Continue"
            onContinue={() => {
              // V25/Phase2: same Mirror-completion gate as aligned_self save.
              // V43/Phase2: gated behind PHASE_2_TRIAL_UI_ENABLED.
              const isAnon = !(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
              go(isAnon && PHASE_2_TRIAL_UI_ENABLED ? 'trial_welcome' : 'mirror_ready');
            }} />; break;
        case 'mirror_ready':
          view = <MirrorReady data={data} onContinue={() => { ensureMirrorBaseline(); go('home'); }} />; break;
        case 'home':
          view = <HomeScreen
            data={data}
            onReflect={() => go('reflection')}
            onLaunchpad={() => { ensureLaunchpadWeek(); go('launchpad'); }}
            onFreeWrite={() => go('freewrite')}
            onGroundMe={() => go('gm_triage')}
            onNav={navTo}
            /* V25/Phase2: trial banner — Day 5-6 conditional render via groundedSync.getTrialDaysLeft */
            trialDaysLeft={
              groundedApi && groundedApi.groundedSync && typeof groundedApi.groundedSync.getTrialDaysLeft === 'function'
                ? groundedApi.groundedSync.getTrialDaysLeft()
                : 0
            }
            onTrialBannerTap={() => go('tier_pick')}
          />; break;
        /* V25/Phase2 — new routes */
        case 'trial_welcome':
          view = <TrialWelcomeScreen
            onContinue={() => {
              // V29: Anon → signup, set TW flag so post-auth gate routes through
              // MirrorReady celebration (consumed in hydration watcher/backstop).
              // Already signed-in edge case (rare — late prompt) → home, trial
              // running, no flag needed since no auth roundtrip.
              const isAnon = !(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
              if (isAnon) {
                try { localStorage.setItem('grounded_from_trial_welcome', '1'); } catch (e) {}
                go('signup');
              } else {
                go('home');
              }
            }}
            onHaveCode={() => setShowRedeemModal(true)}
            onLater={() => {
              // V30/Phase2: Maybe later → Take-your-time warning screen
              // (softer off-ramp than direct home dump). Take-your-time
              // offers Begin → back to TW or Maybe later → WellBeHere.
              // No TW flag set — user has opted out of MirrorReady path.
              go('take_your_time');
            }}
            onSignIn={() => {
              // V29: TW flag → post-auth gate routes through MirrorReady.
              try { localStorage.setItem('grounded_from_trial_welcome', '1'); } catch (e) {}
              go('signin');
            }}
          />; break;
        case 'take_your_time':
          // V30/Phase2: Maybe-later warning gate between TW and WellBeHere.
          //   onBegin → back to Trial Welcome (user changed mind, can pick any path)
          //   onLater → WellBeHere (final off-ramp, "Back to start" → Welcome)
          view = <TakeYourTime
            onBegin={() => go('trial_welcome')}
            onLater={() => go('well_be_here')}
          />; break;
        case 'tier_pick':
          {
            // V28→V49/Phase2: read founder state + pricing from Backend helpers,
            // fall back gracefully if Backend M2 not yet shipped.
            //
            // V49: getFounderCount shape migrated from V28 ({count, capacity, founderAvailable})
            // to M2-aligned ({count, max, remaining}). Read both for backward-compat —
            // prefer remaining/max when present, derive from capacity-count when older.
            const _sync = groundedApi && groundedApi.groundedSync;
            let _rawFounder = null;
            if (_sync && typeof _sync.getFounderCount === 'function') {
              try { _rawFounder = _sync.getFounderCount(); }
              catch (e) { console.warn('[V49] getFounderCount threw:', e); }
            }
            const _founderCount = (_rawFounder && typeof _rawFounder.count === 'number') ? _rawFounder.count : 0;
            const _founderMax   = (_rawFounder && typeof _rawFounder.max === 'number')
              ? _rawFounder.max
              : ((_rawFounder && typeof _rawFounder.capacity === 'number') ? _rawFounder.capacity : 200);
            const _founderRemaining = (_rawFounder && typeof _rawFounder.remaining === 'number')
              ? _rawFounder.remaining
              : Math.max(0, _founderMax - _founderCount);

            let _pricing = { premium: 99, pro: 199 };
            if (_sync && typeof _sync.getTierPricing === 'function') {
              try { _pricing = _sync.getTierPricing() || _pricing; }
              catch (e) { console.warn('[V49] getTierPricing threw:', e); }
            }

            // V49: onChoose now async — calls startCheckout({successUrl, cancelUrl}),
            // awaits Promise resolving to { ok, url, sessionId, pricing }, then
            // window.location.href = url. Backend does NOT redirect; FE controls
            // navigation. Errors surfaced as inline notice via existing handleClick
            // mechanism in TierPickScreen.
            //
            // Pre-M2 fallback (helper absent or sync.startCheckout missing):
            // returns "ships next update" notice so screen renders gracefully.
            const _onChoose = async (tier) => {
              if (!_sync || typeof _sync.startCheckout !== 'function') {
                return 'Stripe Checkout ships next update';
              }
              try {
                // V49 hotfix: preserve /grounded/ subdir via baseUrl derivation
                // (same regex as Customer Portal returnUrl above — strips trailing
                // file segment, keeps directory). Both URLs share baseUrl.
                const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
                const successUrl = baseUrl + '?checkout=success';
                const cancelUrl  = baseUrl + '?checkout=cancel';
                const result = await _sync.startCheckout(tier, { successUrl, cancelUrl });
                if (result && result.url) {
                  window.location.href = result.url;
                  return null;  // navigation handled
                }
                // Defensive: no URL returned
                console.warn('[V49] startCheckout returned no url:', result);
                return 'Could not start checkout — please try again.';
              } catch (e) {
                console.warn('[V49] startCheckout threw:', e);
                // Per dispatch spec — 401 is rare (auth flow handles), other
                // errors surface generic message + console-log details.
                return 'Could not start checkout — please try again or contact us.';
              }
            };
            view = <TierPickScreen
              founderCount={_founderCount}
              founderTotal={_founderMax}
              founderRemaining={_founderRemaining}
              pricing={_pricing}
              onChoose={_onChoose}
              // V49/Bug#4: hardcoded Settings nav instead of goBack history-pop.
              // History-pop breaks when user lands on tier_pick as first page
              // (direct URL, refresh, PWA reload, post-Stripe redirect with
              // history loss). Hardcoded route = predictable destination.
              // forcedChoice (Day 7 gate) still hides the back arrow entirely
              // — this prop only matters when the user can see the button.
              onBack={() => go('settings')}
              forcedChoice={_forcedTierPick}
            />;
          }
          break;
        case 'subscription':
          // V38/Phase2 — Subscription Settings (state router replacing PremiumScreen).
          // V49/Bug#4: Back + Done both hardcoded to 'settings'. Same destination,
          // robust against history loss (direct URL, refresh, PWA reload, Stripe
          // return). User always knows they'll land on Settings.
          view = <SubscriptionSettingsScreen
            subState={subState}
            sync={groundedApi && groundedApi.groundedSync}
            onTierPick={() => go('tier_pick')}
            onBack={() => go('settings')}
            onHome={() => go('settings')}
          />; break;
        case 'premium':
          // V38: legacy alias — old 'premium' route redirected to 'subscription'.
          // Defensive: any leftover go('premium') calls (or persisted screen state
          // from older versions) land on the new route. setScreen avoids history
          // pollution. Wrapped in useEffect to avoid setState during render.
          // V49/Bug#4: Back hardcoded to Settings (same as 'subscription' case).
          view = <SubscriptionSettingsScreen
            subState={subState}
            sync={groundedApi && groundedApi.groundedSync}
            onTierPick={() => go('tier_pick')}
            onBack={() => go('settings')}
            onHome={() => go('settings')}
          />; break;
        case 'paywall':
          // V38: paywall route preserved as defensive fallback. Gate now redirects
          // to tier_pick/subscription based on subState.status; this case fires only
          // for unknown/edge states.
          view = <PaywallScreen />; break;
        case 'reflection':
          // V16/Bug10: two callbacks — onSaveDraft (resumable) + onSubmit (locked + go home).
          view = <ReflectionScreen data={data}
            onSaveDraft={(q, a, vk) => { saveReflection(q, a, vk, false); /* V17/Bug11: no navigate — user stays to keep typing */ }}
            onSubmit={(q, a, vk) => { saveReflection(q, a, vk, true); go('home'); }}
            onSkip={() => go('home')}
            onHome={() => go('home')}
            onHistory={() => go('reflection_calendar')}
            onSetupMirror={() => go('mirror_edit_core')} />; break;
        case 'reflection_calendar':
          view = <ReflectionCalendar data={data} onBack={() => go('reflection')} />; break;
        case 'freewrite':
          // V16/Bug10: same two-callback pattern.
          view = <FreeWriteScreen data={data}
            onSaveDraft={(t) => { saveFreeWrite(t, false); /* V17/Bug11: no navigate — user stays to keep typing */ }}
            onSubmit={(t) => { saveFreeWrite(t, true); go('home'); }}
            onHome={() => go('home')}
            onHistory={() => go('freewrite_calendar')} />; break;
        case 'freewrite_calendar':
          view = <FreeWriteCalendar data={data} onBack={() => go('freewrite')} />; break;

        // ==== GROUND ME ====
        case 'gm_triage':
          view = <GroundMeTriage
            onPick={(target, tri) => { setGroundMeFrom(target); setPendingTriage(tri); go(target); }}
            onHome={() => go('home')}
            onHistory={() => go('gm_calendar')} />; break;
        case 'gm_calendar':
          view = <GroundMeCalendar data={data} onBack={() => go('gm_triage')} />; break;
        case 'gm_reminder':
          view = <GroundMeReminder data={data}
            onMoment={() => { setGroundMeFrom('gm_reminder'); go('gm_moment'); }}
            onTalk={() => { recordGroundMe('reminder', 'need_to_talk'); go('gm_support'); }}
            onRemember={() => { recordGroundMe('reminder', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_struggling':
          view = <GroundMeGentle data={data}
            onMoment={() => { setGroundMeFrom('gm_struggling'); go('gm_moment'); }}
            onTalk={() => { recordGroundMe('struggling', 'need_to_talk'); go('gm_support'); }}
            onRemember={() => { recordGroundMe('struggling', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_hard':
          view = <GroundMeHard data={data}
            onMoment={() => { setGroundMeFrom('gm_hard'); go('gm_moment'); }}
            onRemember={() => { recordGroundMe('hard', 'i_remember'); go('home'); }}
            onHome={() => go('home')} />; break;
        case 'gm_moment':
          view = <TakeMoment onReturn={() => {
            const tri = triageOf(groundMeFrom);
            if (tri) recordGroundMe(tri, 'take_moment');
            go(groundMeFrom);
          }} />; break;
        case 'gm_support':
          // PATTERN B (multi-entry — gm_reminder, gm_struggling, gm_hard all
          // route here via "Need to talk?" CTA). goBack respects which GM
          // sub-screen user came from; hardcoded to triage loses that.
          view = <NeedToTalk onBack={goBack} />; break;

        // ==== MIRROR ====
        case 'my_mirror':
          view = <MyMirrorScreen data={data}
            onHome={() => go('home')}
            onNav={navTo}
            onEditCore={() => go('mirror_edit_core')}
            onEditField={(k) => { setActiveMirrorField(k); go('mirror_edit_field'); }}
            onHistory={() => go('mirror_calendar')} />; break;
        case 'mirror_edit_core':
          view = <MirrorEditCore data={data}
            onSave={(patch) => { saveMirrorChanges(patch); go('my_mirror'); }}
            onBack={() => go('my_mirror')} />; break;
        case 'mirror_edit_field': {
          const f = MIRROR_FIELDS.find(x => x.key === activeMirrorField) || MIRROR_FIELDS[0];
          view = <MirrorEditText field={f} current={data[f.key] || ''}
            onSave={(t) => { saveMirrorChanges({ [f.key]: t }); go('my_mirror'); }}
            onBack={() => go('my_mirror')} />; break;
        }
        case 'mirror_calendar':
          view = <MirrorCalendar data={data} onBack={() => go('my_mirror')} />; break;

        // ==== LAUNCHPAD ====
        case 'launchpad':
          view = <LaunchpadScreen data={data}
            onHome={() => go('home')}
            onTick={(id, slot) => tickLaunchpad(id, slot)}
            onHistory={() => go('launchpad_calendar')}
            onSetupMirror={() => go('mirror_edit_core')} />; break;
        case 'launchpad_calendar':
          view = <LaunchpadCalendar data={data} onBack={() => go('launchpad')} />; break;

        // ==== PRACTICE ====
        case 'practice_welcome':
          view = <PracticeWelcome
            onChoose={() => { updateData({ practiceWelcomeSeen: true }); go('my_practice'); }}
            onBack={() => { updateData({ practiceWelcomeSeen: true }); goBack(); }} />; break;
        case 'my_practice':
          view = <MyPracticeScreen
            data={data}
            onHome={() => go('home')}
            onNav={navTo}
            onInfo={() => go('practice_info')}
            onStart={(id) => { setActiveExerciseId(id); go('exercise_entry'); }}
            onAddOrChange={() => go('exercise_store')}
            onHistory={() => go('calendar')}
            onRemove={(id) => removeFromPractice(id)}
          />; break;
        case 'exercise_store':
          view = <ExerciseStore data={data}
            onBack={() => go('my_practice')}
            onToggle={(id) => toggleStoreExercise(id)}
            onInfo={(id) => { setActiveInfoExerciseId(id); go('exercise_info'); }} />; break;
        case 'exercise_info': {
          // PATTERN B (multi-entry — ExerciseStore ⓘ AND MyPractice list ⓘ
          // both route here). goBack respects which context the user was in.
          const ex = ALL_EXERCISES.find(e => e.id === activeInfoExerciseId) || ALL_EXERCISES[0];
          view = <ExerciseInfo exercise={ex} onBack={goBack} />;
          break;
        }
        case 'exercise_entry': {
          // PATTERN B (multi-entry — MyPractice list tap AND store→start flow
          // both route here). goBack respects which context the user was in;
          // hardcoded to my_practice would skip the store path entirely.
          const ex = ALL_EXERCISES.find(e => e.id === activeExerciseId) || ALL_EXERCISES[0];
          // V16/Bug10: pass existing entry for resume / locked-state detection,
          // plus two callbacks (draft + submit). After-save screen only shows on submit.
          const today = todayKey();
          const existing = (data.completed && data.completed[today] && data.completed[today][ex.id]) || null;
          view = <ExerciseEntry
            exercise={ex}
            existing={existing}
            onSaveDraft={(items) => { saveExerciseEntry(ex.id, items, false); /* V17/Bug11: no navigate — user stays to keep typing */ }}
            onSubmit={(items) => { saveExerciseEntry(ex.id, items, true); go('after_save'); }}
            onBack={goBack} />;
          break;
        }
        case 'after_save':
          view = <AfterSave onBack={() => go('my_practice')} />; break;
        case 'calendar':
          view = <PracticeCalendar data={data} onBack={() => go('my_practice')} />; break;
        case 'practice_info':
          view = <PracticeInfo onBack={() => go('my_practice')} />; break;

        case 'settings':
          view = <SettingsScreen
            onHome={() => go('home')}
            onNav={navTo}
            // V38: rewired to new 'subscription' route — same DRY destination
            // as Account "Manage →" and Day-7 forced gate.
            onPremium={() => go('subscription')}
            onSupport={() => go('support')}
            onAccount={() => enterAccount()}
            onNotif={() => go('notifications')}
            onLanguage={() => go('language')}
            onExport={() => go('export_data')}
            onPrivacy={() => go('privacy')}
            onLogout={async () => {
              // V15/E8: async sign-out. The auth listener (A3) catches the
              // sign-out event and the resolver (J1) routes back to welcome.
              // No manual navigation here — keeps state transitions centralized.
              if (groundedApi && groundedApi.groundedAuth) {
                try {
                  await groundedApi.groundedAuth.signOut();
                } catch (e) {
                  // Silent per project decision; backlog ticket for v1.0.x polish.
                  // Listener won't fire on failure, so user stays on Settings —
                  // no broken state, just a quietly failed retry path.
                  console.warn('[E8] signOut failed:', e);
                }
              } else {
                // Fallback: firebase.js not loaded (localStorage-only mode).
                // Mirror V14 behavior — clear in-memory + route to welcome.
                // V27: also clear nav history so post-signout context is clean.
                setData({});
                clearHistory();
                setScreen('welcome');
              }
            }}
          />; break;
        // V38: legacy 'premium' route case removed — replaced by 'subscription'
        // case above (line 5828) and an explicit 'premium' alias (line 5837)
        // for backward-compat. PremiumScreen component deleted with V38.
        case 'support':
          view = <SupportScreen onBack={() => go('settings')} />; break;
        case 'account':
          // V15/Bug4: AccountScreen reads form values from accountDraft instead
          // of data. enterAccount() initializes the draft before this case fires.
          view = <AccountScreen
            draft={accountDraft}
            onUpdateDraft={updateAccountDraft}
            onCommit={(patch) => commitAccountDraft(patch)}
            onExit={() => exitAccount()}
            onManagePlan={() => go('subscription')}
            onChangeEmail={() => go('change_email')}
            onChangeMobile={() => go('change_mobile')}
            onChangePassword={() => go('change_password')}
            onDeleteAccount={() => {
              // V15/Bug4: defensive — account is being deleted, draft is meaningless.
              // V27: clear nav history so user can't goBack into the deleted account.
              setAccountDraft(null);
              localStorage.removeItem(LS_KEY); setData({});
              clearHistory();
              setScreen('welcome');
            }}
          />; break;
        case 'change_email':
          // V15/Bug4: writes to accountDraft (not data.user). Email change only
          // commits to data.user when user taps Done in Account.
          view = <ChangeEmailScreen data={data}
            onBack={() => go('account')}
            onSaved={(newEmail) => {
              updateAccountDraft({ email: newEmail });
              go('account');
            }} />; break;
        case 'change_mobile':
          // V15/Bug4: writes to accountDraft (not data.user). Same commit point as email.
          view = <ChangeMobileScreen data={data}
            onBack={() => go('account')}
            onSaved={(newMobile) => {
              updateAccountDraft({ mobile: newMobile });
              go('account');
            }} />; break;
        case 'change_password':
          view = <ChangePasswordScreen onBack={() => go('account')} onSaved={() => go('account')} />; break;
        case 'notifications':
          view = <NotificationsScreen data={data}
            onBack={() => go('settings')}
            onSave={(notifications) => { updateData({ notifications }); go('settings'); }} />; break;
        case 'language':
          view = <LanguageScreen data={data}
            onBack={() => go('settings')}
            onSave={(lang) => { updateData({ lang }); go('settings'); }} />; break;
        case 'export_data':
          view = <ExportDataScreen data={data} onBack={() => go('settings')} onHome={() => go('settings')} />; break;
        case 'privacy':
          view = <PrivacyScreen onBack={() => go('settings')} onHome={() => go('settings')} />; break;

        default:
          view = <WelcomeScreen
            hasGoogleAuth={!!groundedApi}
            onGoogle={async () => {
              if (!groundedApi || !groundedApi.groundedAuth) return { ok: false, code: 'no-auth' };
              return groundedApi.groundedAuth.signInWithGoogle();
            }}
            onSignUpEmail={() => go('signup')}
            onSignIn={() => go('signin')}
            onContinueAnon={() => go('resonance')}
          />;
      }

      const devScreens = [
        ['welcome','Welcome'],
        ['resonance','Resonance'],
        ['in_right_place','InRightPlace'],
        ['grounded_already','GroundedAlready'],
        ['well_be_here','WellBeHere'],
        ['promise','Promise'],
        ['signup','SignUp'],
        ['signin','SignIn'],
        // V30/Phase2 — auth-adjacent + subscription routes
        ['trial_welcome','TrialWelcome'],
        ['take_your_time','TakeYourTime'],
        ['tier_pick','TierPick'],
        ['paywall','Paywall'],
        ['values','Values'],
        ['no_worries','NoWorries'],
        ['top3','Top3'],
        ['comfort','Comfort'],
        ['thats_okay','ThatsOkay'],
        ['aligned_self','AlignedSelf'],
        ['no_pressure','NoPressure'],
        ['mirror_ready','MirrorReady'],
        ['home','Home'],
        ['reflection','Reflection(11)'],
        ['reflection_calendar','RefCal(11A)'],
        ['freewrite','FreeWrite(12)'],
        ['freewrite_calendar','FWCal(12A)'],
        ['gm_triage','GroundMe(15)'],
        ['gm_reminder','GM-Reminder(15A)'],
        ['gm_struggling','GM-Gentle(15B)'],
        ['gm_hard','GM-Hard(15C)'],
        ['gm_moment','TakeMoment(15D)'],
        ['gm_support','GM-Support(15E)'],
        ['gm_calendar','GMCal(15F)'],
        ['my_mirror','MyMirror(13)'],
        ['mirror_edit_core','EditCore(13A)'],
        ['mirror_edit_field','EditField(13B-F)'],
        ['mirror_calendar','MirrorCal(13G)'],
        ['launchpad','Launchpad(14)'],
        ['launchpad_calendar','LpCal(14A)'],
        ['practice_welcome','PracticeWel(19A)'],
        ['my_practice','MyPractice(19)'],
        ['exercise_store','Store(19B)'],
        ['exercise_info','ExInfo(19B1-4)'],
        ['exercise_entry','Entry(19C1-4)'],
        ['after_save','AfterSave(19C)'],
        ['calendar','PracCal(19D)'],
        ['practice_info','PracInfo(19E)'],
        ['settings','Settings'],
        ['account','Account'],
        ['change_email','EditEmail'],
        ['change_mobile','EditMobile'],
        ['change_password','EditPw'],
        ['notifications','Notifs'],
        ['language','Language'],
        ['export_data','Export'],
        ['privacy','Privacy'],
        ['subscription','Subscription'],
        ['support','Support'],
      ];

      return (
        <div className="stage">
          {view}
          {/* V15/Bug6: MigrationOverlay moved to early-return precedence above
              (replaces the old layered render that sat on top of {view}). */}
          {/* V49/M2: post-checkout / post-portal return toast. Surfaces over
              any rendered view (fixed positioning). Auto-clears after 4s for
              success/cancel; cleared immediately for portal-return after
              setScreen('home') fires. */}
          {returnNotice && (
            <div className="fixed left-1/2 -translate-x-1/2 bottom-8 px-5 py-3 rounded-full text-[14px] text-white shadow-lg fade-in"
                 style={{ backgroundColor: 'rgba(61, 94, 76, 0.95)', maxWidth: '90vw', zIndex: 100 }}
                 role="status">
              {returnNotice}
            </div>
          )}
          {/* V25/Phase2: Have-a-code modal — opened from Trial Welcome.
              groundedSyncRef passed so modal calls real redeemCode when
              Worker ships, otherwise gracefully shows "Coming soon" banner. */}
          {showRedeemModal && (
            <RedeemCodeModal
              groundedSyncRef={groundedSyncRef}
              onClose={() => setShowRedeemModal(false)}
              onSuccess={(r) => {
                setShowRedeemModal(false);
                // V25 stub: Backend Worker not yet shipped, so this branch
                // currently won't fire (modal stays in error state instead).
                // V25.x will route to a success toast / state update.
                if (r && r.effect === 'lifetime') console.log('[V29] redeem: lifetime');
                else if (r && r.effect === 'extendTrial') console.log('[V29] redeem: extend', r.days);

                // V29: Trial Welcome route — show MirrorReady celebration after
                // redeem. Anon → set TW flag, route through signup, post-auth
                // gate consumes flag and shows MirrorReady. Signed-in → no auth
                // roundtrip needed, route directly to MirrorReady (set+remove
                // flag defensively in case any other listener checks it).
                const isAnon = !(groundedApi && groundedApi.groundedAuth && groundedApi.groundedAuth.currentUser);
                try { localStorage.setItem('grounded_from_trial_welcome', '1'); } catch (e) {}
                if (isAnon) {
                  go('signup');
                } else {
                  try { localStorage.removeItem('grounded_from_trial_welcome'); } catch (e) {}
                  go('mirror_ready');
                }
              }}
            />
          )}
          {isDev && showDev && (
            <div className="fixed bottom-2 right-2 bg-white/95 backdrop-blur rounded-xl shadow-lg p-2 text-[10px] text-g-gray border border-gray-100 z-50" style={{maxWidth: 240}}>
              <div className="flex items-center justify-between mb-1">
                <div className="font-semibold text-g-charcoal">Dev jump (V18):</div>
                <button onClick={() => setShowDev(false)} className="text-g-gray text-base leading-none ml-2" aria-label="Hide">×</button>
              </div>
              <div className="flex flex-wrap gap-1 max-h-[280px] overflow-y-auto no-scrollbar">
                {devScreens.map(([key, label]) => (
                  <button key={key} onClick={() => {
                      if (key === 'exercise_entry') setActiveExerciseId('do_for_me');
                      if (key === 'exercise_info') setActiveInfoExerciseId('do_for_me');
                      if (key === 'mirror_edit_field') setActiveMirrorField('quote');
                      if (key === 'launchpad' || key === 'launchpad_calendar') ensureLaunchpadWeek();
                      go(key);
                    }}
                    className={`px-2 py-1 rounded-md text-[10px] ${screen === key ? 'bg-g-green text-white' : 'bg-g-sage text-g-deep'}`}
                  >{label}</button>
                ))}
              </div>
              <div className="mt-2 pt-2 border-t border-gray-100 flex gap-1 flex-wrap">
                <button
                  onClick={() => { localStorage.removeItem(LS_KEY); setData({}); go('welcome'); }}
                  className="px-2 py-1 rounded-md text-[10px] bg-red-50 text-red-700"
                >Reset</button>
                <button
                  onClick={() => {
                    const baseData = {
                      user: { email: 'parn@grounded.app' },
                      fiveValues: ['Freedom','Creativity','Growth','Impact','Honesty'],
                      topValues:  ['Freedom','Creativity','Growth'],
                      comfortable:   'At home with loved ones, slow handcraft, time alone, drawing, resting',
                      uncomfortable: 'Small talk, routine, being told what to do.',
                      alignedSelf:   'Curious, energetic, traveling, creating and exploring ideas.',
                      whatHelps:     'Going for a walk, journaling, calling a friend, music.',
                      quote:         'The more you f*ck around, the more you find out.',
                      practiceWelcomeSeen: true,
                      myExercises: ['do_for_me','thank_me','small_wins'],
                      mirrorBaselineDate: todayKey(),
                      mirrorHistory: {
                        [todayKey()]: {
                          isBaseline: true,
                          fiveValues: ['Freedom','Creativity','Growth','Impact','Honesty'],
                          topValues: ['Freedom','Creativity','Growth'],
                          comfortable: 'At home with loved ones, slow handcraft, time alone, drawing, resting',
                          uncomfortable: 'Small talk, routine, being told what to do.',
                          alignedSelf: 'Curious, energetic, traveling, creating and exploring ideas.',
                          whatHelps: 'Going for a walk, journaling, calling a friend, music.',
                          quote: 'The more you f*ck around, the more you find out.',
                        }
                      },
                      launchpadWeek: initLaunchpadWeek(['Freedom','Creativity','Growth']),
                      dailyQuestion: pickDailyReflection(['Freedom','Creativity','Growth']),
                    };
                    setData(baseData);
                    go('home');
                  }}
                  className="px-2 py-1 rounded-md text-[10px] bg-g-sage text-g-deep"
                >Demo data</button>
              </div>
            </div>
          )}
          {isDev && !showDev && (
            <button onClick={() => setShowDev(true)}
              className="fixed bottom-2 right-2 bg-white/95 rounded-full shadow-lg w-8 h-8 text-xs text-g-gray border border-gray-100 z-50"
              aria-label="Show dev panel">⋮</button>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
